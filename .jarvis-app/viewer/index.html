                              onOpen: b => { paintRail(b); showJobs(); } });
    const subEl = body.parentElement.querySelector('.head .label span');
    async function load() {
      data = await api('/api/schedules');
      const on = data.schedules.filter(s => s.enabled).length;
      subEl.textContent = `${plural(data.schedules.length, 'job')} · ${on} on`;
      return data;
    }
    jobsChanged = d => {
      if (d && d.schedules) data = d; else return load().then(jobsChanged).catch(() => {});
      const on = data.schedules.filter(s => s.enabled).length;
      subEl.textContent = `${plural(data.schedules.length, 'job')} · ${on} on`;
      if (body.parentElement.classList.contains('open')) paintRail(body);
      const cur = workEl.current;
      if (cur && cur.jobs && workEl.classList.contains('open')) cur.repaint && cur.repaint();
    };
    tourRefreshers.push(() => { data = null; if (body.parentElement.classList.contains('open')) paintRail(body); });
    const dot = s => {
      const bad = ['failed', 'skipped', 'missed'].includes(s.last_status);
      const [c, tip] = s.running ? ['#ffb347', 'Running now'] : !s.enabled ? ['#6b7088', 'Paused'] : bad ? ['#ff7a6b', 'On, but the last run went wrong'] : [accent, 'On'];
      return `<i class="jobdot" style="--dot:${c}" title="${escapeHtml(tip)}"></i>`;
    };
    const sched = s => s.enabled ? `${s.label} · next ${s.next_label}` : `${s.label} · paused`;

    function paintRail(b) {
      if (!data) {
        b.innerHTML = '<div class="note">Loading…</div>';
        load().then(() => paintRail(b)).catch(err => { b.innerHTML = `<div class="note error">${escapeHtml(err.message)}</div>`; });
        return;
      }
      b.innerHTML = '';
      data.schedules.forEach(s => itemButton(b, { name: s.name, sub: sched(s), color: s.enabled ? accent : '#6b7088',
                                                  onClick: () => showJob(s.id, false) }));
      if (!data.schedules.length) itemButton(b, { name: 'No jobs yet. Ask me to set one up.', dot: false });
    }

    showJobs = () => {
      const view = { kicker: 'Jobs', title: 'Scheduled jobs', accent, jobs: true,
        render: async (bar, content) => {
          linkButton(bar, '+ Add a job', () => openJobEditor && openJobEditor(null, data));
          linkButton(bar, '↻ Refresh', () => load().then(paint).catch(err => failInto(content, err)));
          const count = document.createElement('span'); count.className = 'count'; bar.appendChild(count);
          loadingInto(content, 'Loading…');
          try { if (!data) await load(); } catch (err) { failInto(content, err); return; }
          function paint() {
            const list = data.schedules;
            count.textContent = `${plural(list.length, 'job')} · ${list.filter(s => s.enabled).length} on`;
            content.innerHTML = list.length ? '' : '<div class="empty">No jobs yet. Ask me to set one up, or Add a job.</div>';
            list.forEach(s => {
              const who = [RUNNER[s.runner] || s.runner, (s.agents || []).join(', ')].filter(Boolean).join(' · ');
              const last = s.last_status ? `Last: ${SAY[s.last_status] || s.last_status}${s.last_label ? ' ' + s.last_label : ''}` : 'Not run yet';
              content.appendChild(rowEl('jobrow' + (s.enabled ? '' : ' off'),
                `<div class="when">${dot(s)}</div><div class="main"><div class="t">${escapeHtml(s.name)}</div>` +
                `<div class="m">${escapeHtml(sched(s))}</div><div class="m">${escapeHtml(who)} · ${escapeHtml(last)}</div></div>`,
                () => showJob(s.id, true)));
            });
          }
          view.repaint = paint;
          paint();
          const note = document.createElement('p'); note.className = 'jobsnote';
          note.textContent = `Jobs run while this computer is on. One missed while it was off runs once when Halo next starts (if it's recent), otherwise it shows as missed in your brief. At most ${data.cap} scheduled runs a day.`;
          content.after(note);
        } };
      openView(view, false);
    };

    showJobNamed = async name => {
      try { if (!data) await load(); } catch (_) {}
      const n = String(name || '').trim().toLowerCase();
      const s = n && data && (data.schedules.find(x => x.name.toLowerCase() === n) || data.schedules.find(x => x.name.toLowerCase().includes(n)));
      s ? showJob(s.id, false) : showJobs();
    };

    function showJob(id, fromList) {
      const find = () => data && data.schedules.find(x => x.id === id);
      const s0 = find();
      if (!s0) return showJobs();
      const view = { kicker: 'Job', title: s0.name, accent, jobs: true,
        render: (bar, content) => {
          function paint() {
            const s = find();
            if (!s) { content.innerHTML = '<div class="empty">This job has been removed.</div>'; return; }
            const brief = s.runner === 'brief';
            const tools = (s.tools || []).map(t => ((data.tools || []).find(x => x.id === t) || { name: t }).name);
            const row = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
            bar.innerHTML = '';
            linkButton(bar, brief ? 'Preview' : 'Run now', () => brief ? openBrief() : op('run'));
            linkButton(bar, s.enabled ? 'Pause' : 'Resume', () => op(s.enabled ? 'pause' : 'resume'));
            linkButton(bar, 'Schedule & settings', () => openJobEditor && openJobEditor(s, data));
            linkButton(bar, 'Run log', () => runLog(s));
            if (!s.builtin) linkButton(bar, 'Remove', () => { if (confirm(`Remove "${s.name}"?`)) op('remove').then(() => showJobs()); });
            const msgEl = document.createElement('span'); msgEl.className = 'count'; bar.appendChild(msgEl);
            content.innerHTML = `<div class="jobpage">
              ${s.about ? `<p class="about">${escapeHtml(s.about)}</p>` : ''}
              <dl>
                ${row('Status', `${dot(s)} ${s.running ? 'Running now' : s.enabled ? 'On' : 'Paused'}`)}
                ${row('Who does it', escapeHtml(RUNNER[s.runner] || s.runner) + ((s.agents || []).length
                    ? `<small>${s.runner === 'larry' ? 'Larry briefs the specialists. ' : ''}Worked on it so far or named in it: ${escapeHtml(s.agents.join(', '))}</small>` : ''))}
                ${row('How often', escapeHtml(s.label))}
                ${row('Next run', escapeHtml(s.enabled ? s.next_label : 'Paused'))}
                ${row('Last run', s.last_status ? escapeHtml(`${SAY[s.last_status] || s.last_status}${s.last_label ? ' · ' + s.last_label : ''}`) : 'Not run yet')}
                ${row('Tools', escapeHtml(tools.join(', ') || 'Notes only'))}
                ${row('When it finishes', escapeHtml((s.outputs || []).map(o => OUT[o] || o).join(', ') +
                    ((s.outputs || []).includes('note') ? ` in ${s.note_folder || 'Team Inbox'}` : '')))}
              </dl>
              <h4>Instructions</h4>
              ${brief ? `<p class="about">The daily brief is built in: it gathers what's due, what's waiting and what changed, plus today's calendar and email. Only its time can change (Schedule &amp; settings).</p>`
                : `<p class="hint">What the ${s.runner === 'larry' ? 'team' : 'helper'} is told each time it runs, in plain English. Edit and save; the next run uses it.</p>
                   <textarea class="jobprompt" rows="14" spellcheck="true">${escapeHtml(s.prompt || '')}</textarea>
                   <div class="saverow"><button type="button" class="link-btn on save">Save instructions</button><button type="button" class="link-btn undo">Undo changes</button><span class="msg"></span></div>`}
              ${s.last_result ? `<h4>Last result</h4><div class="lastres">${escapeHtml(s.last_result)}</div>` : ''}
            </div>`;
            const ta = content.querySelector('.jobprompt');
            if (ta) {
              const msg = content.querySelector('.msg'), save = content.querySelector('.save');
              const dirty = () => { const d = ta.value.trim() !== (s.prompt || '').trim(); save.disabled = !d; msg.textContent = d ? 'Unsaved changes' : ''; };
              ta.oninput = dirty; dirty();
              content.querySelector('.undo').onclick = () => { ta.value = s.prompt || ''; dirty(); };
              save.onclick = async () => {
                if (!ta.value.trim()) { msg.textContent = 'The instructions can’t be empty.'; return; }
                save.disabled = true; msg.textContent = 'Saving…';
                try {
                  jobsChanged(await api('/api/schedules', { op: 'update', id: s.id, job: {
                    name: s.name, runner: s.runner, prompt: ta.value, schedule: s.schedule, tools: s.tools,
                    outputs: s.outputs, note_folder: s.note_folder } }));
                  paint();
                  const m = content.querySelector('.msg'); if (m) m.textContent = 'Saved. The next run uses these instructions.';
                } catch (err) { msg.textContent = err.message; save.disabled = false; }
              };
            }
            async function op(name) {
              msgEl.textContent = name === 'run' ? 'Starting…' : 'Saving…';
              try {
                jobsChanged(await api('/api/schedules', { op: name, id: s.id }));
                if (workEl.current === view) { paint(); const m = bar.querySelector('.count'); if (m) m.textContent = name === 'run' ? 'Started: it shows in the tray' : 'Saved'; }
              } catch (err) { msgEl.textContent = err.message; }
            }
          }
          view.repaint = () => {   // a save elsewhere: repaint, but never over unsaved typing
            const ta = content.querySelector('.jobprompt');
            if (!ta || ta.value.trim() === ((find() || {}).prompt || '').trim()) paint();
          };
          paint();
        } };
      openView(view, fromList);
    }

    function runLog(s) {
      popup({ kicker: 'Job log', title: s.name, accent, render: async (bar, content) => {
        content.innerHTML = '<div class="loading">Loading…</div>';
        try {
          const { log } = await api(`/api/schedule-log?id=${encodeURIComponent(s.id)}`);
          content.innerHTML = log.length ? log.slice().reverse().map(r => `<div class="row-item"><div class="main"><div class="t">${escapeHtml(SAY[r.status] || r.status)} · ` +
            `${escapeHtml(new Date(r.at * 1000).toLocaleString())} · ${escapeHtml(r.trigger)}${r.secs ? ' · ' + r.secs + ' s' : ''}</div>` +
            `<div class="m" style="white-space:pre-line">${escapeHtml(r.result_head || '')}</div></div></div>`).join('')
            : '<div class="empty">Not run yet.</div>';
        } catch (err) { content.innerHTML = `<div class="loading error">${escapeHtml(err.message)}</div>`; }
      } });
    }
  })();

  // One email, read from Outlook (read only) and shown in the workspace.
  function openEmail(m) {
    openView({
      kicker: `Email · ${m.from || 'Outlook'}`, title: String(m.subject || '(no subject)'), accent: tc('#f7853b'),
      render: async (bar, content) => {
        if (m.link) linkButton(bar, 'Open in Outlook', () => window.open(m.link, '_blank', 'noopener'));
        linkButton(bar, 'Ask Halo about this', () => ask(`What do my notes say about ${m.subject}?`));
        loadingInto(content, 'Opening the email from Outlook… about 15 seconds the first time.');
        try {
          const e = await api(`/api/email?key=${encodeURIComponent(m.key)}`);

          content.innerHTML = `<div class="mail-head">${field('From', e.from)}${field('To', e.to)}${field('Cc', e.cc)}` +
            `${field('Date', e.date)}${e.attachments.length ? field('Attached', e.attachments.join(', ')) : ''}</div>`;

  function setActiveProject(p) {
    if (activeProject && activeProject.card) {
      activeProject.card.classList.remove('active');
      activeProject.card.setAttribute('aria-pressed', 'false');
    }
    activeProject = p;
    if (p) { p.card.classList.add('active'); p.card.setAttribute('aria-pressed', 'true'); }
  }

  // Light the project up across the galaxy, frame it, and show its summary in the side panel.
  function showProject(p) {
    stopSpeaking();
    focusNodes(p.nodes);
    setActiveProject(p);
    openProjectPanel(p);
  }

  // Summary panel for a project or an agent.
  function openProjectPanel(p) {
    const folder = p.folder;
    const inFolder = id => nodes[id].folder === folder || nodes[id].folder.startsWith(folder + '/');

    const pg = document.getElementById('p-group');
    pg.textContent = p.kind; pg.style.color = p.color;
    const pa = document.getElementById('p-actions');
    pa.innerHTML = '';
    if (p.kind === 'Project') linkButton(pa, '💬 Chat about this project', () => showProjectChat(p.name));
    else linkButton(pa, `💬 Chat with ${p.name}`, () => showTeamChat(p.name));
    document.getElementById('p-title').textContent = p.name;
    const own = p.nodes.filter(inFolder).length;
    document.getElementById('p-folder').textContent =
      `${p.nodes.length} notes across the vault · ${own} in ${folder}` +
      (p.deliverables == null ? '' : ` · ${p.deliverables} deliverable${p.deliverables === 1 ? '' : 's'}`);

    // Where the project lives: notes per top-level folder, busiest first.
    const byGroup = {};
    p.nodes.forEach(id => { byGroup[nodes[id].group] = (byGroup[nodes[id].group] || 0) + 1; });
    const spread = Object.entries(byGroup).sort((a, b) => b[1] - a[1]).map(([g, n]) => `${g} ${n}`).join(' · ');
    document.getElementById('p-excerpt').textContent =
      (p.description || (p.kind === 'Project' ? 'No description in Projects.md yet.' : 'No description yet.')) + `\n\nWhere it lives: ${spread}`;

    // Notes arrive most relevant first (own folder, named after it, most mentions).
    const ids = p.nodes;
    document.getElementById('p-ncount').textContent = `${p.kind === 'Project' ? 'Project' : 'Related'} notes · ${ids.length}`;
    const box = document.getElementById('neighbors');
    box.innerHTML = '';
    ids.slice(0, 120).forEach(id => {
      const b = document.createElement('button');
      b.textContent = nodes[id].label;
      b.style.borderColor = groupColor[nodes[id].group] + '66';
      b.onclick = () => select(nodes[id]);
      box.appendChild(b);
    });
    box.scrollTop = 0;
    document.getElementById('p-excerpt').scrollTop = 0;
    projectDeliverables(p.kind === 'Project' ? p : null);

    const panel = document.getElementById('panel');
    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
    document.body.classList.add('panel-open');
  }

  // A project's files are whatever the team has filed in its workspace folder
  // (copilot/projects/<name>/), less the files that run the project itself, shown as a folder tree.
  let deliverablesFor = 0;
  async function projectDeliverables(p) {
    const head = document.getElementById('p-dhead'), box = document.getElementById('p-deliverables');
    const token = ++deliverablesFor;   // a newer panel wins over a slow listing
    head.hidden = box.hidden = !p;
    if (!p) return;
    head.textContent = 'Files';
    box.innerHTML = '<div class="note">Loading…</div>';
    const tree = document.createElement('div'); tree.className = 'tree';
    let data;
    try { data = await folderTree(tree, { key: 'project:' + p.name, color: p.color, refresh: () => projectDeliverables(p) }); }
    catch (err) { if (token === deliverablesFor) box.innerHTML = `<div class="note error">${escapeHtml(err.message)}</div>`; return; }
    if (token !== deliverablesFor) return;
    head.textContent = `Files · ${data.entries.length}`;
    box.innerHTML = '';
    const tools = document.createElement('div'); tools.className = 'tools';
    linkButton(tools, '📂 Open folder', () => showFolder('project:' + p.name, p.name, '', p.color), "Show the project's files in the main window");
    linkButton(tools, '⤢ Pop out', () => popProjectFiles(p), 'Show the folder tree in its own window');
    box.appendChild(tools);
    const where = document.createElement('div'); where.className = 'tree-root'; where.textContent = data.folder + '/';
    box.appendChild(where);
    if (!data.entries.length) {
      const n = document.createElement('div'); n.className = 'note';
      n.textContent = "Nothing filed in this project's folder yet.";
      box.appendChild(n);
    }
    box.appendChild(tree);
    box.scrollTop = 0;
  }
  function popProjectFiles(p) {
    popup({
      kicker: 'Project files', title: p.name, accent: p.color, kind: 'deliverables',
      render: async (bar, content) => {
        const key = 'project:' + p.name;
        const paint = async () => {
          loadingInto(content, 'Loading…');
          const tree = document.createElement('div'); tree.className = 'tree';
          try {
            const data = await folderTree(tree, { key, color: p.color, refresh: paint });
            content.innerHTML = `<div class="tree-root" style="margin-top:10px">${escapeHtml(data.folder)}/</div>`;
            content.appendChild(data.entries.length ? tree : Object.assign(document.createElement('div'),
              { className: 'empty', textContent: "Nothing filed in this project's folder yet." }));
          } catch (err) { failInto(content, err); }
        };
        linkButton(bar, '📂 Open folder', () => showFolder(key, p.name, '', p.color), 'Show the files in the main window');
        linkButton(bar, '↻ Refresh', paint);
        paint();
      }
    });
  }

  // A folder's files in the main window, centre screen, as a tree: click a folder to open it in
  // place, a note to read it here (Back returns to the files), any other file to open it in its app.
  // File Explorer stays one click away for moving or renaming things.
  function showFolder(key, title, path = '', color = tc('#ffc46b')) {
    openView({
      kicker: path ? `Files · ${title}` : 'Files', title: path ? path.split('/').pop() : title, accent: color,
      render: (bar, content) => {
        const paint = async () => {
          loadingInto(content, 'Loading…');
          const tree = document.createElement('div'); tree.className = 'tree';
          try {
            const data = await folderTree(tree, { key, color, refresh: paint }, path);
            content.innerHTML = `<div class="tree-root" style="margin-top:12px">${escapeHtml(data.folder + (path ? '/' + path : ''))}/</div>`;
            content.appendChild(data.entries.length ? tree : Object.assign(document.createElement('div'),
              { className: 'empty', textContent: 'Nothing in this folder yet.' }));
          } catch (err) { failInto(content, err); }
        };
        linkButton(bar, '↻ Refresh', paint);
        linkButton(bar, 'Show in File Explorer ↗', () => api('/api/reveal', { name: key, path })
          .then(() => setStatus('thinking', 'opened in File Explorer (it may be behind this window)', 4000))
          .catch(err => setStatus('error', err.message, 4000)), 'For moving or renaming files');
        paint();
      }
    }, false);
  }

  document.getElementById('close').onclick = clearSelection;
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (popups.length) { popups[popups.length - 1].close(); return; }
      if (workEl.classList.contains('open') && !workEl.classList.contains('min')) { closeWork(); return; }   // close the workspace first
      clearSelection(); stopSpeaking();
      document.getElementById('answer').classList.remove('show');
    }
  });

  // ---- ask your notes -----------------------------------------------------------------
  const askEl = document.getElementById('ask');
  const answerEl = document.getElementById('answer');
  const qEl = document.getElementById('q');
  const sendEl = document.getElementById('send');
  const stopEl = document.getElementById('stop');

  // Stop: ends Halo's answer in flight and every job Larry's team is running, straight away.
  function refreshStop() {
    stopEl.hidden = !(askEl.classList.contains('busy') || [...jobs.values()].some(j => j.status === 'running'));
  }
  stopEl.onclick = async () => {
    stopSpeaking();
    setStatus('error', 'stopping…');
    const running = [...jobs.values()].filter(j => j.status === 'running');
    await Promise.all([
      askEl.classList.contains('busy') ? api('/api/stop-answer', {}).catch(() => {}) : null,
      ...running.map(j => api('/api/jobs/stop', { id: j.id }).then(trackJob).catch(() => {}))
    ]);
    setStatus('thinking', running.length ? `stopped ${running.length === 1 ? "the team's job" : running.length + ' jobs'}` : 'stopped', 3000);
  };

  document.getElementById('ask-form').addEventListener('submit', e => {
    e.preventDefault();
    micOffForSend();                             // only the arrow (or Enter) sends what the mic heard
    ask(qEl.value.trim());
  });

  // CR-017: attach (📎), paste (Ctrl+V) or drop a file on the chat box and it goes straight into
  // Team Inbox. Chips above the box name what arrived; the next question tells Halo about them.
  const attachPick = document.getElementById('attach-file'), attachedEl = document.getElementById('attached');
  let chatAttached = [];
  document.getElementById('attach').onclick = () => attachPick.click();
  attachPick.onchange = () => { attachToInbox([...attachPick.files]); attachPick.value = ''; };
  function paintAttached() {
    attachedEl.hidden = !chatAttached.length;
    attachedEl.innerHTML = chatAttached.map((n, i) =>
      `<span class="chip" title="In Team Inbox: ${escapeHtml(n)}">📎 <span>${escapeHtml(n)}</span>` +
      `<button type="button" data-i="${i}" title="Don't mention it in my next question (the file stays in Team Inbox)">✕</button></span>`).join('');
  }
  attachedEl.onclick = e => { const b = e.target.closest('button[data-i]'); if (b) { chatAttached.splice(+b.dataset.i, 1); paintAttached(); } };
  function pastedName(f, i) {
    // Screenshots paste as "image.png": give them a dated name so they don't pile up as "image (7).png".
    if (f.name && !/^image\.\w+$/i.test(f.name)) return f.name;
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const ext = ((f.type || '').split('/')[1] || 'png').replace('jpeg', 'jpg').replace(/[^a-z0-9]/gi, '') || 'png';
    return `pasted-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}` +
           `${i ? '-' + (i + 1) : ''}.${ext}`;
  }
  async function attachToInbox(files) {
    const added = await uploadToInbox(files);
    if (added.length) { chatAttached = chatAttached.concat(added); paintAttached(); }
    qEl.focus();
  }
  // Shared by the main chat and project chat: files go to the Team Inbox root; returns the names saved.
  async function uploadToInbox(files) {
    if (!files.length) return [];
    const added = [], failed = [];
    for (const [i, f] of files.entries()) {
      setStatus('thinking', `Adding ${files.length > 1 ? `${i + 1} of ${files.length} ` : ''}to Team Inbox…`);
      try {
        const res = await fetch(`/api/upload?name=inbox&path=&file=${encodeURIComponent(f.name)}`, {
          method: 'POST', credentials: 'same-origin',
          headers: { 'X-Galaxy': '1', 'Content-Type': 'application/octet-stream' }, body: f
        });
        const data = await res.json().catch(() => ({ error: `Server error ${res.status}` }));
        if (!res.ok || data.error) throw new Error(data.error || `Server error ${res.status}`);
        added.push(data.name);
      } catch (err) { failed.push(`${f.name}: ${err.message}`); }
    }
    if (added.length) {
      if (inboxAdded) inboxAdded(added);
      setStatus('done', `Filed to Team Inbox: ${added.join(', ')}`, 5000);
      speak(added.length === 1 ? 'Filed to the Team Inbox.' : `${added.length} files filed to the Team Inbox.`);
    }
    if (failed.length) setStatus('error', failed.join(' · '), 8000);
    return added;
  }
  // Paste: in the chat box, or anywhere that isn't another text field. Plain text pastes as usual.
  window.addEventListener('paste', e => {
    const t = e.target;
    if (t !== qEl && t.closest && t.closest('input, textarea, select, [contenteditable=""], [contenteditable="true"]')) return;
    const files = [...((e.clipboardData && e.clipboardData.files) || [])];
    // Text copied from Word or a web page can carry a picture of itself too: text wins.
    if (!files.length || (e.clipboardData.getData('text/plain') || '').trim()) return;
    e.preventDefault();
    attachToInbox(files.map((f, i) => new File([f], pastedName(f, i), { type: f.type })));
  });

  // What Halo was asked to do, beyond answering: the server has already saved the note or
  // opened the file; the page shows the result.
  function handleAction(a) {
    if (a.type === 'note' && a.listen) { showNotes(null, true); setStatus('listening', 'take your note: Dictate is on', 5000); }
    else if (a.type === 'note') { setStatus('thinking', `note saved to ${a.path.split('/').slice(0, -1).join(' / ')}`, 4000); }

    const lines = raw.split('\n'), last = lines.pop();

    if (!(res.headers.get('Content-Type') || '').includes('ndjson') || !res.body) {
      const data = await res.json().catch(() => ({ error: `Server error ${res.status}` }));
      if (!res.ok || data.error) throw new Error(data.error || `Server error ${res.status}`);
      return data;

    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', raw = '', done = null, spoke = '', shown = 0;
    const handle = ev => {
      if (ev.t === 'm') { raw = ''; if (onText) onText(''); }
      else if (ev.t === 't') { if (spoke) { stopSpeaking(); spoke = ''; } raw = ''; if (onText) onText(''); }   // that was a lead-in to tool use

      if (value) buf += dec.decode(value, { stream: true });

        if (line) { try { handle(JSON.parse(line)); } catch (_) {} }
      }
      if (end) break;

    if (!done) throw new Error('The answer was cut off. Try again.');
    const data = done.result || {};
    if (done.status !== 200 || data.error) throw new Error(data.error || `Server error ${done.status}`);
    data.spokenEarly = spoke;
    return data;

  function renderVoiceToggle() {
    voiceToggle.innerHTML = voiceOn ? ICON.speaker : ICON.muted;

  }
  if (!synth) voiceToggle.hidden = true;
  renderVoiceToggle();

    if (!voiceOn) stopSpeaking();

  };

  // Halo mustn't hear himself (CR-002): while he speaks, any mic that's on is held (stopped, the
  // words so far kept in the box) and picks up again a moment after he finishes. Each mic adds a
  // { hold, resume } pair to micHolds while it's on. (var, not const: safe if called early.)
  var micHolds = new Set(), micsHeld = false, releaseTimer = null;
  function holdMics() {
    clearTimeout(releaseTimer);
    if (micsHeld) return;
    micsHeld = true;
    micHolds.forEach(h => { try { h.hold(); } catch (_) {} });
  }
  function releaseMics() {
    clearTimeout(releaseTimer);
    if (!micsHeld) return;
    releaseTimer = setTimeout(() => {                // let the room's echo die away first
      if (synth && synth.speaking) { releaseMics(); return; }
      micsHeld = false;
      micHolds.forEach(h => { try { h.resume(); } catch (_) {} });
    }, 700);
  }

  function stopSpeaking() {
    speakToken++;
    if (synth) synth.cancel();
    if (statusEl.classList.contains('speaking')) setStatus('');
    releaseMics();
  }

  var SPEECH_RATE = Number(SETUP.rate) || 1.2;   // 1 is the voice's natural pace, which sounds ponderous for a butler
  // One voice at a time: with Halo open in several tabs or windows, only the one you last
  // clicked or typed in speaks; the others stay quiet (they still show everything).
  const TAB_ID = Math.random().toString(36).slice(2);
  const claimVoice = () => { try { localStorage.setItem('jarvis-voice-owner', TAB_ID); } catch (_) {} };
  const ownsVoice = () => { try { const o = localStorage.getItem('jarvis-voice-owner'); return !o || o === TAB_ID; } catch (_) { return true; } };
  ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, claimVoice, true));
  window.addEventListener('focus', claimVoice);
  claimVoice();

  let lastSaid = { text: '', at: 0 };
  function speak(text, maxSentences = MAX_SPOKEN_SENTENCES) {
    if (!synth || !voiceOn || !text || !ownsVoice()) return;
    // Two triggers for one event (or two Halo tabs) would say the same line twice: skip a repeat
    // within ten seconds.
    const now = Date.now();
    try { const o = JSON.parse(localStorage.getItem('jarvis-last-said') || 'null'); if (o) lastSaid = o; } catch (_) {}
    if (lastSaid.text === text && now - lastSaid.at < 10000) return;
    lastSaid = { text, at: now };
    try { localStorage.setItem('jarvis-last-said', JSON.stringify(lastSaid)); } catch (_) {}
    stopSpeaking();
    const token = speakToken;
    const clean = text.replace(/[`*_#>|]/g, '').replace(/\s+/g, ' ').trim();
    // Chrome cuts off long utterances, so speak sentence-sized chunks back to back.
    // Only the answer itself is spoken, capped at a few sentences: the note is on screen.
    const chunks = (clean.match(/[^.!?]+[.!?]*\s*/g) || [clean]).slice(0, maxSentences);
    setTimeout(() => {               // let cancel() settle before queueing (Chrome quirk)
      if (token !== speakToken) return;
      holdMics();                    // no mic hears what he says
      synth.resume();
      chunks.forEach((chunk, i) => {
        const u = new SpeechSynthesisUtterance(chunk.trim());
        if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = 'en-GB'; }
        u.rate = SPEECH_RATE;
        u.pitch = voiceIsMale ? 0.92 : 0.7;   // a lower register if no male voice is installed
        u.onboundary = () => { voiceKick = 1; };   // each word gives the emblem a kick
        if (i === 0) u.onstart = () => { if (token === speakToken) setStatus('speaking', 'speaking…'); };
        if (i === chunks.length - 1) u.onend = u.onerror = () => {
          if (token === speakToken && statusEl.classList.contains('speaking')) setStatus('');
          if (token === speakToken) releaseMics();
        };
        synth.speak(u);
      });
    }, 60);
  }

  // ---- voice in: webkitSpeechRecognition ---------------------------------------------
  const micEl = document.getElementById('mic');
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  // Tap the mic to talk; tap it again to pause: what you said stays in the box and nothing is sent.
  // Tap again to carry on adding to it. Only the arrow (or Enter) sends (CR-005). While it's on, the
  // mic keeps listening through pauses: Chrome still ends a session now and then, so it quietly starts
  // a new one. While Halo speaks it is held, so it never types his own words (CR-002).
  let rec = null, listening = false, wantOn = false, kept = '', session = '', recError = null, heldForSpeech = false;
  // Each tap-on is one listening stretch. A tap-off can land while Chrome is between sessions (a
  // restart already queued): the turn counter stops that late session switching the mic back on.
  let turn = 0, sentTurn = 0, finishTurn = () => {}, micOffForSend = () => {};
  const FATAL_REC_ERRORS = new Set(['not-allowed', 'service-not-allowed', 'audio-capture']);

  const REC_ERRORS = {
    'not-allowed': 'microphone blocked: allow it from the icon in the address bar',
    'service-not-allowed': 'microphone blocked: allow it from the icon in the address bar',
    'no-speech': "didn't catch that, try again",
    'audio-capture': 'no microphone found',
    'network': 'speech recognition needs an internet connection',
  };
  const PAUSED_TEXT = 'paused · tap the mic to carry on, or the arrow to send';

  if (!Recognition) {
    micEl.hidden = true;
  } else {
    rec = new Recognition();
    rec.lang = navigator.language || 'en-GB';
    rec.interimResults = true;
    rec.continuous = true;
    rec.maxAlternatives = 1;

    const joinText = (a, b) => [a, b].map(s => s.trim()).filter(Boolean).join(' ');
    const micLook = on => {
      micEl.classList.toggle('on', on); micEl.classList.remove('held');
      micEl.setAttribute('aria-pressed', on ? 'true' : 'false');
      micEl.title = on ? 'Pause (the arrow sends)' : 'Ask by voice';
    };
    // Held while Halo speaks: stop listening, keep the words; resume picks up from the box.
    const mainHold = {
      hold() { if (!wantOn) return; heldForSpeech = true; micEl.classList.add('held'); try { rec.abort(); } catch (_) {} },
      resume() {
        if (!heldForSpeech) return;
        heldForSpeech = false; micEl.classList.remove('held');
        if (!wantOn) return;
        kept = qEl.value.trim(); session = ''; recError = null;
        try { rec.start(); } catch (_) { /* already starting */ }
      },
    };
    rec.onstart = () => {
      if (!wantOn || heldForSpeech) { try { rec.abort(); } catch (_) {} return; }   // a restart that arrived late
      listening = true;
      micLook(true);
      setStatus('listening', 'listening… tap the mic to pause, the arrow to send');
    };
    rec.onresult = e => {
      if (sentTurn === turn || heldForSpeech) return;   // sent or paused, or Halo is talking: ignore stragglers
      let text = '';
      for (const r of e.results) text += r[0].transcript;
      session = text;
      qEl.value = joinText(kept, session);       // live transcript in the input
    };
    rec.onerror = e => { recError = e.error; };
    rec.onend = () => {
      listening = false;
      if (wantOn && heldForSpeech) { kept = joinText(kept, session); session = ''; return; }   // resume() restarts it
      if (wantOn && !FATAL_REC_ERRORS.has(recError)) {   // ended by itself: carry on listening
        kept = joinText(kept, session); session = '';
        recError = null;
        setTimeout(() => { if (wantOn && !heldForSpeech) try { rec.start(); } catch (_) { /* already starting */ } }, 150);
        return;
      }
      finishTurn();
    };
    // The mic goes off (a second tap, or a fatal error): the words stay in the box, nothing is sent.
    finishTurn = () => {
      if (sentTurn === turn) return;             // already finished (a late onend after tap-off)
      sentTurn = turn;
      wantOn = false; heldForSpeech = false; micHolds.delete(mainHold);
      kept = ''; session = '';
      micLook(false);
      if (recError && FATAL_REC_ERRORS.has(recError))
        setStatus('error', REC_ERRORS[recError] || `voice error: ${recError}`, 5000);
      else if (qEl.value.trim()) setStatus('paused', PAUSED_TEXT);
      else if (recError === 'network') setStatus('error', REC_ERRORS.network, 5000);
      else setStatus('');
    };
    // The arrow or Enter while the mic is on: switch it off now and send what's in the box.
    micOffForSend = () => {
      if (!wantOn && !heldForSpeech) return;
      sentTurn = turn;
      wantOn = false; heldForSpeech = false; micHolds.delete(mainHold);
      kept = ''; session = '';
      try { rec.abort(); } catch (_) {}
      micLook(false);
    };
    micEl.onclick = () => {
      unlockSpeech();
      if (wantOn) {                              // second tap: pause, keep the words, send nothing
        wantOn = false;
        if (listening) rec.stop();               // its onend finishes the turn once the last words land
        else { try { rec.abort(); } catch (_) {} finishTurn(); }   // between sessions or held: finish now
        return;
      }
      if (askEl.classList.contains('busy')) return;
      stopSpeaking();                            // don't let it hear itself
      turn++;
      wantOn = true; heldForSpeech = false; session = ''; recError = null;
      kept = qEl.value.trim();                   // carry on from whatever is in the box
      micHolds.add(mainHold);
      try { rec.start(); } catch (_) { /* already starting */ }
    };
  }
  if (!rec) micEl.onclick = () => unlockSpeech();

  function showAnswer(question, text, ids, isError) {
    answerEl.innerHTML = '';
    const x = document.createElement('button');
    x.id = 'answer-close'; x.type = 'button'; x.textContent = '✕';
    x.title = 'Close'; x.setAttribute('aria-label', 'Close answer');
    x.onclick = () => { stopSpeaking(); answerEl.classList.remove('show'); };
    answerEl.appendChild(x);
    if (question) {
      const q = document.createElement('div'); q.className = 'q'; q.textContent = question;
      answerEl.appendChild(q);
    }
    const a = document.createElement('div'); a.textContent = text;
    answerEl.appendChild(a);
    if (ids.length) {
      const src = document.createElement('div'); src.className = 'sources';
      ids.forEach(id => {
        const b = document.createElement('button');
        b.textContent = nodes[id].label;
        b.style.borderColor = groupColor[nodes[id].group] + '88';
        b.onclick = () => select(nodes[id]);
        src.appendChild(b);
      });
      answerEl.appendChild(src);
    }
    answerEl.classList.toggle('error', !!isError);
    answerEl.classList.add('show');
  }

  // ---- jobs handed to Larry ----------------------------------------------------------
  // The server runs them in the vault; this tray follows them and reports back when they land.
  const jobsEl = document.getElementById('jobs');
  const jobs = new Map();
  let jobPoll = null, dismissed = new Set();
  try { dismissed = new Set(JSON.parse(localStorage.getItem('galaxy-dismissed-jobs') || '[]')); } catch (_) {}
  const DONE_LINES = [
    "Done. The filing is in, and nobody had to be shouted at.",
    "The team has finished. Penn was thorough, which is to say slightly smug about it.",
    "Job done, sir. Your notes are better organised than most of your clients' boundary documents.",
  ];
  const FAIL_LINES = [
    "A small setback. I have left a note explaining myself, at some length.",
    "The team hit a snag. The details are on screen, looking suitably apologetic.",
  ];
  const pick = list => list[Math.floor(Math.random() * list.length)];

  // Who did a finished job and what it was, for saying aloud: the specialists Larry handed work to
  // (Larry himself if he did it alone), and their brief, else the task cut to its first clause.
  function jobDoneBy(j) {
    const team = (j.agents || []).filter(a => a.name && a.name !== 'Larry' && a.name !== 'Subagent');
    const names = [...new Set(team.map(a => a.name))];
    const who = !names.length ? 'Larry' : names.length === 1 ? names[0]
      : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
    const brief = names.length === 1 && team.find(a => a.task) ? team.find(a => a.task).task : j.task || 'the job';
    let what = brief.split(/(?<=[.;])\s|\s\(|, (?:and |then )/)[0].replace(/[.;:,]+$/, '');
    if (what.length > 90) what = what.slice(0, 90).replace(/\s+\S*$/, '') + '…';
    return { who, what: what.charAt(0).toLowerCase() + what.slice(1) };
  }

  // With Halo open in two tabs, only the first to see a job finish says so.
  function firstToAnnounce(id) {
    try {
      const key = 'galaxy-announced-jobs', said = JSON.parse(localStorage.getItem(key) || '[]');
      if (said.includes(id)) return false;
      localStorage.setItem(key, JSON.stringify([...said, id].slice(-50)));
    } catch (_) {}
    return true;
  }

  function trackJob(job) {
    jobs.set(job.id, job);
    renderJobs();
    if (!jobPoll) jobPoll = setInterval(pollJobs, 5000);
  }

  async function pollJobs() {
    let data;
    try { data = await api('/api/jobs'); } catch (_) { return; }
    data.jobs.forEach(j => {
      const before = jobs.get(j.id);
      // Show jobs this page started, still running, or finished in the last half hour.
      if (!before && j.status !== 'running' && data.now - (j.finished || 0) > 1800) return;
      jobs.set(j.id, j);
      if (!before && j.status === 'running' && j.origin && j.origin !== 'user') jobs.set(j.id, j);
      if (before && before.status === 'running' && j.status !== 'running' && j.quiet) { /* scheduled, quiet: tray only */ }
      else if (before && before.status === 'running' && j.status !== 'running') {
        // The team's answer comes back through the front desk: shown in the chat card, and announced
        // once, as who finished what. The report itself is on screen: reading its first line out too
        // ("Richie, the draft is updated…") sounded like a second announcement.
        const { who, what } = jobDoneBy(j);
        const has = who.includes(' and ') ? 'have' : 'has';
        if (j.status === 'done' && j.report) showAnswer(`${who} ${has} completed · ${j.task}`, j.report, []);
        if (j.status === 'done' && j.document) openDoc(j.document, false);   // a document they asked for: up on screen
        if (firstToAnnounce(j.id)) speak(j.status === 'done'
          ? `${who} ${has} completed: ${what}.`
          : `${who} couldn't finish: ${what}. ` + pick(FAIL_LINES));
      }
    });
    renderJobs(data.now);
    // Keep checking while a job runs (also one found after a reload, which nothing else would follow
    // until the next question, so its finish was announced minutes late) and while a finished job's
    // galaxy rebuild is still going, for its Reload button.
    if ([...jobs.values()].some(j => j.status === 'running' || j.rebuilding)) { if (!jobPoll) jobPoll = setInterval(pollJobs, 5000); }
    else { clearInterval(jobPoll); jobPoll = null; }
    loadHires();   // a finished hiring job may have staged someone
  }


  // ---- daily brief (CR-014): the first open of the day shows a card and speaks a short summary ----
  // The server decides "first open of the day" (4am boundary), so it holds across tabs, browsers and
  // reloads; the page that wakes first claims it and is the only one that speaks it.
  let briefInfo = null, briefStarted = false;
  const briefLoad = skipWake ? Promise.resolve(null)
    : api('/api/brief?open=1').then(d => (briefInfo = d)).catch(() => null);
  briefLoad.then(d => {   // it arrived after the wake click: show it now (after the greeting)
    if (d && d.show && !waking && speechUnlocked && !briefStarted && !greetHeld) startBrief(d, false);
  });
  // Called from the wake click: true when the brief takes the greeting's place.
  function briefGreeting() {
    if (!briefInfo || !briefInfo.show || briefStarted) return false;
    startBrief(briefInfo, true);
    return true;
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function startBrief(info, greetIfNotMine) {
    briefStarted = true;
    let c = { claimed: false };
    try { c = await api('/api/brief', { op: 'seen' }); } catch (_) {}
    if (!c.claimed) { if (greetIfNotMine) speak(GREETING.replace('H.A.L.O.', 'Halo'), 8); return; }
    const win = showBrief(info);
    let d = info;
    for (let i = 0; i < 3 && String(d.outlook).startsWith('loading'); i++) {   // up to 6 s for Outlook
      await sleep(2000);
      try { d = await api('/api/brief'); } catch (_) { break; }
    }
    if (d !== info && win && win.isConnected) win.paint(d);
    speak(d.brief.spoken + (String(d.outlook).startsWith('loading') ? ' Your calendar and email are still on their way.' : ''), 5);
  }
  async function openBrief() {
    try { showBrief(await api('/api/brief?preview=1')); } catch (err) { setStatus('error', err.message, 5000); }
  }
  function showBrief(info) {
    popups.filter(p => p.dataset.kind === 'brief').forEach(p => p.close());
    let polls = 0, timer = null, win_paint = null;
    const win = popup({
      kicker: 'Daily brief', title: info.brief.date_label, accent: tc('#bad367'), kind: 'brief', big: true,
      render: (bar, content, tools) => {
        linkButton(tools, '↻ Refresh', async () => {
          try { await api('/api/brief', { op: 'refresh' }); } catch (_) {}
          polls = 0; watch();
        }, 'Fetch the calendar and email again');
        win_paint = d => paint(content, d);
        paint(content, info);
      }
    });
    win.paint = d => win_paint && win_paint(d);
    const watch = () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        if (!win.isConnected || polls++ > 20) return;
        let d; try { d = await api('/api/brief'); } catch (_) { return; }
        win.paint(d);
        if (String(d.outlook).startsWith('loading')) watch();
      }, 3000);
    };
    if (String(info.outlook).startsWith('loading')) watch();
    return win;
  }
  function paint(content, d) {
    const b = d.brief, esc = escapeHtml, o = b.outlook || null;
    const sec = (title, rows, note) => rows.length || note
      ? `<div class="bf-sec"><div class="bf-h">${title}</div>${note ? `<div class="bf-note">${note}</div>` : ''}${rows.join('')}</div>` : '';
    const row = (attrs, main, sub, flag) => `<button type="button" class="bf-row${flag ? ' ' + flag : ''}" ${attrs}>` +
      `<span class="t">${main}</span>${sub ? `<span class="s">${sub}</span>` : ''}</button>`;
    const decide = [
      ...b.approvals.map((r, i) => row(`data-ap="${i}"`, `${esc(r.asker || r.agent)} ${r.kind === 'question' ? 'has a question' : 'needs your approval'}`,
        esc(r.what || ''), 'warn')),
      ...b.hires.map(h => row('data-hires="1"', `${esc(h.name)} is waiting to join the team`, esc(h.role || ''), 'warn')),
      ...b.away.map(a => row('', `Refused while you were away: ${esc(a.asker || 'the team')}`, esc(a.what || a.tool), '')),
    ];
    const due = [
      ...b.overdue.map(a => row(`data-doc="${esc(a.path)}"`, esc(a.action), `Overdue · due ${esc(a.due_iso)}${a.org ? ' · ' + esc(orgName(a.org)) : ''}`, 'warn')),
      ...b.due_today.map(a => row(`data-doc="${esc(a.path)}"`, esc(a.action), `Due today${a.org ? ' · ' + esc(orgName(a.org)) : ''}`)),
      ...b.client_steps.map(s => row(`data-client="${esc(s.id)}"`, `${esc(s.client)}: ${esc(s.step)}`,
        `${esc(s.stream)} · ${esc(s.status)}${s.due ? ' · due ' + esc(s.due) : ''}`, s.status === 'blocked' ? 'warn' : '')),
    ];
    const outlookNote = d.outlook === 'ready' ? '' : String(d.outlook).startsWith('loading')
      ? 'Checking Outlook… this takes about 15 seconds.' : `Outlook: ${esc(String(d.outlook).replace(/^failed: /, ''))}`;
    const cal = o ? (o.events.length ? o.events.map(e => row('data-cal="1"', esc(e.title || ''), esc([`${e.start || ''}${e.end ? '–' + e.end : ''}`, e.location].filter(Boolean).join(' · '))))
                                     : [`<div class="bf-note">Nothing in the calendar today.</div>`]) : [];
    const mails = o ? o.emails.map((m, i) => row(`data-mail="${i}"`, esc(m.subject || '(no subject)'),
      esc([m.from, m.received].filter(Boolean).join(' · ')) + (m.needs_reply ? ' · <b>needs a reply</b>' : m.important ? ' · <b>important</b>' : ''),
      m.needs_reply || m.important ? 'warn' : '')) : [];
    const since = [
      ...mails,
      ...b.jobs.map((j, i) => row(`data-job="${i}"`, `${esc((j.agents || [])[0] || 'The team')} ${j.status === 'done' ? 'finished' : j.status === 'stopped' ? 'stopped' : "couldn't finish"}: ${esc((j.task || '').slice(0, 90))}`,
        String(j.origin || '').startsWith('schedule:') ? 'Scheduled job' : '', j.status === 'done' ? '' : 'warn')),
      ...b.schedule_events.map(e => row(`data-jobs="${esc(e.name)}"`, `${esc(e.name)}: ${esc(e.status)}`, esc(e.result_head || ''), 'warn')),
      ...b.inbox.map(f => row('data-inbox="1"', esc(f.name), 'New in Team Inbox')),
      ...(b.vault.count ? [row('data-vault="1"', `${b.vault.count} note${b.vault.count === 1 ? '' : 's'} changed`,
        esc(b.vault.by_folder.map(([f, n]) => `${f} ${n}`).join(' · ')))] : []),
      ...b.vault.newest.slice(0, 5).map(n => row(`data-doc="${esc(n.path)}"`, esc(n.title), esc(n.path.split('/').slice(0, -1).join('/')), 'sub')),
      ...(b.to_file ? [row('data-tofile="1"', `${b.to_file} note${b.to_file === 1 ? '' : 's'} waiting to be filed`, '')] : []),
    ];
    const html = sec('Needs your decision', decide) + sec('Due', due, !due.length && b.open_actions ? `Nothing due today. You have ${b.open_actions} open actions.` : '') +
      sec('Today’s calendar', cal, o ? '' : outlookNote) +
      sec(`Since ${esc(b.since_label || 'last time')}`, since);
    content.innerHTML = `<div class="bf-say">${esc(b.spoken)}</div>` + (html || '<div class="empty">All quiet. Nothing due, nothing waiting.</div>');
    content.onclick = e => {
      const t = e.target.closest('.bf-row'); if (!t) return;
      if (t.dataset.doc) openDoc(t.dataset.doc);
      else if (t.dataset.ap) { const r = b.approvals[+t.dataset.ap]; showTeamChat(r.agent, r.chat); }
      else if (t.dataset.hires) renderJobs();
      else if (t.dataset.client) openClients(t.dataset.client);
      else if (t.dataset.cal) popCalendar('today');
      else if (t.dataset.mail) openEmail(o.emails[+t.dataset.mail]);
      else if (t.dataset.job) { const j = b.jobs[+t.dataset.job]; showAnswer(`The team's report · ${j.task}`, j.report || '', []); }
      else if (t.dataset.jobs) showJobNamed(t.dataset.jobs);
      else if (t.dataset.inbox) showFolder('inbox', 'Team Inbox');
      else if (t.dataset.vault) showMeetings();
      else if (t.dataset.tofile) showNotes();
    };
  }

  // New hires: Nolan stages a new specialist's agent file; nothing joins the team until approved.
  let hires = [], announcedHires = new Set();
  async function loadHires() {
    try { hires = (await api('/api/hires')).hires; } catch (_) { return; }
    const fresh = hires.filter(h => !h.problem && !announcedHires.has(h.folder));
    fresh.forEach(h => announcedHires.add(h.folder));
    if (fresh.length) speak(`${fresh[0].name} is waiting for your approval to join the team.`);
    renderJobs();
  }
  function hireCard(h) {
    const el = document.createElement('div');
    el.className = 'job hire';
    el.innerHTML = `<div class="top"><span class="spin"></span><b>New hire</b><span>${escapeHtml(h.name)} · ${escapeHtml(h.role)}</span></div>` +
      (h.problem ? `<div class="problem">${escapeHtml(h.problem)}</div>`
                 : `<div class="what">${escapeHtml(h.description)}</div>` +
                   `<div class="tools-list">Tools: ${escapeHtml(h.tools.length ? h.tools.join(', ') : 'none listed')}</div>`);
    const tools = document.createElement('div'); tools.className = 'tools';
    const btn = (label, fn, cls) => { const b = document.createElement('button'); b.type = 'button';
      b.className = 'link-btn' + (cls ? ' ' + cls : ''); b.textContent = label; b.onclick = fn; tools.appendChild(b); return b; };
    if (h.contract) btn('Read contract', () => openDoc(h.contract));
    const decide = async (path, done) => {
      tools.querySelectorAll('button').forEach(b => { b.disabled = true; });
      try { const r = await api(path, { folder: h.folder }); done(r); }
      catch (err) { setStatus('error', err.message, 6000); tools.querySelectorAll('button').forEach(b => { b.disabled = false; }); }
      loadHires();
    };
    if (!h.problem) btn('Approve', () => decide('/api/hires/approve', r => {
      setStatus('thinking', `${r.name} has joined the team`, 5000);
      speak(`${r.name} has joined the team. Reload the page when convenient and they will appear among the agents.`);
    }), 'approve');
    btn('Decline', () => decide('/api/hires/decline', () => setStatus('thinking', `${h.name} declined; Nolan's draft is kept`, 5000)));
    el.appendChild(tools);
    return el;
  }

  // The tray is redrawn only when what it shows has changed, and only a card that's new rises in, so
  // the polling every few seconds no longer makes it flash (CR-003).
  let jobsHtml = '', jobsSeen = new Set();
  // CR-006: no static "standing by" card. The team button opens up in place (▾) to show each agent
  // at work: project, task and the step they're on, refreshed with the 5-second team poll.
  const crewNow = () => { try { return crew; } catch (_) { return null; } };   // crew is declared further down
  function renderJobs(now = Date.now() / 1000) {
    const box = document.createElement('div');
    const cw = crewNow();
    const live = cw ? cw.workers.filter(w => !w.done) : [];
    const liveAgents = [...new Set(live.map(w => w.agent))];
    const open = document.createElement('button');
    open.type = 'button'; open.className = 'job team-open'; open.dataset.key = 'open';
    // One button, no list in the tray: a click opens the team window in the middle of the screen.
    open.title = 'Open the team window: who is working on what, and anything waiting for you';
    open.innerHTML = `<span>👥</span><b>See what the team is doing</b><span class="n">` +
      `${liveAgents.length ? liveAgents.length + ' working' : ''}</span>`;
    open.onclick = () => showTeamActivity();
    box.appendChild(open);
    hires.forEach(h => { const c = hireCard(h); c.dataset.key = 'hire:' + h.folder; box.appendChild(c); });
    const shown = [...jobs.values()].filter(j => !dismissed.has(j.id)).slice(0, 3);
    shown.forEach(j => {
      const el = document.createElement('div');
      el.className = `job ${j.status}`; el.dataset.key = 'job:' + j.id;
      const mins = Math.max(0, Math.round(((j.finished || now) - j.started) / 60));
      const state = j.status === 'running' ? `working · ${mins} min` : j.status === 'done' ? `done · ${mins} min` : 'stopped';
      const sched = j.origin && j.origin !== 'user';
      el.innerHTML = `<div class="top"><span class="spin"></span><b>${sched ? '⏰ Scheduled' : 'Team'}</b><span>${state}</span>` +
        `<button class="x" type="button" title="Dismiss">✕</button></div>` +
        `<div class="what">${escapeHtml(j.status === 'running' ? (sched && j.label ? j.label : j.task) : j.report)}</div>` +
        (j.status === 'running' && j.activity ? `<div class="doing">● ${escapeHtml(j.activity)}…</div>` : '');
      el.querySelector('.x').onclick = () => {
        dismissed.add(j.id);
        try { localStorage.setItem('galaxy-dismissed-jobs', JSON.stringify([...dismissed].slice(-50))); } catch (_) {}
        renderJobs();
      };
      const tools = document.createElement('div'); tools.className = 'tools';
      const btn = (label, fn) => { const b = document.createElement('button'); b.type = 'button';
        b.className = 'link-btn'; b.textContent = label; b.onclick = fn; tools.appendChild(b); return b; };
      if (j.status === 'running' && j.chat && pendingByChat.has(j.chat)) {
        const review = btn(pendingByChat.get(j.chat).kind === 'question' ? '❓ Has a question for you' : '⚠ Needs your approval', () => showTeamChat('Larry', j.chat));
        review.classList.add('stop'); review.style.background = '#ffb347'; review.style.borderColor = '#ffb347'; review.style.color = '#10170a';
      }
      if (j.status === 'running') {
        const label = `${STOP_ICON}<span>Stop</span>`;
        const stop = btn('', async () => {
          stop.disabled = true; stop.textContent = 'Stopping…';
          try { trackJob(await api('/api/jobs/stop', { id: j.id })); }
          catch (err) { setStatus('error', err.message, 4000); stop.disabled = false; stop.innerHTML = label; }
        });
        stop.innerHTML = label;
        stop.classList.add('stop'); stop.title = 'Stop the team now';
      } else {
        btn('Read report', () => showAnswer(`The team's report · ${j.task}`, j.report, []));
        if (j.rebuilt) btn('↻ Reload galaxy', () => {
          try { sessionStorage.setItem('jarvis-skip-wake', '1'); } catch (_) {}   // no wake screen or greeting
          location.reload();
        });
      }
      el.appendChild(tools);
      box.appendChild(el);
    });
    const html = box.innerHTML;
    if (html !== jobsHtml) {
      jobsHtml = html;
      const keys = new Set();
      [...box.children].forEach(c => { keys.add(c.dataset.key); if (!jobsSeen.has(c.dataset.key)) c.classList.add('fresh'); });
      jobsSeen = keys;
      jobsEl.replaceChildren(...box.children);
    }
    if (teamWinPaint) teamWinPaint();
    refreshStop();
    renderContext();
  }

  // ---- team activity window (CR-003) ------------------------------------------------------
  // One readable window for "what is the team doing?": anything waiting on you (approve or answer
  // right there), who is working on what (project, task, the step they're on now), and what finished
  // recently. It refreshes every 3 seconds and redraws only what changed, so nothing flickers.
  var teamWin = null, teamWinPaint = null;   // var: renderJobs may run before this line
  function showTeamActivity() {
    if (teamWin && document.body.contains(teamWin)) { document.body.appendChild(teamWin); return; }
    teamWin = popup({ kicker: 'Team', title: 'What the team is doing', accent: tc('#ffb347'), kind: 'team', big: true,
      render: (bar, content, tools) => {
        content.classList.add('team-act');
        const asksEl = document.createElement('div'), listEl = document.createElement('div');
        content.append(asksEl, listEl);
        let cw = null, lastAsks = null, lastList = '', timer = null;
        const ago = s => { const m = Math.round(s / 60); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
        const paint = () => {
          if (!document.body.contains(content)) { clearInterval(timer); teamWinPaint = null; return; }
          const reqs = [...pendingByChat.values()];
          const key = reqs.map(r => r.ticket + ':' + (r.plain ? r.plain.length : 0)).join();
          if (key !== lastAsks) {                 // approval cards hold their own buttons: redraw only on change
            lastAsks = key; asksEl.innerHTML = '';
            if (reqs.length) {
              const h = document.createElement('h4'); h.textContent = `Waiting for you · ${reqs.length}`; asksEl.appendChild(h);
              reqs.forEach(r => {
                const card = approvalCard(r, () => { pendingByChat.delete(r.chat); lastAsks = null; paint(); });
                const open = document.createElement('button'); open.type = 'button'; open.className = 'link-btn';
                open.textContent = `Open ${r.agent}'s chat`; open.onclick = () => showTeamChat(r.agent, r.chat);
                card.querySelector('.ap-actions').appendChild(open);
                asksEl.appendChild(card);
              });
            }
          }
          const nowS = Date.now() / 1000, esc = escapeHtml;
          const working = cw ? cw.workers.filter(w => !w.done) : [];
          const byAgent = new Map();
          working.forEach(w => { if (!byAgent.has(w.agent)) byAgent.set(w.agent, []); byAgent.get(w.agent).push(w); });
          const projs = new Set(working.map(w => w.project));
          let sum = !cw ? 'Checking on the team…'
            : byAgent.size ? `${byAgent.size} ${byAgent.size === 1 ? 'agent is' : 'agents are'} working, on ${projs.size} ${projs.size === 1 ? 'project' : 'projects'}.`
            : 'Nobody is working right now.';
          if (reqs.length) sum += ` ${reqs.length} ${reqs.length === 1 ? 'thing needs' : 'things need'} you (above).`;
          let html = `<p class="ta-sum">${esc(sum)}</p>`;
          const running = [...jobs.values()].filter(j => j.status === 'running');
          if (running.length) {
            html += `<h4>Jobs under way · ${running.length}</h4>` + running.map(j =>
              `<div class="ta-row"><div class="ta-head"><i></i><b>Job for Larry's team</b><span class="ta-src">started ${ago(nowS - j.started)}</span></div>` +
              `<div class="ta-line"><span>Asked for</span>${esc(j.task)}</div>` +
              (j.activity ? `<div class="ta-line now"><span>Right now</span>${esc(j.activity)}</div>` : '') + '</div>').join('');
          }
          if (byAgent.size) {
            html += `<h4>Who is working on what · ${byAgent.size}</h4>` + [...byAgent].map(([name, ws]) =>
              `<div class="ta-row" style="--accent:${colourOf(name)}"><div class="ta-head"><i></i><b>${esc(name)}</b>` +
              `<span class="ta-src">${ws.some(w => w.source === 'job') ? 'on a job' : 'in a team chat'}</span></div>` +
              ws.map(w => `<div class="ta-line"><span>Project</span>${esc(w.project || 'General')}</div>` +
                (w.task ? `<div class="ta-line"><span>Task</span>${esc(w.task)}</div>` : '') +
                `<div class="ta-line now"><span>Right now</span>${esc(w.activity || 'thinking it through')}</div>`).join('') +
              `<div class="ta-tools"><button type="button" class="link-btn" data-chat-with="${esc(name)}">Chat with ${esc(name)}</button></div></div>`).join('');
          }
          const finished = [...jobs.values()].filter(j => j.status !== 'running' && nowS - (j.finished || 0) < 3 * 3600)
            .sort((x, y) => (y.finished || 0) - (x.finished || 0)).slice(0, 6);
          if (finished.length) {
            html += '<h4>Finished recently</h4>' + finished.map(j => {
              const { who } = jobDoneBy(j), ok = j.status === 'done';
              return `<div class="ta-row ${ok ? 'done' : 'failed'}"><div class="ta-head"><b>${esc(who)}</b>&nbsp;${ok ? 'finished' : "couldn't finish"}` +
                `<span class="ta-src">${ago(nowS - (j.finished || nowS))}</span></div><div class="ta-line">${esc(j.task)}</div>` +
                (j.report ? `<div class="ta-tools"><button type="button" class="link-btn" data-report="${esc(j.id)}">Read report</button></div>` : '') + '</div>';
            }).join('');
          }
          if (cw) {
            const free = (cw.team || []).filter(n => !byAgent.has(n));
            if (free.length) html += `<h4>Free</h4><p class="ta-free">${esc(free.join(', '))}</p>`;
          }
          if (html !== lastList) { lastList = html; listEl.innerHTML = html; }
        };
        listEl.addEventListener('click', e => {
          const c = e.target.closest('[data-chat-with]'), r = e.target.closest('[data-report]');
          if (c) { if (cw) crew = cw; chatWithBot(c.dataset.chatWith); }
          if (r) { const j = [...jobs.values()].find(x => String(x.id) === r.dataset.report); if (j) showAnswer(`The team's report · ${j.task}`, j.report, []); }
        });
        const poll = async () => {
          if (!document.body.contains(content)) { clearInterval(timer); return; }
          try { cw = await api('/api/current-work'); } catch (_) {}
          paint();
        };
        linkButton(tools, 'Office view', () => openCrew(), 'Show the team as bots in the office');
        teamWinPaint = paint;
        paint(); poll(); timer = setInterval(poll, 3000);
      } });
  }

  // ---- context gauge ------------------------------------------------------------------
  // Halo starts every question with a fresh, capped context (6 notes + the last 4 turns), so his
  // row shows the last answer. A job shows one row per agent: Larry plus each specialist he briefs,
  // each with its own window. Claude Code compacts an agent's conversation itself before it fills.
  const contextEl = document.getElementById('context');
  contextEl.innerHTML = '<div class="models"></div><div class="gauge"></div>';
  const gaugeEl = contextEl.querySelector('.gauge');
  let jarvisContext = null;
  const fmtTokens = n => n >= 1e9 ? `${(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `${(n / 1e6).toFixed(n % 1e6 ? 1 : 0)}M` : n >= 1000 ? `${Math.round(n / 1000)}k` : String(n);
  const gaugeColor = pct => pct < 50 ? tc('#bad367') : pct < 80 ? tc('#ff9f43') : tc('#ff5c7a');

  function contextRow(name, c, done) {
    const pct = c.window ? Math.min(100, (c.used / c.window) * 100) : 0;
    const shown = pct < 1 && pct > 0 ? '<1' : Math.round(pct);
    return `<div class="row${done ? ' done' : ''}" title="${escapeHtml(name)}: ${c.used.toLocaleString()} of ` +
      `${c.window.toLocaleString()} tokens"><b>${escapeHtml(name)}${done ? ' ✓' : ''}</b>` +
      `<div class="bar" style="--c:${gaugeColor(pct)}"><i style="width:${pct}%"></i></div>` +
      `<span class="num">${fmtTokens(c.used)} · ${shown}%</span></div>`;
  }

  function renderContext() {
    // Every running job, or else the most recent finished one still in the tray.
    let shown = [...jobs.values()].filter(j => j.status === 'running' && j.agents);
    if (!shown.length) shown = [...jobs.values()].filter(j => !dismissed.has(j.id) && j.agents).slice(0, 1);
    let html = `<div class="title"><span>Context</span><span>${fmtTokens((jarvisContext || {}).window || 1e6)} window</span></div>`;
    html += jarvisContext ? contextRow('Halo', jarvisContext) :
      '<div class="row"><b>Halo</b><div class="bar" style="--c:' + tc('#bad367') + '"><i style="width:0"></i></div><span class="num">idle</span></div>';
    let foot = 'Halo starts fresh each question, capped at 6 notes and 4 turns.', warn = false;
    shown.forEach((job, n) => {
      if (shown.length > 1) html += `<div class="foot">Job ${n + 1}: ${escapeHtml(job.task.slice(0, 48))}…</div>`;
      job.agents.forEach(a => { html += contextRow(a.name, a, job.status !== 'running' || a.done); });
    });
    if (shown.length) {
      const all = shown.flatMap(j => j.agents);
      const peak = Math.max(...all.map(a => a.used / (a.window || 1)));
      const compactions = shown.reduce((s, j) => s + (j.compactions || 0), 0);
      warn = peak >= 0.8 || compactions > 0;
      if (compactions) foot = `Compacted ${compactions}× so far to stay inside the window.`;
      else if (peak >= 0.8) foot = 'Getting full: Claude Code will compact this agent automatically.';
      else foot = shown[0].status === 'running' ? 'Each agent has its own window; specialists start empty.' :
                  `Last job peaked at ${Math.round(peak * 100)}% of the window.`;
    }
    html += `<div class="foot${warn ? ' warn' : ''}">${escapeHtml(foot)}</div>`;
    gaugeEl.innerHTML = html;
  }

  // ---- model switcher -------------------------------------------------------------------
  // Halo (answers, Outlook, transcripts) and Larry's team (background jobs) each have their own
  // model, saved in config.json on the server. A change applies from the next question or job.
  const modelsEl = contextEl.querySelector('.models');
  async function loadModels() {
    let m;
    try { m = await api('/api/models'); } catch (_) { return; }
    modelsEl.innerHTML = '';
    [['chat', 'Halo', 'Model for answers, Outlook and transcripts'],
     ['jobs', 'Team', 'Model for the team on background jobs']].forEach(([role, label, tip]) => {
      const b = document.createElement('b'); b.textContent = label; b.title = tip;
      const sel = document.createElement('select'); sel.title = tip; sel.setAttribute('aria-label', tip);
      const group = (label, list) => {
        const g = document.createElement('optgroup'); g.label = label;
        list.forEach(x => {
          const o = document.createElement('option');
          o.value = x.id; o.textContent = x.name + (x.note && x.note !== 'ChatGPT' ? ` · ${x.note}` : '');
          g.appendChild(o);
        });
        sel.appendChild(g);
      };
      group('Claude', m.models);
      if (role === 'chat' && (m.openai || []).length) group('ChatGPT', m.openai);
      sel.value = m[role];
      sel.onchange = async () => {
        const before = m[role];
        try {
          m = await api('/api/models', { [role]: sel.value });
          const name = [...m.models, ...(m.openai || [])].find(x => x.id === m[role]).name;
          setStatus('thinking', `${label} now on ${name}`, 3000);
        } catch (err) { sel.value = before; setStatus('error', err.message, 4000); }
      };
      modelsEl.append(b, sel);
    });
    // How much the team may do without asking (applies from the next job or chat message).
    const tip = 'What Larry and the team may do without asking you';
    const b = document.createElement('b'); b.textContent = 'Agents'; b.title = tip;
    const perm = document.createElement('select'); perm.title = tip; perm.setAttribute('aria-label', tip);
    [['auto', 'Auto · asks only for risky steps'], ['ask', 'Ask me · approve more steps']].forEach(([v, t]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = t; perm.appendChild(o);
    });
    perm.value = m.permissions || 'auto';
    perm.onchange = async () => {
      const before = m.permissions;
      try {
        m = await api('/api/models', { permissions: perm.value });
        setStatus('thinking', m.permissions === 'auto' ? 'agents on Auto: only risky steps will ask you' : 'agents will ask before more steps', 3500);
      } catch (err) { perm.value = before; setStatus('error', err.message, 4000); }
    };
    modelsEl.append(b, perm);
  }
  loadModels();
  renderJobs();
  pollJobs();   // pick up anything still running from before a reload
  setInterval(loadHires, 60000);   // hires can also be staged from Team chat or Claude Code

  // ---- H.A.L.O. emblem: the Carbonhalo mark --------------------------------------------
  // Five petals from the brand logo. Idle: the outline draws itself petal by petal, fills, then
  // sends out sonar rings while solid. Listening: pale and ripples. Thinking: fast even spin with a
  // bright petal chasing round. Speaking: steady spin, petals open and close with the words.
  const jarvisEl = document.getElementById('jarvis');
  const SVGNS = 'http://www.w3.org/2000/svg';   // also used by the tutorial's spotlight
  const halo = (() => {
    const NS = 'http://www.w3.org/2000/svg';
    const add = (parent, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
    const PETALS = [
      'M44.3513.0012A45.2618,45.2618,0,0,1,71.3378,8.9134c12.0207,8.9112,9.4169,22.413-.3761,22.413a22.5864,22.5864,0,0,1-21.5-15.597C46.91,7.8744,44.3513.0012,44.3513.0012Z',
      'M87.4668,31.3264a45.2624,45.2624,0,0,1-.1368,28.42c-4.76,14.186-18.4061,15.8819-21.4323,6.5683a22.5864,22.5864,0,0,1,8.19-25.2675Z',
      'M70.9982,82.0116a45.2628,45.2628,0,0,1-27.0711,8.6521C28.9644,90.52,23.1347,78.0662,31.0574,72.31a22.5864,22.5864,0,0,1,26.5616-.0192Z',
      'M17.7045,82.0116A45.2631,45.2631,0,0,1,1.1105,58.9392C-3.3766,44.6643,6.6662,35.2716,14.5889,41.0277a22.5867,22.5867,0,0,1,8.2262,25.2557C20.2628,74.1384,17.7045,82.0116,17.7045,82.0116Z',
      'M1.2359,31.3264A45.2622,45.2622,0,0,1,18.0513,8.4147c12.1895-8.6786,24.226-2.03,21.2,7.2838a22.5866,22.5866,0,0,1-21.4775,15.628Z'
    ];
    // True centre: the circle through the five petal tips (not the bounding-box middle), so it spins evenly.
    const CX = 44.3513, CY = 45.335, S = 0.98, TAU = Math.PI * 2;
    const mix = (a, b, t) => a + (b - a) * t;
    const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
    const ease = x => (x = clamp(x), x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
    const hex = h => { const m = /^#?([0-9a-f]{6})$/i.exec(String(h).trim()); return m ? [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16)) : [186, 211, 103]; };
    const GREEN = tc('#bad367'), PALE = tc('#f2f9e9');
    const G = hex(GREEN), W = hex(PALE);
    const colour = t => `rgb(${G.map((v, i) => Math.round(mix(v, W[i], t))).join(',')})`;
    document.querySelectorAll('#j-glow stop').forEach(s => s.setAttribute('stop-color', GREEN));

    const root = document.getElementById('j-scale');
    const glow = add(root, 'circle', { r: 58, fill: 'url(#j-glow)', opacity: 0.15 });
    const rings = [0, 1, 2].map(() => add(root, 'circle', { r: 46, fill: 'none', stroke: GREEN, 'stroke-width': 0.8, opacity: 0 }));
    const spinG = add(root, 'g', {});
    const C0 = [18.6 * S, -29.6 * S];   // first petal's middle, from the centre; the rest are 72 degree turns of it
    const petals = PETALS.map((d, i) => {
      const a = i * TAU / 5, c = [C0[0] * Math.cos(a) - C0[1] * Math.sin(a), C0[0] * Math.sin(a) + C0[1] * Math.cos(a)];
      const g = add(spinG, 'g', {});
      const p = add(g, 'path', { d, transform: `scale(${S}) translate(${-CX} ${-CY})`, fill: GREEN, stroke: GREEN, 'stroke-width': 1.1, 'stroke-linejoin': 'round' });
      let len = 0; try { len = p.getTotalLength(); } catch (_) {}
      return { g, p, c, ang: Math.atan2(c[1], c[0]), len: len || 120 };
    });
    const P = () => petals.map(() => ({ x: 0, y: 0, s: 1, a: 1, fill: 1, dash: null }));
    const bloom = b => petals.map(pt => ({ x: Math.cos(pt.ang) * b, y: Math.sin(pt.ang) * b, s: 1, a: 1, fill: 1, dash: null }));

    let rot = 0, spin = 0, idleT = 0, lastMode = '', cur = P(), g = { glow: 0.15, pale: 0 };
    function target(mode, t, dt, energy) {
      if (mode === 'idle') {
        idleT += dt;
        const u = idleT % 10, END = 8.6;
        const env = clamp((u - 3.4) / 0.6) * (1 - clamp((u - (END - 0.6)) / 0.6));
        const beat = env * (0.5 + 0.5 * Math.cos(Math.max(0, u - 3.4) * 0.55 * TAU * 3));
        return { spin: 0, beat, glow: u > 3 && u < END ? 0.22 + beat * 0.15 : 0.08,
          ripple: [0, 1, 2].map(j => { const fr = (Math.max(0, u - 3.4) * 0.55 + j / 3) % 1; return { r: 46 + fr * 13, a: env * 0.6 * (1 - fr) * Math.min(1, fr * 6) }; }),
          p: petals.map((_, i) => {
            const dash = u < END ? clamp((u - i * 0.4) / 0.8) : 1;
            const fill = u < 2.8 ? 0 : u < END ? ease((u - 2.8 - i * 0.08) / 0.5) : 1 - ease((u - END) / 0.9);
            return { x: 0, y: 0, s: 1 + beat * 0.02, a: u < END ? 1 : mix(1, 0.15, ease((u - END) / 0.9)), fill, dash };
          }) };
      }
      if (mode === 'listening') {
        const mic = Math.max(0, Math.sin(t * 7.3) * Math.sin(t * 2.1) + 0.25 * Math.sin(t * 17));
        return { spin: 1.5, pale: 1, glow: 0.2 + mic * 0.35,
          ripple: [0, 1, 2].map(j => { const fr = (t * (0.6 + mic * 0.6) + j / 3) % 1; return { r: 46 + fr * 12, a: (0.3 + mic * 0.5) * (1 - fr) }; }),
          p: bloom(1 + mic * 4) };
      }
      if (mode === 'thinking') {
        const head = (t * 2.2) % 5;
        return { spin: 200, glow: 0.35, p: P().map((q, i) => { const d = (i - head + 5) % 5; q.a = 0.3 + 0.7 * Math.max(0, 1 - d / 2.2); return q; }) };
      }
      // speaking: energy already follows the voice (word-boundary kicks over a speech-like flutter)
      return { spin: 160, glow: 0.25 + energy * 0.45, p: bloom(energy * 4) };
    }
    return function frame(now, dt, mode, energy) {
      if (mode !== lastMode) { if (mode === 'idle' && lastMode) idleT = 3.4; lastMode = mode; }   // back to idle: stay solid, no redraw
      const f = target(mode, now / 1000, dt, energy), k = Math.min(1, dt * 9), k2 = Math.min(1, dt * 5);
      spin = mix(spin, f.spin, Math.min(1, dt * 3));
      rot = (rot + spin * dt) % 360;
      g.glow = mix(g.glow, f.glow || 0, k2); g.pale = mix(g.pale, f.pale || 0, k2);
      cur = cur.map((q, i) => { const w = f.p[i]; return { x: mix(q.x, w.x, k), y: mix(q.y, w.y, k), s: mix(q.s, w.s, k), a: mix(q.a, w.a, k), fill: mix(q.fill, w.fill, k), dash: w.dash }; });
      spinG.setAttribute('transform', `rotate(${rot.toFixed(2)})`);
      glow.setAttribute('opacity', g.glow.toFixed(3));
      rings.forEach((c, j) => { const r = f.ripple && f.ripple[j]; c.setAttribute('opacity', r ? r.a.toFixed(3) : 0); if (r) c.setAttribute('r', r.r.toFixed(2)); });
      const col = colour(g.pale);
      petals.forEach((pt, i) => {
        const q = cur[i], [cx, cy] = pt.c;
        pt.g.setAttribute('transform', `translate(${(q.x + cx).toFixed(2)} ${(q.y + cy).toFixed(2)}) scale(${q.s.toFixed(3)}) translate(${(-cx).toFixed(2)} ${(-cy).toFixed(2)})`);
        pt.p.setAttribute('fill', col); pt.p.setAttribute('stroke', col);
        pt.p.setAttribute('fill-opacity', clamp(q.fill).toFixed(3));
        pt.p.setAttribute('opacity', clamp(q.a).toFixed(3));
        if (q.dash == null) pt.p.removeAttribute('stroke-dasharray');
        else pt.p.setAttribute('stroke-dasharray', `${(pt.len * clamp(q.dash)).toFixed(1)} ${pt.len.toFixed(1)}`);
      });
      return f.beat || 0;
    };
  })();

  let energy = 0, streamLevel = 0, lastFrame = performance.now();
  function animateJarvis(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    const mode = ['speaking', 'thinking', 'listening'].find(m => statusEl.classList.contains(m)) || 'idle';
    const speaking = mode === 'speaking';
    // While speaking: word-boundary kicks (where the voice reports them) over a speech-like flutter.
    voiceKick *= Math.pow(0.03, dt);
    const flutter = 0.45 + 0.55 * Math.abs(Math.sin(now / 95) * Math.sin(now / 247));
    const goal = speaking ? Math.max(flutter, voiceKick) : mode === 'thinking' ? 0.45 : mode === 'listening' ? 0.3 : 0;
    energy += (goal - energy) * Math.min(1, dt * 8);
    const beat = halo(now, dt, mode, energy);
    jarvisEl.style.setProperty('--energy', Math.max(energy, beat * 0.5).toFixed(3));

    // The galaxy joins in while Halo speaks: packets stream along the links, lit notes pulse.
    streamLevel += ((speaking ? 1 : 0) - streamLevel) * Math.min(1, dt * (speaking ? 3 : 1.5));
    if (streamLevel < 0.005) streamLevel = 0;
    if (linksLive !== streamLevel > 0.2) { linksLive = !linksLive; Graph.linkColor(linkColor); }
    updateStream(now / 1000, streamLevel);
    updateSparks(dt, streamLevel);
    pulseNodes(now / 1000, streamLevel);
    if (!streamLevel && overlayPairs.length) overlayMat.opacity = overlayOpacity;
  }

  function pauseDrift(ms) { driftResumeAt = ms === Infinity ? Infinity : performance.now() + ms; }

    animateJarvis(performance.now());
    if (performance.now() > driftResumeAt) {
      const cam = Graph.camera(), ctr = Graph.controls().target;
      // With nothing selected, drift back to circling the vault's core dot (it sits at the origin),
      // rather than whatever the view last flew to. The camera moves with the centre, so it glides.
      if (selected === null && highlight.size === 0 && ctr.lengthSq() > 1) {
        const k = 0.015, sx = -ctr.x * k, sy = -ctr.y * k, sz = -ctr.z * k;
        ctr.set(ctr.x + sx, ctr.y + sy, ctr.z + sz);
        cam.position.set(cam.position.x + sx, cam.position.y + sy, cam.position.z + sz);
      }
      const dx = cam.position.x - ctr.x, dz = cam.position.z - ctr.z;
      const a = 0.0006;
      cam.position.x = ctr.x + dx * Math.cos(a) - dz * Math.sin(a);
      cam.position.z = ctr.z + dx * Math.sin(a) + dz * Math.cos(a);
      cam.lookAt(ctr);

    const m = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i.exec(s || '');
    if (!m) return null;
    let h = +m[1]; const min = +(m[2] || 0), ap = (m[3] || '').toLowerCase();
    if (ap === 'pm' && h < 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    const d = new Date(); d.setHours(h, min, 0, 0); return d;
  };

    const now = new Date();
    const upcoming = (today.events || []).map(e => ({ ...e, s: toToday(e.start), e: toToday(e.end) }))
      .filter(e => e.s && (e.e ? e.e > now : e.s > now)).sort((x, y) => x.s - y.s);

  // Any picked image (PNG, JPEG, WebP, GIF or SVG) is drawn onto a canvas and sent as a PNG no
  // bigger than 720 x 240, shrinking further if needed to stay well under the server's limit.
  function logoPng(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        let w = img.naturalWidth || 720, h = img.naturalHeight || 240;
        let k = Math.min(1, 720 / w, 240 / h);
        for (let tries = 0; tries < 6; tries++, k *= 0.75) {
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          const png = c.toDataURL('image/png');
          if (png.length < 460 * 1024) return resolve(png);
        }
        reject(new Error('That image is too detailed to use as a logo. Try a simpler one.'));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not an image I can read.')); };
      img.src = url;
    });
  }

  // ---- updates ------------------------------------------------------------------------------
  // A flashing pill, top centre, that shows only when GitHub has a newer Halo. Click Update now to

    if (title) updateBar.title = title;
