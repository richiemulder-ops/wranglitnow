    if (updateInfo.available) {
      updateBar.querySelector('.txt').textContent = `New Halo ready (${updateInfo.latest})`;
      updateBar.title = `Halo ${updateInfo.latest} is ready (you have ${updateInfo.current}).\n` +
        (updateInfo.notes || []).map(n => '• ' + n).join('\n');

  setInterval(checkUpdate, 15 * 60 * 1000);

  });

    if (!s || updating) return;

      updateInfo = s;
      updateBar.hidden = false;
      updateBar.querySelector('.txt').textContent = `New Halo ready (${s.latest})`;
      setStatus('thinking', `Halo ${s.latest} is ready`, 4000);
      setTimeout(installUpdate, 400);   // the same "Update Halo to ...?" question as the button
    } else if (s.problem) {
      setStatus('thinking', `couldn't check for updates: ${s.problem}`, 6000);
    } else {
      setStatus('thinking', `Halo is up to date (${s.current})`, 5000);
    }
  }
  async function installUpdate() {
    if (updating || !updateInfo || !updateInfo.available) return;
    const notes = (updateInfo.notes || []).map(n => '• ' + n).join('\n');
    if (!confirm(`Update Halo to ${updateInfo.latest}?\n\n${notes ? "What's new:\n" + notes + '\n\n' : ''}` +
                 'Your notes and settings stay as they are. Halo restarts, which takes about 20 seconds.')) return;
    updating = true;
    updateBar.classList.add('busy');
    tUpdate.set('<small>Updating…</small>', 'Downloading');

    tUpdate.set('<small>Restarting…</small>', 'Back in a moment');

    const wait = async () => {
      try {

          try { sessionStorage.setItem('jarvis-skip-wake', '1'); } catch (_) {}
          location.reload();
          return;
        }

      if (Date.now() - started < 90000) setTimeout(wait, 2000);
      else tUpdate.set('<small>Restart Halo</small>', 'Use the desktop shortcut', 'The update installed but Halo did not come back on its own. Start it from the desktop shortcut.');
    };

  }

  // ---- Claude Code sign-in ------------------------------------------------------------------

    'background:#141b2d;border:1px solid #ffb347;border-radius:14px;padding:16px 18px;color:#e8ecf4;font:14px/1.45 inherit;box-shadow:0 8px 30px rgba(0,0,0,.45)';

  // ---- current work -----------------------------------------------------------------------
  // A tile that pulses while anyone is working, and a screen where each agent is a little bot:

  const PROJECT_COLOUR = Object.fromEntries((GRAPH.projects || []).map(p => [p.name, p.color]));
  const hueOf = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h}, 70%, 65%)`; };
  const colourOf = name => AGENT_COLOUR[name] || hueOf(name);
  const HQ = 'Team HQ';

  // or README) and fleeting notes not yet in a topic folder. Team Inbox is cheap to list, so it's checked
  // every poll; the fleeting list is slower, so every 30 seconds.
  const pileCount = { 'pile-inbox': 0, 'pile-notes': 0 };
  let pileNotesAt = 0;
  async function pollPiles() {
    try {
      const r = await api('/api/folder?name=inbox&path=');

  // The factory: a 3D floor with a station per project being worked on and a charging bay
  // (Team HQ) where idle bots wait. Built once, on first open, with the page's own three.js.
  let F = null;
  const HQ_X = -13;
  function labelSprite(text, colour, opts = {}) {
    // A "\n" in the text starts a second line, drawn smaller and dimmer (a bot's task, then its step).
    const size = opts.size || 30, pad = 14, c = document.createElement('canvas'), g = c.getContext('2d');
    const [main, sub] = String(text).split('\n'), subSize = Math.round(size * 0.8), gap = sub ? subSize + 6 : 0;
    g.font = `500 ${subSize}px system-ui, sans-serif`;
    const subW = sub ? g.measureText(sub).width : 0;
    g.font = `600 ${size}px system-ui, sans-serif`;
    const w = Math.ceil(Math.max(g.measureText(main).width, subW)) + pad * 2, h = size + gap + pad * 1.4 + (opts.tail ? 12 : 0);
    c.width = w; c.height = h;
    g.font = `600 ${size}px system-ui, sans-serif`;
    const bh = h - (opts.tail ? 12 : 0);
    g.fillStyle = opts.bg || 'rgba(13,16,40,0.9)'; g.strokeStyle = colour; g.lineWidth = 3;
    g.beginPath(); g.roundRect ? g.roundRect(2, 2, w - 4, bh - 4, bh / 2.4) : g.rect(2, 2, w - 4, bh - 4); g.fill(); g.stroke();
    if (opts.tail) { g.beginPath(); g.moveTo(w / 2 - 10, bh - 3); g.lineTo(w / 2, h - 1); g.lineTo(w / 2 + 10, bh - 3); g.fill(); }
    g.fillStyle = opts.ink || colour; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(main, w / 2, bh / 2 + 1 - gap / 2);
    if (sub) { g.font = `500 ${subSize}px system-ui, sans-serif`; g.globalAlpha = 0.72; g.fillText(sub, w / 2, bh / 2 + 4 + size / 2); g.globalAlpha = 1; }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
    const k = (opts.scale || 0.011);
    s.scale.set(w * k, h * k, 1); s.renderOrder = 10; s.userData.text = text;
    return s;
  }
  const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.15, ...extra });

  // Soft pastel equipment on the navy floor. Each piece is built facing +x and turned to face the
  // viewer; its bot works from behind it, facing out, so you see both the bot's face and the machine.
  const PASTEL = { cream: 0xf6efe2, mint: 0xbfe6c7, peach: 0xffcf9e, sky: 0xa9d4ff, lilac: 0xcdb8ff, coral: 0xff9b8a,
                   wood: 0xe8c79c, ink: 0x2d3570, pot: 0xd98b6a, leaf: 0x7fc35a };
  // A rounded box: w along x, h along y, d along z, with soft bevelled corners.
  function rbox(w, h, d, r = 0.12, color = PASTEL.cream, extra = {}) {
    const b = Math.min(r, d / 2 - 0.002, w / 2 - 0.002, h / 2 - 0.002) * 0.6, sw = w - 2 * b, sh = h - 2 * b;
    const cr = Math.max(0.002, Math.min(r - b, sw / 2 - 0.001, sh / 2 - 0.001)), x = -sw / 2, y = -sh / 2, s = new THREE.Shape();
    s.moveTo(x + cr, y); s.lineTo(x + sw - cr, y); s.quadraticCurveTo(x + sw, y, x + sw, y + cr);

  // A name plate fixed to a piece of equipment: a dark rounded plate w x h with the name in bold, shrunk to
  // fit and wrapped onto two lines if it's long. Faces +x (the equipment's front) unless opts.face says
  // otherwise. Unlit, so it reads the same in any light. plate.userData.draw(text) changes the wording.
  function namePlate(text, w, h, opts = {}) {
    const W = 512, H = Math.max(56, Math.round(W * h / w)), c = document.createElement('canvas'); c.width = W; c.height = H;
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));

    m.userData.draw = t => {
      const g = c.getContext('2d'), pad = H * 0.3, font = s => `700 ${s}px system-ui, sans-serif`;

      const fit = (s, max) => { let size = max; g.font = font(size); while (g.measureText(s).width > W - pad * 2 && size > 10) g.font = font(size -= 2); return size; };
      let lines = [t], size = fit(t, H * 0.58);
      const gap = t.lastIndexOf(' ', Math.ceil(t.length / 2) + 2);
      if (size < H * 0.36 && gap > 0) { lines = [t.slice(0, gap), t.slice(gap + 1)]; size = Math.min(fit(lines[0], H * 0.36), fit(lines[1], H * 0.36)); }

  // Sky for the windows: a soft gradient, a few clouds and a city skyline with lit windows.
  function skyTexture() {

    grd.addColorStop(0, '#6f9fe8'); grd.addColorStop(0.65, '#bcd6ff'); grd.addColorStop(1, '#ffe3c2');
    g.fillStyle = grd; g.fillRect(0, 0, 512, 160);
    g.fillStyle = 'rgba(255,255,255,0.85)';
    [[60, 34, 30], [86, 28, 22], [230, 50, 34], [258, 44, 20], [400, 30, 28], [425, 36, 18]].forEach(([x, y, r]) => {
      g.beginPath(); g.ellipse(x, y, r, r * 0.42, 0, 0, Math.PI * 2); g.fill(); });
    for (let x = 0; x < 512;) {
      const w = 18 + Math.random() * 26, h = 24 + Math.random() * 56;

      g.fillStyle = '#ffe9a8';
      for (let wy = 160 - h + 6; wy < 156; wy += 8) for (let wx = x + 4; wx < x + w - 8; wx += 6) if (Math.random() < 0.35) g.fillRect(wx, wy, 2, 3);
      x += w;

  // A wall running along local x from 0 to len, with evenly spaced windows. Its room side faces local +z.
  function buildWall(len, nWin, sky) {
    const g = new THREE.Group(), H = 5, SILL = 1.3, HEAD = 4.1, T = 0.35, WIN = 3.4, gap = (len - nWin * WIN) / (nWin + 1);
    const wallMat = mat(0x2a2f66, { roughness: 0.9, metalness: 0 }), trim = mat(PASTEL.cream, { roughness: 0.6, metalness: 0 });
    const box = (w, h, d, m, x, y, z = 0) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
      b.position.set(x, y, z); b.castShadow = true; b.receiveShadow = true; g.add(b); };
    box(len, SILL, T, wallMat, len / 2, SILL / 2);
    box(len, H - HEAD, T, wallMat, len / 2, (H + HEAD) / 2);
    for (let i = 0; i <= nWin; i++) box(gap, HEAD - SILL, T, wallMat, i * (gap + WIN) + gap / 2, (SILL + HEAD) / 2);
    for (let i = 0; i < nWin; i++) {
      const cx = gap + i * (gap + WIN) + WIN / 2, cy = (SILL + HEAD) / 2, view = sky.clone();
      view.needsUpdate = true; view.repeat.x = 0.35; view.offset.x = (i * 0.37) % 1;
      const pane = new THREE.Mesh(new THREE.PlaneGeometry(WIN, HEAD - SILL),
        new THREE.MeshBasicMaterial({ map: view, color: 0xdde6ff, side: THREE.DoubleSide }));
      pane.position.set(cx, cy, 0); g.add(pane);
      box(WIN + 0.3, 0.14, T + 0.25, trim, cx, SILL);
      box(WIN, 0.1, T + 0.05, trim, cx, HEAD);
      box(0.1, HEAD - SILL, T * 0.6, trim, cx, cy);
      box(WIN, 0.08, T * 0.6, trim, cx, cy + 0.35);
    }
    box(len, 0.25, T + 0.08, trim, len / 2, 0.125);
    box(len, 0.16, T + 0.1, trim, len / 2, H);
    return g;
  }

      if (P.drawers) P.drawers.forEach((d, i) => { const want = on && Math.sin(t * 2.5 + i * 2) > 0.3 ? 0.95 : 0.55; d.position.x += (want - d.position.x) * Math.min(1, dt * 6); });
      if (P.gears) { P.gears[0].rotation.y += (on ? 2.2 : 0.05) * dt; P.gears[1].rotation.y -= (on ? 2.9 : 0.06) * dt;
        P.core.material.emissiveIntensity = on ? 0.6 + Math.sin(t * 6) * 0.3 : 0.15;
        P.puffs.forEach(p => { const u = (t * 0.45 + p.userData.off) % 1; p.position.y = 2.35 + u * 1.6; p.scale.setScalar(on ? 0.6 + u * 0.9 : 0.001); p.material.opacity = 0.85 * (1 - u); }); }
      if (P.reels) { P.reels.forEach((r, i) => { r.rotation.y += (on ? 3 : 0) * dt * (i ? 1 : 1.3); });
        P.mic.material.emissiveIntensity = on ? 0.3 + Math.max(0, Math.sin(t * 7)) * 0.7 : 0.1; }
      if (P.flag) { const want = on ? -Math.PI / 2 : 0; P.flag.rotation.x += (want - P.flag.rotation.x) * Math.min(1, dt * 5);
        P.letters.forEach(l => { const u = (t * 0.6 + l.userData.off) % 1; l.visible = on; l.position.set(0.1 + u * 0.4, 1.6 + u * 1.2, -0.5 + Math.sin(u * 6) * 0.15); l.rotation.x = u * 2; }); }
      if (P.head) { P.head.rotation.y += (on ? 1.6 : 0.15) * dt; P.tip.material.emissiveIntensity = on ? 0.5 + Math.max(0, Math.sin(t * 8)) : 0.3; }
      if (P.roller) { P.roller.rotation.y += 0; P.roller.rotation.z += 0; P.roller.rotateY(on ? dt * 4 : 0);
        const u = (t * 0.5) % 1; P.sheet.position.x = on ? 0.4 + u * 0.8 : 0.6; }
      if (P.bubbles) P.bubbles.forEach(bb => { const u = (t * (on ? 0.9 : 0.12) + bb.userData.off) % 1; bb.position.y = 1.32 + u * 0.55; });
      if (on && !s.calm && Math.random() < 0.08) spark(s.group.localToWorld(tmp.set(0, 2.2, 0)));
    }
    for (let i = 0; i < F.sparkLife.length; i++) {                       // sparks fly, fall and fade
      if (F.sparkLife[i] <= 0) { F.sparkPos[i * 3 + 1] = -50; continue; }
      F.sparkLife[i] -= dt; F.sparkVel[i * 3 + 1] -= 6 * dt;
      for (let a = 0; a < 3; a++) F.sparkPos[i * 3 + a] += F.sparkVel[i * 3 + a] * dt;
    }
    F.sparkGeo.attributes.position.needsUpdate = true;
    const sway = Math.sin(t * 0.12) * 0.1;                               // a slow drift so the scene feels alive
    F.camera.position.set(F.target.x + Math.sin(F.yaw + sway) * Math.cos(F.pitch) * F.dist,
      Math.sin(F.pitch) * F.dist, F.target.z + Math.cos(F.yaw + sway) * Math.cos(F.pitch) * F.dist);
    F.camera.lookAt(F.target);
    F.walls.back.visible = F.camera.position.z > -16; F.walls.side.visible = F.camera.position.x > -24;
    F.renderer.render(F.scene, F.camera);
    crewFrame = requestAnimationFrame(drawCrew);
  }

    }
    if (tour && tour.token === token) next.disabled = false;
  }
  // Keep the holes on whatever moved or opened (panels slide in, windows resize).
  setInterval(() => { if (tour && !card.hidden) drawShade(tour.steps[tour.i]); }, 500);
  addEventListener('resize', () => { if (tour) drawShade(tour.steps[tour.i]); });

  function startTour(topic = 'all') {
    const steps = tourStepsFor(topic);
    if (!steps.length) { setStatus('thinking', 'nothing new to show since your last tour', 5000); return; }
    if (tour) endTour(true);
    const ch = TOUR_CHAPTERS.find(c => steps.every(s => s.ch === c.key));
    const label = topic === 'new' || /new/.test(String(topic)) ? "What's new" : steps === TOUR_STEPS ? '' : ch ? ch.title : 'Tutorial';
    tour = { steps, i: 0, token: 0, label };
    tourOn = true;
    tourDemoCards(true); tourRefreshers.forEach(f => f()); refreshMetrics(); refreshMeeting();
    offerEl.hidden = true;
    unlockSpeech();
    shade.removeAttribute('hidden'); card.hidden = false;
    showStep();
    card.querySelector('.next').focus();
  }
  function endTour(quiet) {
    if (!tour) return;
    tour = null; tourOn = false;
    stopSpeaking();
    shade.setAttribute('hidden', ''); card.hidden = true; pointer.hidden = true;
    tourReset();
    document.getElementById('panel').classList.remove('open'); document.body.classList.remove('panel-open');
    tourDemoCards(false); tourRefreshers.forEach(f => f()); pollCrew(); refreshMetrics(); refreshMeeting();
    if (!quiet) { setStatus('thinking', 'tour finished: Settings > Tutorial replays it', 5000); announceAfterTour(); }
  }
  card.querySelector('.next').onclick = () => {
    if (!tour) return;
    if (tour.i >= tour.steps.length - 1) return endTour();
    tour.i++; showStep(1);
  };
  card.querySelector('.back').onclick = () => { if (tour && tour.i > 0) { tour.i--; showStep(-1); } };
  card.querySelector('.again').onclick = () => { if (tour) { const st = tour.steps[tour.i]; tourSay(typeof st.say === 'function' ? st.say() : st.say); } };
  card.querySelector('.end').onclick = () => endTour();
  window.addEventListener('keydown', e => {
    if (!tour) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); endTour(); }
    else if ((e.key === 'ArrowRight' || e.key === 'Enter') && !card.querySelector('.next').disabled && e.target !== qEl) { e.preventDefault(); card.querySelector('.next').click(); }
    else if (e.key === 'ArrowLeft' && !card.querySelector('.back').disabled) { e.preventDefault(); card.querySelector('.back').click(); }
  }, true);

  // The offer: after the first-run welcome, the first time an install has a tutorial at all, and
  // after an update that changed something on screen. Answering either way marks this version seen.
  const offerEl = document.createElement('div');
  offerEl.id = 'tourOffer'; offerEl.hidden = true; offerEl.setAttribute('role', 'dialog');
  document.body.appendChild(offerEl);
  function offerTour(topic, steps) {
    if (tour) return;
    const isNew = topic === 'new';
    const n = isNew ? steps.length : 0;
    offerEl.innerHTML = isNew
      ? `<b>I've been updated</b>Want me to show you what's new? ${n === 1 ? 'One thing' : n + ' things'}, under a minute.`
      : `<b>Shall I show you round?</b>What I can do for you, then a guided tour of the screen. About 12 minutes; you click Next at your own pace, and can stop any time.`;
    offerEl.insertAdjacentHTML('beforeend', '<div class="tb"><button type="button" class="no">Not now</button><button type="button" class="go">Show me</button></div>');
    offerEl.hidden = false;
    const seen = () => saveSetup({ tour_seen: SETUP.version || '' });
    offerEl.querySelector('.no').onclick = () => { offerEl.hidden = true; seen(); setStatus('thinking', 'any time: Settings > Tutorial, or say "give me a tour"', 6000); announceAfterTour(); };
    offerEl.querySelector('.go').onclick = () => { offerEl.hidden = true; SETUP.tour_seen_before = SETUP.tour_seen || ''; seen(); startTour(topic); };
    tourSay(isNew ? "I've been updated. Shall I show you what's new?" : 'Shall I show you round? It takes a few minutes.');
  }
  function whenQuiet(fn, tries = 0) {   // after Halo has finished speaking (at most a minute)
    if (synth && synth.speaking && tries < 60) return setTimeout(() => whenQuiet(fn, tries + 1), 1000);
    fn();
  }
  function maybeOfferTour(info) {
    if (tour || !info || !info.version) return;
    if (document.getElementById('onboard') || !offerEl.hidden) return;
    if (!info.tour_seen) return offerTour('all');                   // never had the tour: offer all of it
    if (!vnewer(info.version, info.tour_seen)) return;               // seen this version already
    const steps = whatsNewSteps(info.tour_seen);
    SETUP.tour_seen_before = info.tour_seen;
    if (steps) whenQuiet(() => offerTour('new', steps));
    else saveSetup({ tour_seen: info.version });                     // nothing on screen changed: just note it
  }
  window.JARVIS_TOUR = startTour;   // console: JARVIS_TOUR('menu')

  window.GALAXY = { Graph, nodes, select, clearSelection, focusNodes };  // handy for later features / console
})();
// The job cards stop above the context card, which grows a row per working agent.
(() => {
  const box = document.getElementById('context');
  const fit = () => document.documentElement.style.setProperty('--ctx-h', (box.offsetHeight || 0) + 'px');
  new ResizeObserver(fit).observe(box);
  new MutationObserver(fit).observe(box, { childList: true, subtree: true, characterData: true });
  addEventListener('resize', fit);
  fit();
})();
</script>
<!-- Feedback: a button beside Settings opens the Halo Feedback form (a Fillout Zite app) in a window.
     The form link carries the friend's name and Halo version so feedback says who and which build. -->
<style>
  #fb-btn { position: fixed; left: 130px; bottom: 18px; z-index: 6; display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 12px; color: var(--ink); cursor: pointer;
    background: rgba(13, 16, 40, 0.62); border: 1px solid var(--edge); backdrop-filter: blur(8px); transition: opacity 0.8s 0.3s; }
  #fb-btn:hover, #fb-btn[aria-expanded=true] { border-color: #bad367; color: #bad367; }
  body.waking #fb-btn { opacity: 0; pointer-events: none; }
  #fb-win { position: fixed; left: 18px; bottom: 62px; z-index: 55; }
  #fb-win[hidden] { display: none; }
  #fb-win .fb-card { position: relative; width: min(440px, calc(100vw - 36px)); height: min(560px, calc(100vh - 100px));
    border-radius: 16px; overflow: hidden; background: #161933; border: 1px solid var(--edge); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
  #fb-win iframe { width: 100%; height: 100%; border: 0; display: block; }
  #fb-win .fb-close { position: absolute; top: 8px; right: 10px; z-index: 1; width: 30px; height: 30px; border-radius: 50%;
    font-size: 18px; line-height: 1; color: var(--ink); cursor: pointer; background: rgba(13, 16, 40, 0.8); border: 1px solid var(--edge); }
  #fb-win .fb-close:hover { color: #bad367; border-color: #bad367; }
  #fb-win .fb-wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 13px; pointer-events: none; }
  #fb-win .fb-wait[hidden] { display: none; }
</style>
<button type="button" id="fb-btn" aria-haspopup="dialog" aria-expanded="false" title="Send Richie feedback, a bug or an idea">
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  <span>Feedback</span>
</button>
<div id="fb-win" role="dialog" aria-label="Send feedback" hidden>
  <div class="fb-card">
    <div class="fb-wait">Loading the feedback form…</div>
    <button type="button" class="fb-close" aria-label="Close feedback">&times;</button>
  </div>
</div>
<script>
(() => {
  const FORM = 'https://4dxsleunnk.zite.so/feedback';
  const btn = document.getElementById('fb-btn'), win = document.getElementById('fb-win');
  const card = win.querySelector('.fb-card'), wait = win.querySelector('.fb-wait');
  // Sit just right of the Settings button, whatever its width.
  const place = () => { const s = document.getElementById('settings-btn');
    if (s && s.offsetWidth) btn.style.left = (s.getBoundingClientRect().right + 8) + 'px'; };
  window.addEventListener('resize', place); setTimeout(place, 0); setTimeout(place, 1500);
  // Name and version live on the Halo server (friends' copies: /api/setup). The browser's saved
  // copy is a fallback; a copy with no setup (Richie's own) says so.
  async function setup() {
    let s = {};
    try { s = JSON.parse(localStorage.getItem('jarvis-setup') || '{}') || {}; } catch (_) {}
    try {
      const r = await fetch('/api/setup', { headers: { 'X-Galaxy': '1' }, credentials: 'same-origin' });
      if (r.ok) { const d = await r.json(); return { user_name: d.user_name || s.user_name, version: d.version || s.version }; }
      if (r.status === 404) return { user_name: s.user_name, version: s.version || 'own copy' };
    } catch (_) {}
    return s;
  }
  async function open() {
    win.hidden = false; btn.setAttribute('aria-expanded', 'true'); wait.hidden = false;
    const s = await setup(), p = new URLSearchParams();
    if (win.hidden) return;                          // closed while we asked
    if (s.user_name) p.set('user', s.user_name);
    if (s.version) p.set('version', s.version);
    p.set('app', 'jarvis');
    card.querySelector('iframe')?.remove();          // a fresh form each time
    const f = document.createElement('iframe');
    f.title = 'Halo feedback form'; f.src = FORM + '?' + p.toString();
    f.addEventListener('load', () => { wait.hidden = true; });
    card.insertBefore(f, card.firstChild);
  }
  function close() {
    win.hidden = true; btn.setAttribute('aria-expanded', 'false');
    card.querySelector('iframe')?.remove();
  }
  btn.addEventListener('click', () => win.hidden ? open() : close());
  win.querySelector('.fb-close').addEventListener('click', close);
  document.addEventListener('mousedown', e => { if (!win.hidden && !win.contains(e.target) && !btn.contains(e.target)) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !win.hidden) { e.stopPropagation(); close(); } }, true);
})();
</script>
