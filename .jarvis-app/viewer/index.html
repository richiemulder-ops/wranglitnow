  function folderSection(key, icon, title, color) {
    const root = { inbox: 'Team Inbox', deliverables: 'Deliverables' }[key];
    const inFolder = nodes.filter(n => n.folder === root || n.folder.startsWith(root + '/')).map(n => n.id);
    let loaded = false;
    const body = addSection({ icon, title, sub: `RTM_PKM / ${root}`, color, onOpen: b => { if (!loaded) load(b, ''); } });
    let current = '', justAdded = [];

    async function load(b, path) {
      loaded = true; current = path;
      b.innerHTML = '<div class="note">Loading…</div>';
      try {
        render(b, await api(`/api/folder?name=${key}&path=${encodeURIComponent(path)}`));
      } catch (err) {
        loaded = false;
        b.innerHTML = `<div class="note error">${escapeHtml(err.message)}</div>`;
      }
    }

    function render(b, data) {
      b.innerHTML = '';
      const tools = document.createElement('div'); tools.className = 'tools';
      const btn = (label, fn, tip) => {
        const x = document.createElement('button'); x.type = 'button'; x.className = 'link-btn';
        x.textContent = label; x.onclick = fn; if (tip) x.title = tip; tools.appendChild(x);
      };
      if (data.path) btn('← Back', () => load(b, data.path.split('/').slice(0, -1).join('/')));
      btn('Open folder ↗', () => openInOs(data.path), `Open ${root}${data.path ? '/' + data.path : ''} in File Explorer`);
      if (!data.path && inFolder.length) btn(`✦ Show ${inFolder.length} in galaxy`, () => focusNodes(inFolder));
      if (key === 'inbox') {
        btn('+ Add files', () => picker.click(), 'Or drag files from your desktop onto this card');
        if (justAdded.length) btn(`File ${justAdded.length === 1 ? 'it' : 'them'}`, () => {
          const names = justAdded; justAdded = []; render(b, data);
          ask(`Get the team to file these new files from the Team Inbox: ${names.join(', ')}`);
        }, 'Hands the new files to the team to file in the vault');
      }
      b.appendChild(tools);
      if (data.path) { const c = document.createElement('div'); c.className = 'note'; c.textContent = `${root} / ${data.path}`; b.appendChild(c); }
      if (!data.entries.length) { const e = document.createElement('div'); e.className = 'note'; e.textContent = 'Empty.'; b.appendChild(e); }
      folderEntries(b, data, { key, root, color, load: path => load(b, path), refresh: () => load(b, data.path) });
    }

    const openInOs = path => openInDesktop(key, path);

    // Team Inbox takes files: dragged from the desktop onto its card, or picked with "+ Add files".
    // They go into whichever inbox folder the card is showing.
    if (key !== 'inbox') return;
    const sec = body.parentElement;
    const picker = Object.assign(document.createElement('input'), { type: 'file', multiple: true, hidden: true });
    picker.onchange = () => { upload([...picker.files], 0); picker.value = ''; };
    sec.appendChild(picker);

    async function upload(files, skippedFolders) {
      if (!sec.classList.contains('open')) sec.querySelector('.head').click();
      const added = [], failed = [];
      for (const [i, f] of files.entries()) {
        setStatus('thinking', `Adding ${i + 1} of ${files.length} to Team Inbox…`);
        try {
          const res = await fetch(`/api/upload?name=inbox&path=${encodeURIComponent(current)}&file=${encodeURIComponent(f.name)}`, {
            method: 'POST', credentials: 'same-origin',
            headers: { 'X-Galaxy': '1', 'Content-Type': 'application/octet-stream' }, body: f
          });
          const data = await res.json().catch(() => ({ error: `Server error ${res.status}` }));
          if (!res.ok || data.error) throw new Error(data.error || `Server error ${res.status}`);
          added.push(data.name);
        } catch (err) { failed.push(`${f.name}: ${err.message}`); }
      }
      justAdded = justAdded.concat(added);
      await load(body, current);
      const problems = failed.concat(skippedFolders ? [`${skippedFolders} folder${skippedFolders === 1 ? '' : 's'} skipped: drop the files inside instead`] : []);
      if (problems.length) {
        const n = document.createElement('div'); n.className = 'note error';
        n.textContent = problems.join(' · ');
        body.insertBefore(n, body.children[1] || null);
      }
      if (added.length) {
        setStatus('done', `${added.length} added to Team Inbox`, 3000);
        speak(added.length === 1 ? 'Placed in the Team Inbox. I will see to it the moment you ask.'
                                 : `${added.length} files in the Team Inbox, stacked with more care than they arrived.`);
      } else setStatus('error', 'Nothing was added', 4000);
    }

    const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
    let dragDepth = 0;
    const clearDrag = () => { dragDepth = 0; sec.classList.remove('drop-ready', 'drop-over'); };
    // Anywhere on the page: show where files can go, and stop the browser opening a dropped file.
    window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; sec.classList.add('drop-ready'); } });
    window.addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) clearDrag(); });
    window.addEventListener('dragover', e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      const over = sec.contains(e.target);
      sec.classList.toggle('drop-over', over);
      e.dataTransfer.dropEffect = over ? 'copy' : 'none';
    });
    window.addEventListener('drop', e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      const over = sec.contains(e.target);
      clearDrag();
      if (!over) return;
      // Folders arrive as zero-byte "files"; keep real files only.
      const items = [...e.dataTransfer.items].filter(it => it.kind === 'file');
      const entries = items.map(it => it.webkitGetAsEntry && it.webkitGetAsEntry());
      const files = items.map((it, i) => (!entries[i] || entries[i].isFile) ? it.getAsFile() : null).filter(Boolean);
      const skipped = entries.filter(en => en && en.isDirectory).length;
      if (files.length || skipped) upload(files, skipped);
    });
  }

  // A project's deliverables are whatever the team has filed in its workspace folder

  let deliverablesFor = 0;
  async function projectDeliverables(p, path = '') {
    const head = document.getElementById('p-dhead'), box = document.getElementById('p-deliverables');
    const token = ++deliverablesFor;   // a newer panel wins over a slow listing

    catch (err) { if (token === deliverablesFor) box.innerHTML = `<div class="note error">${escapeHtml(err.message)}</div>`; return; }
    if (token !== deliverablesFor) return;
    const count = data.entries.length;

    box.innerHTML = '';

      n.textContent = path ? 'Empty.' : "Nothing filed in this project's folder yet.";

  document.getElementById('close').onclick = clearSelection;

  // ---- ask your notes -----------------------------------------------------------------

  // Stop: ends Jarvis's answer in flight and every job Larry's team is running, straight away.
  function refreshStop() {
    stopEl.hidden = !(askEl.classList.contains('busy') || [...jobs.values()].some(j => j.status === 'running'));
  }
  stopEl.onclick = async () => {
    stopSpeaking();

    await Promise.all([
      askEl.classList.contains('busy') ? api('/api/stop-answer', {}).catch(() => {}) : null,
      ...running.map(j => api('/api/jobs/stop', { id: j.id }).then(trackJob).catch(() => {}))
    ]);
    setStatus('thinking', running.length ? `stopped ${running.length === 1 ? "the team's job" : running.length + ' jobs'}` : 'stopped', 3000);

  // What Jarvis was asked to do, beyond answering: the server has already saved the note or
  // opened the file; the page shows the result.
  function handleAction(a) {
    if (a.type === 'note' && a.listen) { showNotes(null, true); setStatus('listening', 'take your note: Dictate is on', 5000); }
    else if (a.type === 'note') { setStatus('thinking', `note saved to ${a.path.split('/').slice(0, -1).join(' / ')}`, 4000); }
    else if (a.type === 'deliverables') {
      const p = projects.find(x => x.name === a.project);
      if (p) { if (workEl.classList.contains('open')) closeWork(); showProject(p); }
      else setStatus('error', `${a.project} has no notes in the galaxy yet`, 4000);
    }
    else if (a.type === 'open') setStatus('thinking', `opened ${a.path.split('/').pop()} on your desktop`, 4000);
    else if (a.type === 'chat') showTeamChat(a.agent, a.chat || null);

  async function ask(question) {
    if (!question || askEl.classList.contains('busy')) return;
    askEl.classList.add('busy'); sendEl.disabled = true; refreshStop();
    stopSpeaking();
    setStatus('thinking', 'thinking…');
    showAnswer(question, 'Searching your notes…', []);
    try {
      const res = await fetch('/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }), credentials: 'same-origin'
      });
      const data = await res.json().catch(() => ({ error: `Server error ${res.status}` }));
      if (!res.ok || data.error) throw new Error(data.error || `Server error ${res.status}`);
      const used = (data.nodes || []).filter(i => Number.isInteger(i) && nodes[i]);
      showAnswer(question, data.answer, used);
      proveAnswer(used);
      qEl.value = '';
      setStatus('');
      if (!(data.action && data.action.listen)) speak(data.speech || data.answer);   // only the spoken line: the answer and notes are on screen
      if (data.context) { jarvisContext = data.context; renderContext(); }
      if (data.job) trackJob(data.job);
      if (data.action) handleAction(data.action);
    } catch (err) {
      showAnswer(question, err.message || 'Something went wrong.', [], true);
      setStatus('');
    } finally {
      askEl.classList.remove('busy'); sendEl.disabled = false; refreshStop(); qEl.focus();
    }
  }

  // Show where an answer came from. `ids` are the cited notes, most important first.

  //   none (small talk, or the notes don't cover it): leave the galaxy exactly as it is.
  const CLUSTER_THRESHOLD = 4;
  function proveAnswer(ids) {
    if (ids.length === 0) return;
    if (ids.length >= CLUSTER_THRESHOLD) focusNodes(ids);
    else select(nodes[ids[0]]);

  // ---- status line --------------------------------------------------------------------
  const statusEl = document.getElementById('status');
  let statusTimer = null;
  function setStatus(kind, text, autoHideMs) {

  // ---- voice out: speechSynthesis ---------------------------------------------------
  const synth = window.speechSynthesis || null;
  const voiceToggle = document.getElementById('voice-toggle');
  const MAX_SPOKEN_SENTENCES = 2;
  let voice = null, voiceIsMale = false, speechUnlocked = false, speakToken = 0, voiceKick = 0;
  // What onboarding saved; cached here so the boot greeting can use it before the server answers.
  let SETUP = {};
  try { SETUP = JSON.parse(localStorage.getItem('jarvis-setup') || '{}') || {}; } catch (_) {}
  let voiceOn = true;
  try { voiceOn = localStorage.getItem('galaxy-voice') !== 'off'; } catch (_) {}

  // Jarvis is a gentleman: a male British voice first, then any male English voice, and only
  // then a female one (pitched down). Browsers don't report gender, so go by the voice name.
  const MALE_VOICE = /\b(male|george|ryan|thomas|alfie|elliot|ethan|noah|oliver|arthur|daniel|james|william|harry|david|mark|guy|andrew|brian|christopher|eric|roger|steffan|davis|tony|jason|liam|connor|rishi|fred|ralph|aaron|gordon|lee)\b/i;
  const FEMALE_VOICE = /\b(female|hazel|susan|sonia|libby|maisie|abbi|bella|hollie|olivia|kate|serena|stephanie|martha|zira|aria|jenny|michelle|emma|ava|samantha|karen|moira|tessa|fiona|catherine|natasha|clara|sara|nancy|jane|elizabeth|ella|amelia|heather|linda|eva|catalina|victoria|allison|susie|kathy|neerja)\b/i;
  function pickVoice() {
    const chosen = SETUP.voice && synth.getVoices().find(v => v.name === SETUP.voice);
    if (chosen) {
      voice = chosen;
      voiceIsMale = !FEMALE_VOICE.test(chosen.name) || MALE_VOICE.test(chosen.name);
      if (typeof renderVoiceToggle === 'function') renderVoiceToggle();
      return;
    }
    const score = v => (/^en[-_]GB$/i.test(v.lang) ? 4 : 0)
      + (MALE_VOICE.test(v.name) && !/female/i.test(v.name) ? 8 : FEMALE_VOICE.test(v.name) ? -8 : 0)
      + (/natural|neural|online/i.test(v.name) ? 2 : /google/i.test(v.name) ? 1 : 0);
    const english = synth.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang)).sort((a, b) => score(b) - score(a));
    voice = english[0] || null;
    voiceIsMale = !!voice && MALE_VOICE.test(voice.name) && !/female/i.test(voice.name);
    if (typeof renderVoiceToggle === 'function') renderVoiceToggle();
  }
  if (synth) { pickVoice(); synth.addEventListener('voiceschanged', pickVoice); }

  // Chrome only lets speech play after a user gesture: speak a silent utterance on the
  // first click/keypress so later answers (which arrive after an await) are allowed to play.
  // The page opens on the wake screen, so that first gesture is the click that wakes Jarvis,
  // and it also speaks the boot greeting.
  function unlockSpeech(e) {
    if (speechUnlocked || !synth) return;
    speechUnlocked = true;
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    synth.speak(u);
    if (greetingPending && !(e && e.target && askEl.contains(e.target))) speak(GREETING.replace('J.A.R.V.I.S.', 'Jarvis'), 8);
    greetingPending = false;

  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>

  // ---- boot greeting -------------------------------------------------------------------
  const hour = new Date().getHours();
  const partOfDay = hour < 5 ? 'evening' : hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';
  // The facts stay the same each boot; the wit around them changes. Each pool remembers what it
  // said last time, so the same line never comes up twice in a row.
  const NOTE_QUIPS = [
    'which is more than can be said for your inbox',
    'filed with a tidiness your desk can only aspire to',
    'none of them overdue, unlike some actions I could mention',
    'each one exactly where Penn left it, which he will remind you of',

  (function themePanel() {
    const box = document.getElementById('theme');
    const field = (k, type) => box.querySelector(`input[type=${type}][data-k=${k}]`);
    const current = { ...THEME.base };
    const apply = next => {
      if (next.green === THEME.base.green && next.orange === THEME.base.orange) return;
      THEME.save(next.green, next.orange);
      try { sessionStorage.setItem('jarvis-skip-wake', '1'); } catch (_) {}
      location.reload();
    };
    ['green', 'orange'].forEach(k => {
      const text = field(k, 'text'), pick = field(k, 'color');
      text.value = pick.value = current[k];
      text.addEventListener('input', () => {
        let v = text.value.trim();
        if (v && v[0] !== '#') v = '#' + v;

        text.classList.toggle('bad', !!text.value && !ok);
        if (ok) { pick.value = v.toLowerCase(); current[k] = v.toLowerCase(); }

      text.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!text.classList.contains('bad')) apply(current); } });
      text.addEventListener('blur', () => { if (!text.classList.contains('bad')) apply(current); });
      pick.addEventListener('change', () => { current[k] = text.value = pick.value.toLowerCase(); apply(current); });

        const stop = btn('', async () => {
          stop.disabled = true; stop.textContent = 'Stopping…';
          try { trackJob(await api('/api/jobs/stop', { id: j.id })); }
          catch (err) { setStatus('error', err.message, 4000); stop.disabled = false; stop.innerHTML = label; }
        });
        stop.innerHTML = label;
        stop.classList.add('stop'); stop.title = 'Stop the team now';
      } else {
        btn('Read report', () => showAnswer(`The team's report · ${j.task}`, j.report, []));
        if (j.rebuilt) btn('↻ Reload galaxy', () => location.reload());
      }
      el.appendChild(tools);
      jobsEl.appendChild(el);
    });
    refreshStop();
    renderContext();
  }

  // ---- context gauge ------------------------------------------------------------------
  // Jarvis starts every question with a fresh, capped context (6 notes + the last 4 turns), so his
  // row shows the last answer. A job shows one row per agent: Larry plus each specialist he briefs,
  // each with its own window. Claude Code compacts an agent's conversation itself before it fills.
  const contextEl = document.getElementById('context');
  contextEl.innerHTML = '<div class="models"></div><div class="gauge"></div>';
  const gaugeEl = contextEl.querySelector('.gauge');
  let jarvisContext = null;
  const fmtTokens = n => n >= 1e9 ? `${(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `${(n / 1e6).toFixed(n % 1e6 ? 1 : 0)}M` : n >= 1000 ? `${Math.round(n / 1000)}k` : String(n);
  const gaugeColor = pct => pct < 50 ? tc('#bad367') : pct < 80 ? tc('#ff9f43') : tc('#ff5c7a');

  function contextRow(name, c, done) {
    const pct = c.window ? Math.min(100, (c.used / c.window) * 100) : 0;
    const shown = pct < 1 && pct > 0 ? '<1' : Math.round(pct);
    return `<div class="row${done ? ' done' : ''}" title="${escapeHtml(name)}: ${c.used.toLocaleString()} of ` +
      `${c.window.toLocaleString()} tokens"><b>${escapeHtml(name)}${done ? ' ✓' : ''}</b>` +
      `<div class="bar" style="--c:${gaugeColor(pct)}"><i style="width:${pct}%"></i></div>` +
      `<span class="num">${fmtTokens(c.used)} · ${shown}%</span></div>`;
  }

  function renderContext() {
    // Every running job, or else the most recent finished one still in the tray.
    let shown = [...jobs.values()].filter(j => j.status === 'running' && j.agents);
    if (!shown.length) shown = [...jobs.values()].filter(j => !dismissed.has(j.id) && j.agents).slice(0, 1);
    let html = `<div class="title"><span>Context</span><span>${fmtTokens((jarvisContext || {}).window || 1e6)} window</span></div>`;
    html += jarvisContext ? contextRow('Jarvis', jarvisContext) :
      '<div class="row"><b>Jarvis</b><div class="bar" style="--c:' + tc('#bad367') + '"><i style="width:0"></i></div><span class="num">idle</span></div>';
    let foot = 'Jarvis starts fresh each question, capped at 6 notes and 4 turns.', warn = false;
    shown.forEach((job, n) => {
      if (shown.length > 1) html += `<div class="foot">Job ${n + 1}: ${escapeHtml(job.task.slice(0, 48))}…</div>`;
      job.agents.forEach(a => { html += contextRow(a.name, a, job.status !== 'running' || a.done); });
    });
    if (shown.length) {
      const all = shown.flatMap(j => j.agents);
      const peak = Math.max(...all.map(a => a.used / (a.window || 1)));
      const compactions = shown.reduce((s, j) => s + (j.compactions || 0), 0);
      warn = peak >= 0.8 || compactions > 0;
      if (compactions) foot = `Compacted ${compactions}× so far to stay inside the window.`;
      else if (peak >= 0.8) foot = 'Getting full: Claude Code will compact this agent automatically.';
      else foot = shown[0].status === 'running' ? 'Each agent has its own window; specialists start empty.' :
                  `Last job peaked at ${Math.round(peak * 100)}% of the window.`;
    }
    html += `<div class="foot${warn ? ' warn' : ''}">${escapeHtml(foot)}</div>`;
    gaugeEl.innerHTML = html;
  }

  // ---- model switcher -------------------------------------------------------------------
  // Jarvis (answers, Outlook, transcripts) and Larry's team (background jobs) each have their own
  // model, saved in config.json on the server. A change applies from the next question or job.
  const modelsEl = contextEl.querySelector('.models');
  async function loadModels() {
    let m;
    try { m = await api('/api/models'); } catch (_) { return; }
    modelsEl.innerHTML = '';
    [['chat', 'Jarvis', 'Model for answers, Outlook and transcripts'],
     ['jobs', 'Team', 'Model for the team on background jobs']].forEach(([role, label, tip]) => {
      const b = document.createElement('b'); b.textContent = label; b.title = tip;
      const sel = document.createElement('select'); sel.title = tip; sel.setAttribute('aria-label', tip);
      m.models.forEach(x => {
        const o = document.createElement('option');
        o.value = x.id; o.textContent = x.name + (x.note ? ` · ${x.note}` : '');
        sel.appendChild(o);
      });
      sel.value = m[role];
      sel.onchange = async () => {
        const before = m[role];
        try {
          m = await api('/api/models', { [role]: sel.value });
          const name = m.models.find(x => x.id === m[role]).name;
          setStatus('thinking', `${label} now on ${name}`, 3000);
        } catch (err) { sel.value = before; setStatus('error', err.message, 4000); }
      };
      modelsEl.append(b, sel);
    });
    // How much the team may do without asking (applies from the next job or chat message).
    const tip = 'What Larry and the team may do without asking you';
    const b = document.createElement('b'); b.textContent = 'Agents'; b.title = tip;
    const perm = document.createElement('select'); perm.title = tip; perm.setAttribute('aria-label', tip);
    [['auto', 'Auto · asks only for risky steps'], ['ask', 'Ask me · approve more steps']].forEach(([v, t]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = t; perm.appendChild(o);
    });
    perm.value = m.permissions || 'auto';
    perm.onchange = async () => {
      const before = m.permissions;
      try {
        m = await api('/api/models', { permissions: perm.value });
        setStatus('thinking', m.permissions === 'auto' ? 'agents on Auto: only risky steps will ask you' : 'agents will ask before more steps', 3500);
      } catch (err) { perm.value = before; setStatus('error', err.message, 4000); }
    };
    modelsEl.append(b, perm);
  }
  loadModels();
  renderJobs();
  pollJobs();   // pick up anything still running from before a reload
  setInterval(loadHires, 60000);   // hires can also be staged from Team chat or Claude Code

  // ---- J.A.R.V.I.S. emblem -----------------------------------------------------------
  const jarvisEl = document.getElementById('jarvis');
  const SVGNS = 'http://www.w3.org/2000/svg';
  const pt = (r, deg) => { const a = deg * Math.PI / 180; return `${(r * Math.sin(a)).toFixed(2)} ${(-r * Math.cos(a)).toFixed(2)}`; };
  const arc = (r, a0, a1) => `M${pt(r, a0)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${pt(r, a1)}`;
  const sector = (r1, r2, a0, a1) => `M${pt(r2, a0)} A${r2} ${r2} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${pt(r2, a1)} ` +
                                     `L${pt(r1, a1)} A${r1} ${r1} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${pt(r1, a0)}Z`;
  function svgEl(parent, tag, attrs) {
    const e = document.createElementNS(SVGNS, tag);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
    parent.appendChild(e);
    return e;
  }
  const J = { ticks: document.getElementById('j-ticks'), band: document.getElementById('j-band'),
              gold: document.getElementById('j-gold'), inner: document.getElementById('j-inner') };
  // Outer tick ring.
  for (let i = 0; i < 120; i++) {
    const major = i % 10 === 0, a = i * 3;
    if (!major && i % 2) continue;
    const [x1, y1] = pt(major ? 97 : 101, a).split(' '), [x2, y2] = pt(108, a).split(' ');
    svgEl(J.ticks, 'line', { x1, y1, x2, y2, class: major ? 'tick major' : 'tick', opacity: major ? 0.95 : 0.55 });
  }
  svgEl(J.ticks, 'path', { d: arc(104, 200, 330), class: 'ring', 'stroke-width': 0.8, opacity: 0.6 });
  // Thick blue band: segmented, about three quarters of the way round.
  for (let a = -150; a < 112; a += 7) {
    svgEl(J.band, 'path', { d: sector(74, 92, a, a + 5.8), class: 'band', opacity: (0.45 + 0.4 * Math.abs(Math.sin(a / 23))).toFixed(2) });
  }
  svgEl(J.band, 'path', { d: arc(95, -150, 112), class: 'ring', 'stroke-width': 0.9, opacity: 0.7 });
  // Gold line and markers riding over the band, turning the other way.
  svgEl(J.gold, 'path', { d: arc(70, 205, 262), class: 'gold', 'stroke-width': 2.6 });
  svgEl(J.gold, 'path', { d: arc(70, 268, 274), class: 'gold', 'stroke-width': 2.6 });
  [-24, -12, 0, 12, 24].forEach(a => svgEl(J.gold, 'circle', { cx: pt(83, a).split(' ')[0], cy: pt(83, a).split(' ')[1], r: 2.3, fill: tc('#ff9f43') }));

  const jAngle = { ticks: 0, band: 0, gold: 0, inner: 0 };
  let energy = 0, streamLevel = 0, lastFrame = performance.now();
  function animateJarvis(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    const mode = ['speaking', 'thinking', 'listening'].find(m => statusEl.classList.contains(m)) || 'idle';
    const speaking = mode === 'speaking';
    // While speaking: word-boundary kicks (where the voice reports them) over a speech-like flutter.
    voiceKick *= Math.pow(0.03, dt);
    const flutter = 0.45 + 0.55 * Math.abs(Math.sin(now / 95) * Math.sin(now / 247));
    const goal = speaking ? Math.max(flutter, voiceKick) : mode === 'thinking' ? 0.45 : mode === 'listening' ? 0.3 : 0;
    energy += (goal - energy) * Math.min(1, dt * 8);
    const spin = 1 + energy * 6 + (mode === 'thinking' ? 3 : 0);
    jAngle.ticks += dt * 5 * spin;
    jAngle.band += dt * 16 * spin;
    jAngle.gold -= dt * 34 * spin;
    jAngle.inner -= dt * 12 * spin;
    Object.keys(J).forEach(k => J[k].setAttribute('transform', `rotate(${(jAngle[k] % 360).toFixed(2)})`));
    J.band.setAttribute('opacity', (0.7 + 0.3 * energy).toFixed(2));
    jarvisEl.style.setProperty('--energy', energy.toFixed(3));

    // The galaxy joins in while Jarvis speaks: packets stream along the links, lit notes pulse.
    streamLevel += ((speaking ? 1 : 0) - streamLevel) * Math.min(1, dt * (speaking ? 3 : 1.5));
    if (streamLevel < 0.005) streamLevel = 0;
    if (linksLive !== streamLevel > 0.2) { linksLive = !linksLive; Graph.linkColor(linkColor); }
    updateStream(now / 1000, streamLevel);
    updateSparks(dt, streamLevel);
    pulseNodes(now / 1000, streamLevel);
    if (!streamLevel && overlayPairs.length) overlayMat.opacity = overlayOpacity;
  }

  // Sit just under the Index, wherever its height ends up.
  function placeJarvis() {
    const legend = document.getElementById('legend');
    const h = legend.offsetHeight;
    document.documentElement.style.setProperty('--jarvis-top', h ? `${legend.offsetTop + h + 28}px` : '22px');
  }
  placeJarvis();
  window.addEventListener('resize', placeJarvis);

  // Talk to the emblem: same as the mic button (the first click only wakes him).
  jarvisEl.onclick = () => (waking ? wakeUp() : micEl.onclick());

  // ---- slow idle drift ---------------------------------------------------------------
  let driftResumeAt = 0;
  function pauseDrift(ms) { driftResumeAt = ms === Infinity ? Infinity : performance.now() + ms; }
  const el = Graph.renderer().domElement;
  ['pointerdown', 'wheel', 'touchstart'].forEach(ev =>
    el.addEventListener(ev, () => { if (selected === null) pauseDrift(6000); }, { passive: true }));

  Graph.cameraPosition({ x: 0, y: 300, z: 1700 });
  (function drift() {
    animateJarvis(performance.now());
    if (performance.now() > driftResumeAt) {
      const cam = Graph.camera(), ctr = Graph.controls().target;
      const dx = cam.position.x - ctr.x, dz = cam.position.z - ctr.z;
      const a = 0.0006;
      cam.position.x = ctr.x + dx * Math.cos(a) - dz * Math.sin(a);
      cam.position.z = ctr.z + dx * Math.sin(a) + dz * Math.cos(a);
      cam.lookAt(ctr);
    }
    if (overlayPairs.length) updateOverlay();   // follow nodes while the layout is still moving
    requestAnimationFrame(drift);
  })();

  window.addEventListener('resize', () => Graph.width(innerWidth).height(innerHeight));

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---- new project ------------------------------------------------------------------
  // Creates copilot/projects/<Name>/ with its project.md, adds the Projects.md row, rebuilds the
  // galaxy, then reloads straight onto the new project.
  function showNewProject() {
    openView({
      kicker: 'Projects', title: 'New project', accent: tc('#bad367'),
      render: (bar, content) => {
        content.innerHTML = `<form class="newproj" autocomplete="off">
            <label for="np-name">Project name</label>
            <input id="np-name" maxlength="60" placeholder="e.g. Brisbane Isuzu FY27" required>
            <label for="np-desc">What it covers</label>
            <textarea id="np-desc" maxlength="300" placeholder="One line for the Projects index, e.g. AASB S2 climate reporting for Brisbane Isuzu."></textarea>
            <div class="what">Creates <code>copilot/projects/&lt;name&gt;/</code> in RTM_PKM with its <code>project.md</code>
              (so Obsidian Copilot sees it), adds a row to <code>Projects.md</code>, and refreshes the galaxy.</div>
            <div class="tools"></div><div class="msg-line"></div></form>`;
        const form = content.querySelector('form'), msg = content.querySelector('.msg-line');
        const name = content.querySelector('#np-name'), desc = content.querySelector('#np-desc');
        const go = linkButton(content.querySelector('.tools'), 'Create project', () => form.requestSubmit());
        go.classList.add('primary');
        setTimeout(() => name.focus(), 50);
        form.onsubmit = async e => {
          e.preventDefault();
          if (!name.value.trim()) return;
          go.disabled = true; msg.className = 'msg-line';
          msg.textContent = 'Creating the folder and refreshing the galaxy… about half a minute.';
          try {
            const r = await api('/api/projects', { name: name.value, description: desc.value });
            try { sessionStorage.setItem('galaxy-open-project', r.name); } catch (_) {}
            msg.textContent = `Created ${r.folder}. Reloading…`;
            setTimeout(() => location.reload(), 600);
          } catch (err) { msg.className = 'msg-line err'; msg.textContent = err.message; go.disabled = false; }
        };
      }
    }, false);
  }
  // After a reload from "Create project", light the new project up.
  try {
    const fresh = sessionStorage.getItem('galaxy-open-project');
    if (fresh) {
      sessionStorage.removeItem('galaxy-open-project');
      const p = projects.find(x => x.name === fresh);
      if (p) setTimeout(() => showProject(p), 1200);
    }
  } catch (_) {}

  // ---- metrics bar ---------------------------------------------------------------------
  // Five tiles: token use (7/30/90 days or 12 months), the next meeting, open actions, things
  // waiting to be filed, and vault activity over the same period. Refreshed every five minutes.
  const metricsEl = document.getElementById('metrics');
  let metricPeriod = 30;
  try { metricPeriod = +localStorage.getItem('galaxy-metric-period') || 30; } catch (_) {}
  const PERIOD_LABEL = { 7: '7 days', 30: '30 days', 90: '90 days', 365: '12 months' };
  function tile(color, key, onClick) {
    const t = document.createElement('button');
    t.type = 'button'; t.className = 'metric'; t.style.setProperty('--accent', color);
    t.innerHTML = `<div class="k"><span>${key}</span></div><div class="v">…</div><div class="s">&nbsp;</div>`;
    if (onClick) t.onclick = e => { if (!e.target.closest('select')) onClick(); };
    metricsEl.appendChild(t);
    return { el: t, set(v, sub, title) { t.querySelector('.v').innerHTML = v; t.querySelector('.s').innerHTML = sub || '&nbsp;'; if (title) t.title = title; } };
  }
  const tTokens = tile(tc('#bad367'), 'Tokens');
  const tMeeting = tile(tc('#f7853b'), 'Next meeting', () => {
    const sec = [...railEl.querySelectorAll('.section')].find(x => /Outlook/.test(x.innerText));
    if (sec && !sec.classList.contains('open')) sec.querySelector('.head').click();
  });
  const tActions = tile(tc('#a3e37a'), 'Open actions', () => showActions());
  const tFile = tile(tc('#ffc46b'), 'To file', () => showNotes());
  const tActivity = tile(tc('#7fc35a'), 'Vault activity', () => showMeetings());

  const periodSel = document.createElement('select');
  periodSel.setAttribute('aria-label', 'Period');
  Object.entries(PERIOD_LABEL).forEach(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; periodSel.appendChild(o); });
  periodSel.value = String(metricPeriod);
  periodSel.onchange = () => {
    metricPeriod = +periodSel.value;
    try { localStorage.setItem('galaxy-metric-period', metricPeriod); } catch (_) {}
    refreshMetrics();
  };
  tTokens.el.querySelector('.k').appendChild(periodSel);

  async function refreshMetrics() {
    let m;
    try { m = await api(`/api/metrics?period=${metricPeriod}`); } catch (_) { return; }
    const span = PERIOD_LABEL[m.period];
    const t = m.tokens;
    const partial = t.since && (Date.now() - Date.parse(t.since)) / 864e5 < m.period - 1;
    tTokens.set(fmtTokens(t.fresh), `${fmtTokens(t.cached)} cached reads · Jarvis ${fmtTokens(t.jarvis)}`,
      `New tokens (input, cache writes and output) across Claude Code on this PC over ${span}: ${t.fresh.toLocaleString()}.\n` +
      `Cached re-reads: ${t.cached.toLocaleString()}. Output: ${t.output.toLocaleString()}. Jarvis and Larry from this page: ${t.jarvis.toLocaleString()}.` +
      (partial ? `\nHistory starts ${t.since}: Claude Code keeps about 30 days of sessions, and Jarvis keeps daily totals from now on.` : ''));
    const a = m.actions;
    tActions.set(String(a.open), [a.overdue && `<b>${a.overdue} overdue</b>`, `${a.due_week} due this week`].filter(Boolean).join(' · '),
      'Open actions in Actions/. Click to tick them off.');
    tFile.set(String(m.to_file.total), `${m.to_file.fleeting} fleeting · ${m.to_file.inbox} in Team Inbox`,
      'Unfiled fleeting notes plus files waiting in Team Inbox. Say "file my notes" and I will have them swept.');
    tActivity.set(`${m.activity.notes_changed} <small>notes</small>`, `${m.activity.meetings} meetings · ${span}`,
      `Notes created or changed, and meetings held, over ${span}.`);
  }

  // Next meeting: from the Outlook card's cached feed (one Outlook check every ten minutes at most).
  const toToday = s => {
    const m = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i.exec(s || '');
    if (!m) return null;
    let h = +m[1]; const min = +(m[2] || 0), ap = (m[3] || '').toLowerCase();
    if (ap === 'pm' && h < 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    const d = new Date(); d.setHours(h, min, 0, 0); return d;
  };
  async function refreshMeeting() {
    tMeeting.set('<small>Checking Outlook…</small>', '');
    let today;
    try { today = await api('/api/today'); } catch (err) { tMeeting.set('<small>Outlook unavailable</small>', escapeHtml(err.message)); return; }
    const now = new Date();
    const upcoming = (today.events || []).map(e => ({ ...e, s: toToday(e.start), e: toToday(e.end) }))
      .filter(e => e.s && (e.e ? e.e > now : e.s > now)).sort((x, y) => x.s - y.s);
    const next = upcoming[0];
    if (!next) { tMeeting.set('<small>Diary clear</small>', 'No more meetings today'); return; }
    const mins = Math.round((next.s - now) / 60000);
    const when = mins <= 0 ? `on now · until ${escapeHtml(next.end || '')}` : mins < 60 ? `in ${mins} min` : `in ${Math.floor(mins / 60)} h ${mins % 60} min`;
    tMeeting.set(`${escapeHtml(next.start)} <small>${escapeHtml(next.title || '')}</small>`,
      `${when}${upcoming.length > 1 ? ` · ${upcoming.length - 1} more today` : ''}`, `${next.title}\n${next.start}–${next.end || ''} ${next.location || ''}`);
  }
  refreshMetrics();
  refreshMeeting();
  setInterval(refreshMetrics, 5 * 60 * 1000);
  setInterval(refreshMeeting, 10 * 60 * 1000);

  // ---- first-run onboarding ------------------------------------------------------------
  // Runs once, after the first wake, when the server says no one has been welcomed yet.
  // Every step can be skipped; everything chosen here can be changed later.
  function saveSetup(patch) {
    Object.assign(SETUP, patch);
    try { localStorage.setItem('jarvis-setup', JSON.stringify(SETUP)); } catch (_) {}
    return api('/api/setup', patch).then(d => { Object.assign(SETUP, d); return d; }).catch(() => null);
  }
  let onboardStarted = false;
  async function maybeOnboard(force) {
    if (onboardStarted) return;
    let info;
    try { info = await api('/api/setup'); } catch (_) { return; }
    Object.assign(SETUP, info);
    try { localStorage.setItem('jarvis-setup', JSON.stringify(SETUP)); } catch (_) {}
    if (info.onboarded && !force) return;
    onboardStarted = true;
    runOnboarding(info);
  }
  window.JARVIS_ONBOARD = () => { onboardStarted = false; maybeOnboard(true); };

  function runOnboarding(info) {
    const wrap = document.createElement('div');
    wrap.id = 'onboard';
    wrap.innerHTML = '<div class="card" role="dialog" aria-modal="true" aria-labelledby="ob-title"></div>';
    document.body.appendChild(wrap);
    const card = wrap.querySelector('.card');
    const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const who = () => SETUP.address || SETUP.user_name || '';
    const englishVoices = () => (synth ? synth.getVoices() : []).filter(v => /^en([-_]|$)/i.test(v.lang));
    const team = (typeof agents !== 'undefined' ? agents : []).filter(a => a && a.name);
    let i = 0;

    const steps = [
      {
        title: 'Welcome. I am Jarvis.',
        say: "Good day. I am Jarvis, and I look after your notes and your team. First things first: what should I call you?",
        body: () => `<p>I look after your notes, answer questions out loud and pass real work to your AI team.
          A minute of setup and we are done. You can skip anything.</p>
          <label for="ob-name">Your first name</label><input type="text" id="ob-name" maxlength="60" value="${esc(SETUP.user_name)}" autocomplete="given-name">
          <label for="ob-addr">How should I address you? (optional: sir, madam, boss, or just your name)</label>
          <input type="text" id="ob-addr" maxlength="40" value="${esc(SETUP.address)}">`,
        next: () => saveSetup({ user_name: card.querySelector('#ob-name').value.trim(),
                                address: card.querySelector('#ob-addr').value.trim() })
      },
      {
        title: 'My voice',
        say: () => `Splendid${who() ? ', ' + who() : ''}. Pick a voice you can bear to hear every day, and a speed.`,
        body: () => {
          const vs = englishVoices();
          const opts = ['<option value="">Let me choose (a British male voice if there is one)</option>']
            .concat(vs.map(v => `<option value="${esc(v.name)}"${v.name === SETUP.voice ? ' selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`));
          return `<label for="ob-voice">Voice</label><select id="ob-voice">${opts.join('')}</select>
            <label for="ob-rate">Speed: <span id="ob-rate-v">${(Number(SETUP.rate) || 1.2).toFixed(1)}</span></label>
            <input type="range" id="ob-rate" min="0.8" max="1.6" step="0.1" value="${Number(SETUP.rate) || 1.2}">
            <div class="row" style="justify-content:flex-start"><button type="button" id="ob-preview">Preview</button></div>
            ${vs.length ? '' : '<p class="note">No voices found yet. Chrome or Edge loads them a moment after the page opens; go back and forward to refresh the list.</p>'}`;

    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0d1028, 45, 80);
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);
    scene.add(new THREE.HemisphereLight(0xfff6ea, 0x1a1d3a, 1.25));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(-8, 26, 16); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 24, bottom: -24, near: 1, far: 80 });
    scene.add(sun);
    // Floor: navy slab, faint grid, a soft mint rug under the work area and a walkway to HQ.
    const floor = new THREE.Mesh(new THREE.BoxGeometry(50, 0.4, 32), mat(0x1b1f45, { roughness: 0.95 }));
    floor.position.set(1, -0.2, 0); floor.receiveShadow = true; scene.add(floor);
    const grid = new THREE.GridHelper(50, 50, new THREE.Color(tc('#bad367')), new THREE.Color(tc('#bad367')));
    grid.material.transparent = true; grid.material.opacity = 0.06; grid.position.set(1, 0.01, 0); scene.add(grid);
    const rug = rbox(23, 0.04, 26, 0.6, 0x252a5c, { roughness: 1 }); rug.castShadow = false; scene.add(at(rug, 6.5, 0.03, 0));
    const walk = mat(new THREE.Color(tc('#ffb347')), { emissive: new THREE.Color(tc('#ffb347')), emissiveIntensity: 0.25 });
    [[-6.3, 0, 0.12, 27]].forEach(([x, z, w, d]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.02, d), walk); m.position.set(x, 0.06, z); scene.add(m); });

    F = { renderer, scene, camera, pads: [], stations: [], bots: new Map(), next: 0,
          yaw: -0.22, pitch: 0.85, dist: 44, target: new THREE.Vector3(-1.5, 0, 0.5) };

    // Team HQ: a raised charging bay with a glowing pad per team member.
    scene.add(at(rbox(9, 0.3, 26, 0.3, 0x232857), HQ_X, 0.15, 0));
    const hqSign = labelSprite('Team HQ · charging', '#bad367', { size: 34 }); hqSign.position.set(HQ_X, 3.4, -12); scene.add(hqSign);
    for (let i = 0; i < 24; i++) {
      const x = HQ_X - 2.6 + (i % 3) * 2.6, z = -10 + Math.floor(i / 3) * 2.9;
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.85, 0.12, 28),
        mat(0x2d3570, { emissive: new THREE.Color(tc('#bad367')), emissiveIntensity: 0.2 }));
      p.position.set(x, 0.36, z); p.receiveShadow = true; scene.add(p);
      F.pads.push({ pos: new THREE.Vector3(x, 0.42, z), mesh: p });
    }

    // The factory floor: six desks, Larry's control desk, and the machines.
    [[-0.5, -10], [-0.5, -5], [5, -10], [5, -5], [10.5, -10], [10.5, -5]].forEach(([x, z], i) =>
      addStation('desk', x, z, buildDesk, [[0, -1.35]], i === 0 ? { text: 'Desks', y: 2.6 } : null));
    addStation('control', 16, -7.5, buildControl, [[0, -1.45]], { text: "Larry's desk", y: 2.7 });
    addStation('filing', -0.5, 1, buildFiling, [[-0.5, -1.4], [0.6, -1.4]], { text: 'Filing', y: 2.8 });
    addStation('cruncher', 5, 1, buildCruncher, [[-0.6, -1.55], [0.6, -1.55]], { text: 'Data cruncher', y: 3.4 });
    addStation('recorder', 10.5, 1, buildRecorder, [[-0.6, -1.35], [0.6, -1.35]], { text: 'Meeting recorder', y: 2.6 });
    addStation('mail', -0.5, 7.5, buildMail, [[-0.4, -1.3], [0.7, -1.3]], { text: 'Mail room', y: 2.8 });
    addStation('web', 5, 7.5, buildDish, [[-0.6, -1.3], [0.6, -1.3]], { text: 'Web dish', y: 3.5 });
    addStation('press', 10.5, 7.5, g => {           // the print press: where finished files come out
      g.add(at(rbox(1.4, 1.2, 2.0, 0.2, PASTEL.mint), 0, 0.6, 0));
      g.add(at(rbox(0.5, 0.1, 1.2, 0.05, 0xffffff), 0.75, 0.75, 0));
      const roller = at(cyl(0.16, 0.16, 1.4, PASTEL.cream, 16), 0, 1.3, 0); roller.rotation.x = Math.PI / 2; g.add(roller);
      const sheet = at(rbox(0.6, 0.03, 0.9, 0.02, 0xffffff), 0.6, 0.85, 0); g.add(sheet);
      return { roller, sheet };
    }, [[-0.6, -1.4], [0.6, -1.4]], { text: 'Print press', y: 2.4 });
    plant(16, -2, 1.6); plant(16, 3, 1.3); plant(16, 8.5, 1.7); plant(-3.6, -12, 1.3); plant(-3.6, 11.5, 1.4);

    // Sparks: a small pool of points that fly off busy equipment.
    const SPARKS = 160;
    F.sparkPos = new Float32Array(SPARKS * 3); F.sparkVel = new Float32Array(SPARKS * 3); F.sparkLife = new Float32Array(SPARKS);
    F.sparkGeo = new THREE.BufferGeometry(); F.sparkGeo.setAttribute('position', new THREE.BufferAttribute(F.sparkPos, 3));
    scene.add(new THREE.Points(F.sparkGeo, new THREE.PointsMaterial({ color: new THREE.Color(tc('#ffb347')), size: 0.12, transparent: true, opacity: 0.95 })));

    // Drag to turn the view, wheel to zoom, click a bot (or its name tag or bubble) to chat with it.
    let drag = null;
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    const botAt = e => {
      const r = crewCanvas.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, F.camera);
      for (const hit of ray.intersectObjects([...F.bots.values()].map(b => b.group), true)) {
        let o = hit.object; while (o && !o.userData.botName) o = o.parent;
        if (o) return o.userData.botName;
      }
      return null;
    };
    crewCanvas.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, yaw: F.yaw, pitch: F.pitch, moved: false }; crewCanvas.setPointerCapture(e.pointerId); };
    crewCanvas.onpointermove = e => {
      if (!drag) { crewCanvas.style.cursor = botAt(e) ? 'pointer' : 'grab'; return; }
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) drag.moved = true;
      F.yaw = drag.yaw - (e.clientX - drag.x) * 0.006; F.pitch = Math.min(1.35, Math.max(0.35, drag.pitch + (e.clientY - drag.y) * 0.005)); };
    crewCanvas.onpointerup = e => {
      const click = drag && !drag.moved; drag = null;
      if (click) { const name = botAt(e); if (name) chatWithBot(name); }
    };
    crewCanvas.onwheel = e => { e.preventDefault(); F.dist = Math.min(70, Math.max(14, F.dist + e.deltaY * 0.02)); };
  }

  // Which piece of equipment an activity happens at.
  function equipmentFor(w) {
    if (!w) return 'hq';
    if (w.done) return 'hq';
    const a = (w.activity || '').toLowerCase();
    if (/outlook|mail/.test(a)) return 'mail';
    if (/fireflies|transcript/.test(a)) return 'recorder';
    if (/webfetch|websearch|web/.test(a)) return 'web';
    if (/running a command/.test(a)) return 'cruncher';
    if (/looking for files|searching/.test(a)) return 'filing';
    if (/^writing|^editing/.test(a)) return Math.random() < 0.5 ? 'press' : 'desk';
    if (/briefing|handed work/.test(a) && w.agent === 'Larry') return 'control';
    return 'desk';
  }

  // A cute bot: white round head, dark visor with two glowing eyes, antenna, little arms and feet.
  function makeBot(name) {
    const colour = new THREE.Color(colourOf(name)), g = new THREE.Group(), body = new THREE.Group();
    g.add(body);
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.32, 6, 16), mat(colour, { roughness: 0.35 }));
    torso.position.y = 0.62; torso.castShadow = true; body.add(torso);
    const belly = new THREE.Mesh(new THREE.CircleGeometry(0.16, 20), mat(0xffffff, { emissive: colour, emissiveIntensity: 0.6 }));
    belly.position.set(0, 0.62, 0.345); body.add(belly);
    const head = new THREE.Group(); head.position.y = 1.32; body.add(head);
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.46, 28, 20), mat(0xf2f4fb, { roughness: 0.3 }));
    skull.scale.set(1.1, 0.9, 1); skull.castShadow = true; head.add(skull);
    const visor = new THREE.Mesh(new THREE.SphereGeometry(0.4, 28, 16, Math.PI * 0.16, Math.PI * 0.68, Math.PI * 0.28, Math.PI * 0.4),
      mat(0x0e1030, { roughness: 0.2, metalness: 0.5 }));
    visor.scale.set(1.14, 0.92, 1.18); visor.position.z = 0.02; head.add(visor);
    const eyeMat = new THREE.MeshBasicMaterial({ color: colour.clone().lerp(new THREE.Color(0xffffff), 0.35) });
    const eyes = [-0.15, 0.15].map(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 10), eyeMat);
      e.position.set(x * 1.1, 0.03, 0.47); e.scale.set(1, 1.3, 0.5); head.add(e); return e; });
    [-0.5, 0.5].forEach(x => { const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.08, 16), mat(colour));
      ear.rotation.z = Math.PI / 2; ear.position.set(x, 0, 0); head.add(ear); });
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 8), mat(0x9aa3c0)); stalk.position.y = 0.52; head.add(stalk);
    const tipMat = new THREE.MeshStandardMaterial({ color: colour, emissive: colour, emissiveIntensity: 0.6 });
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.08, 14, 10), tipMat); tip.position.y = 0.7; head.add(tip);
    const arms = [-1, 1].map(s => { const pivot = new THREE.Group(); pivot.position.set(0.42 * s, 0.78, 0);
      const a = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.26, 4, 10), mat(colour)); a.position.y = -0.18; a.castShadow = true;
      pivot.add(a); body.add(pivot); return pivot; });
    const feet = [-1, 1].map(s => { const f = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 10), mat(0x2d3570));
      f.scale.set(1, 0.6, 1.3); f.position.set(0.17 * s, 0.1, 0.03); f.castShadow = true; g.add(f); return f; });
    const tag = labelSprite(name, '#' + colour.getHexString(), { size: 30, scale: 0.0075 }); tag.position.set(0, -0.12, 0.5); g.add(tag);
    g.scale.setScalar(1.4); g.userData.botName = name;
    F.scene.add(g);
    return { name, group: g, body, head, eyes, arms, feet, tip, tipMat, tag, bubble: null, bubbleText: '',
             pos: g.position, target: new THREE.Vector3(), phase: Math.random() * 6, wait: 0, spot: -1, zone: null, work: null };
  }

  function sizeCrew() {
    if (!F) initFactory();
    const r = crewCanvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    F.renderer.setSize(r.width, r.height, false);
    F.camera.aspect = r.width / r.height; F.camera.updateProjectionMatrix();
  }
  new ResizeObserver(() => { if (crewOpen) sizeCrew(); }).observe(crewCanvas);

  // Click a bot or a row: chat with that agent. One working in a team chat opens that same chat;
  // one working for a job opens a new chat with its task already quoted; an idle one, a fresh chat.
  function chatWithBot(name) {
    const member = team.find(a => a.name.toLowerCase() === String(name).toLowerCase());
    if (!member) { setStatus('error', `${name} is a helper, not someone you can chat with`, 3500); return; }
    const w = crew.workers.find(x => x.agent === member.name && !x.done);
    closeCrew();
    if (!w) { showTeamChat(member.name); return; }
    const [src, id, who] = w.key.split(':');
    if (src === 'chat' && who === 'main') { showTeamChat(member.name, id); return; }
    const about = [w.project && w.project !== 'General' ? w.project : '', w.task || w.activity].filter(Boolean).join(': ');
    showTeamChat(member.name, null, `About the task you're working on now (${about}): `);
  }
  crewList.addEventListener('click', e => { const r = e.target.closest('.row[data-agent]'); if (r) chatWithBot(r.dataset.agent); });

  // The side list: anything waiting on you first (approve, deny or answer right here), then who is
  // working on what. The requests are redrawn only when they change, so a card never flickers.
  const crewAsks = document.createElement('div'), crewRows = document.createElement('div');
  crewList.append(crewAsks, crewRows);
  let crewAsksKey = null;
  function renderCrewAsks() {
    const reqs = [...pendingByChat.values()];
    const key = reqs.map(r => r.ticket + ':' + (r.plain ? r.plain.length : 0)).join();
    if (key === crewAsksKey) return;
    crewAsksKey = key;
    crewAsks.innerHTML = '';
    if (!reqs.length) return;
    const g = document.createElement('div'); g.className = 'grp asks'; g.style.setProperty('--accent', tc('#ffb347'));
    g.innerHTML = `<h4>Waiting for you · ${reqs.length}</h4>`;
    reqs.forEach(r => {
      const card = approvalCard(r, () => { pendingByChat.delete(r.chat); crewAsksKey = null; renderCrewAsks(); assignBots(); });
      const open = document.createElement('button'); open.type = 'button'; open.className = 'link-btn';
      open.textContent = `Open ${r.agent}'s chat`; open.onclick = () => { closeCrew(); showTeamChat(r.agent, r.chat); };
      card.querySelector('.ap-actions').appendChild(open);
      g.appendChild(card);
    });
    crewAsks.appendChild(g);
  }
  function renderCrewList() {
    renderCrewAsks();
    const by = new Map();
    crew.workers.forEach(w => { if (!by.has(w.project)) by.set(w.project, []); by.get(w.project).push(w); });
    if (!by.size) { crewRows.innerHTML = '<p class="empty">The factory is quiet and the team is charging. When you hand Larry a job or chat with an agent, their bot leaves Team HQ and runs between the desks and machines as it works.</p>'; return; }
    crewRows.innerHTML = [...by].map(([p, ws]) => `<div class="grp" style="--accent:${PROJECT_COLOUR[p] || tc('#bad367')}"><h4>${escapeHtml(p)}</h4>` +
      ws.map(w => `<div class="row${w.done ? ' done' : ''}" data-agent="${escapeHtml(w.agent)}" title="Chat with ${escapeHtml(w.agent)}" style="--accent:${colourOf(w.agent)}"><span class="src">${w.source === 'job' ? 'Job' : 'Team chat'}</span>` +
        `<b>${escapeHtml(w.agent)}</b>${w.done ? ' · done' : ''}<div class="task">${escapeHtml(w.task || '')}</div>` +
        `<div class="act">${escapeHtml(w.activity || '')}</div></div>`).join('') + '</div>').join('');
  }

  // Each poll: which bots are working, on what, and where that happens. A working bot keeps one desk
  // as its home base and runs from it to the machine its current step needs; when done it goes to charge.
  function assignBots() {
    if (!F) return;
    const names = [...new Set([...(crew.team || []), ...crew.workers.map(w => w.agent)])];
    names.forEach((name, i) => {
      const mine = crew.workers.filter(w => w.agent === name);
      const w = mine.find(x => !x.done) || mine[0] || null;
      let b = F.bots.get(name);
      if (!b) {
        b = makeBot(name); F.bots.set(name, b); b.home = i % F.pads.length;
        b.pos.copy(F.pads[b.home].pos); b.target.copy(b.pos); b.kind = 'hq'; b.want = 'hq'; b.lock = 0; b.lastAct = null;
      }
      b.work = w;
      const act = w ? `${w.done}|${w.activity}` : null;
      if (act !== b.lastAct) {                                           // a new step: work out where it happens
        b.lastAct = act;
        let kind = equipmentFor(w);
        if (kind === 'press' && Math.random() < 0.5) kind = 'desk';
        if (name === 'Larry' && kind === 'desk') kind = 'control';
        b.want = kind;
      }
      const asking = [...pendingByChat.values()].find(r => r.asker === name || (!w && r.agent === name));
      const label = asking ? (asking.kind === 'question' ? '❓ has a question for you' : '⚠ waiting for your approval')
        : w ? (w.done ? '✓ done' : `${w.project && w.project !== 'General' ? w.project + ' · ' : ''}${w.activity || w.task || 'working'}`) : '';
      const short = label.length > 46 ? label.slice(0, 45) + '…' : label;
      if (short !== b.bubbleText) {
        if (b.bubble) { b.group.remove(b.bubble); b.bubble.material.map.dispose(); b.bubble.material.dispose(); b.bubble = null; }
        if (short) {
          const edge = w && PROJECT_COLOUR[w.project] ? PROJECT_COLOUR[w.project] : colourOf(name);
          b.bubble = labelSprite(short, '#' + new THREE.Color(edge).getHexString(),
            { size: 26, tail: true, bg: 'rgba(29,33,70,0.95)', ink: '#e8ecf5', scale: 0.0085 });
          b.bubble.position.y = 2.6; b.group.add(b.bubble);
        }
        b.bubbleText = short;
      }
    });
  }

  function release(b) { if (b.spot) { b.spot.taken = null; b.spot = null; } }
  function claim(b, kind) {
    if (kind === 'hq') { release(b); if (b.desk) { b.desk.taken = null; b.desk = null; } return { pos: F.pads[b.home].pos, face: F.yaw }; }
    if (kind === 'desk') {
      if (!b.desk) { const d = F.stations.find(s => s.kind === 'desk' && !s.spots[0].taken); if (d) { b.desk = d.spots[0]; b.desk.taken = b; b.deskStation = d; } }
      release(b);
      if (b.desk) return { pos: b.desk.pos, face: 0, station: b.deskStation };
    }
    release(b);
    const options = F.stations.filter(s => s.kind === kind);
    for (const s of options) {
      const free = s.spots.find(p => !p.taken);
      if (free) { free.taken = b; b.spot = free; return { pos: free.pos, face: 0, station: s }; }
    }
    const s = options[0] || F.stations[0];                               // all spots busy: wait just behind
    return { pos: s.spots[0].pos.clone().add(new THREE.Vector3(1.3, 0, Math.random() - 0.5)), face: 0, station: s };
  }

  function spark(atv) {
    const i = F.next = (F.next + 1) % F.sparkLife.length;
    F.sparkPos.set([atv.x, atv.y, atv.z], i * 3);
    F.sparkVel.set([(Math.random() - 0.5) * 3, 2 + Math.random() * 2.5, (Math.random() - 0.5) * 3], i * 3);
    F.sparkLife[i] = 0.7 + Math.random() * 0.4;
  }

  function drawCrew(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000), t = now / 1000; lastT = now;
    if (!F) sizeCrew();
    const tmp = new THREE.Vector3();
    F.stations.forEach(s => { s.active = 0; });
    for (const b of F.bots.values()) {
      if (b.want !== b.kind && t >= b.lock) {                            // move on to the next piece of equipment
        const c = claim(b, b.want); b.kind = b.want; b.target.copy(c.pos); b.face = c.face; b.station = c.station || null;
        b.lock = t + 2.2;
      }
      const d = tmp.subVectors(b.target, b.pos); d.y = 0;
      const dist = d.length(), moving = dist > 0.06;
      const working = b.work && !b.work.done && b.kind !== 'hq';
      if (moving) {
        const step = Math.min(dist, (b.kind === 'hq' ? 3.2 : 4.6) * dt);
        b.pos.addScaledVector(d.normalize(), step);
        let turn = Math.atan2(d.x, d.z) - b.group.rotation.y; turn = Math.atan2(Math.sin(turn), Math.cos(turn));
        b.group.rotation.y += turn * Math.min(1, dt * 10);
      } else {
        if (b.station && working) b.station.active++;
        const face = b.kind === 'hq' ? F.yaw : (b.face ?? F.yaw);
        let turn = face - b.group.rotation.y; turn = Math.atan2(Math.sin(turn), Math.cos(turn)); b.group.rotation.y += turn * Math.min(1, dt * 5);
      }
      const k = t * 11 + b.phase;
      b.body.position.y = moving ? Math.abs(Math.sin(k)) * 0.12 : Math.sin(t * 2 + b.phase) * 0.03;
      b.body.rotation.z = moving ? Math.sin(k) * 0.06 : 0;
      b.feet[0].position.z = moving ? Math.sin(k) * 0.16 : 0.03; b.feet[1].position.z = moving ? -Math.sin(k) * 0.16 : 0.03;
      b.arms[0].rotation.x = moving ? Math.sin(k) * 0.9 : working ? -1.1 + Math.sin(t * 16 + b.phase) * 0.35 : 0.1;
      b.arms[1].rotation.x = moving ? -Math.sin(k) * 0.9 : working ? -1.1 + Math.cos(t * 16 + b.phase) * 0.35 : 0.1;
      b.head.rotation.y = working && !moving ? Math.sin(t * 1.5 + b.phase) * 0.3 : 0;
      const blink = Math.sin(t * 1.1 + b.phase * 3) > 0.985 ? 0.15 : 1.3;
      b.eyes.forEach(e => { e.scale.y = blink; });
      const charging = b.kind === 'hq' && !moving;
      b.tipMat.emissiveIntensity = working ? 0.8 + Math.sin(t * 9 + b.phase) * 0.7 : charging ? 0.35 + Math.sin(t * 2 + b.phase) * 0.25 : 0.6;
      b.tipMat.emissive.set(working ? tc('#ffb347') : charging ? tc('#bad367') : '#' + b.tipMat.color.getHexString());
      if (working && !moving && Math.random() < 0.03) spark(b.group.localToWorld(tmp.set(0, 2.05, 0)));
      if (b.bubble) b.bubble.position.y = 2.6 + b.body.position.y;
    }
    // Charging pads pulse under resting bots; equipment comes to life while someone uses it.
    F.pads.forEach((p, i) => { p.mesh.material.emissiveIntensity = 0.18 + Math.max(0, Math.sin(t * 2 + i)) * 0.12; });
    for (const s of F.stations) {
      const on = s.active > 0, P = s.parts;
      (P.screens || []).forEach(sc => { sc.userData.tex.offset.y += on ? dt * 0.35 : 0; sc.material.color.setScalar(on ? 1 : 0.45); });
      if (P.drawers) P.drawers.forEach((d, i) => { const want = on && Math.sin(t * 2.5 + i * 2) > 0.3 ? 0.95 : 0.55; d.position.x += (want - d.position.x) * Math.min(1, dt * 6); });
      if (P.gears) { P.gears[0].rotation.y += (on ? 2.2 : 0.05) * dt; P.gears[1].rotation.y -= (on ? 2.9 : 0.06) * dt;
        P.core.material.emissiveIntensity = on ? 0.6 + Math.sin(t * 6) * 0.3 : 0.15;
        P.puffs.forEach(p => { const u = (t * 0.45 + p.userData.off) % 1; p.position.y = 2.35 + u * 1.6; p.scale.setScalar(on ? 0.6 + u * 0.9 : 0.001); p.material.opacity = 0.85 * (1 - u); }); }
      if (P.reels) { P.reels.forEach((r, i) => { r.rotation.y += (on ? 3 : 0) * dt * (i ? 1 : 1.3); });
        P.mic.material.emissiveIntensity = on ? 0.3 + Math.max(0, Math.sin(t * 7)) * 0.7 : 0.1; }
      if (P.flag) { const want = on ? -Math.PI / 2 : 0; P.flag.rotation.x += (want - P.flag.rotation.x) * Math.min(1, dt * 5);
        P.letters.forEach(l => { const u = (t * 0.6 + l.userData.off) % 1; l.visible = on; l.position.set(0.1 + u * 0.4, 1.6 + u * 1.2, -0.5 + Math.sin(u * 6) * 0.15); l.rotation.x = u * 2; }); }
      if (P.head) { P.head.rotation.y += (on ? 1.6 : 0.15) * dt; P.tip.material.emissiveIntensity = on ? 0.5 + Math.max(0, Math.sin(t * 8)) : 0.3; }
      if (P.roller) { P.roller.rotation.y += 0; P.roller.rotation.z += 0; P.roller.rotateY(on ? dt * 4 : 0);
        const u = (t * 0.5) % 1; P.sheet.position.x = on ? 0.4 + u * 0.8 : 0.6; }
      if (on && Math.random() < 0.08) spark(s.group.localToWorld(tmp.set(0, 2.2, 0)));
    }
    for (let i = 0; i < F.sparkLife.length; i++) {                       // sparks fly, fall and fade
      if (F.sparkLife[i] <= 0) { F.sparkPos[i * 3 + 1] = -50; continue; }
      F.sparkLife[i] -= dt; F.sparkVel[i * 3 + 1] -= 6 * dt;
      for (let a = 0; a < 3; a++) F.sparkPos[i * 3 + a] += F.sparkVel[i * 3 + a] * dt;
    }
    F.sparkGeo.attributes.position.needsUpdate = true;
    const sway = Math.sin(t * 0.12) * 0.1;                               // a slow drift so the scene feels alive
    F.camera.position.set(F.target.x + Math.sin(F.yaw + sway) * Math.cos(F.pitch) * F.dist,
      Math.sin(F.pitch) * F.dist, F.target.z + Math.cos(F.yaw + sway) * Math.cos(F.pitch) * F.dist);
    F.camera.lookAt(F.target);
    F.renderer.render(F.scene, F.camera);
    crewFrame = requestAnimationFrame(drawCrew);
  }

  window.GALAXY = { Graph, nodes, select, clearSelection, focusNodes };  // handy for later features / console
})();
// The job cards stop above the context card, which grows a row per working agent.
(() => {
  const box = document.getElementById('context');
  const fit = () => document.documentElement.style.setProperty('--ctx-h', (box.offsetHeight || 0) + 'px');
  new ResizeObserver(fit).observe(box);
  new MutationObserver(fit).observe(box, { childList: true, subtree: true, characterData: true });
  addEventListener('resize', fit);
  fit();
})();
</script>
