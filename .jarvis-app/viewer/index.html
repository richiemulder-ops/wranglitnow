<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo</title>
<link rel="icon" href="halo.ico">
<script src="user-theme.js"></script>
<style>
  :root {
    --ink: #e8ecf5;
    --dim: #8a93a8;
    --glass: rgba(13, 16, 40, 0.72);
    --edge: rgba(186, 211, 103, 0.2);
    --navy: #161933;                   /* Carbonhalo navy: the page background */
    --brand: #bad367;                  /* Carbonhalo green, from the logo */
    --orange: #ff9f43;
    --left-rail: 300px;                 /* project cards column */
    --right-rail: 0px;                  /* side panel, when open */
    --jarvis-size: 210px;               /* the H.A.L.O. emblem on the right */
    --jarvis-rail: 250px;               /* room kept clear for it */
    --jarvis-top: 50%;                  /* set from the Index height in JS */
  }
  body.panel-open { --right-rail: min(420px, 100vw); }
  html, body { margin: 0; height: 100%; background: var(--navy); color: var(--ink); overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #galaxy { position: fixed; inset: 0; }

  #hud { position: fixed; top: 22px; left: 26px; pointer-events: none; }
  #logo { display: block; height: 40px; width: auto; fill: var(--brand);
    filter: drop-shadow(0 0 14px rgba(186, 211, 103, 0.35)); }
  #hud p { margin: 6px 0 0; font-size: 12px; color: var(--dim); letter-spacing: 0.12em; }

  #legend { position: fixed; right: 26px; top: 22px; font-size: 12px; color: var(--dim);
    display: flex; flex-direction: column; gap: 5px; padding: 12px 14px; border-radius: 12px;
    background: rgba(13, 16, 40, 0.45); border: 1px solid var(--edge); backdrop-filter: blur(8px); }
  #legend .title { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 3px; }

  /* Left rail: one expandable card per section (Projects, Agents, Team Inbox, Deliverables, Outlook). */
  #rail { position: fixed; top: 100px; left: 18px; bottom: 66px; width: calc(var(--left-rail) - 36px);
    display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 0 4px 0 0;
    scrollbar-width: thin; scrollbar-color: rgba(186,211,103,0.25) transparent; }
  .section { position: relative; flex: none; border-radius: 12px; background: rgba(13, 16, 40, 0.62);
    border: 1px solid var(--edge); backdrop-filter: blur(10px); overflow: hidden; }
  .section::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .section > .head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px 12px 18px;
    font: inherit; color: var(--ink); background: none; border: 0; cursor: pointer; text-align: left; }
  .section > .head:hover { background: rgba(42, 48, 88, 0.55); }
  .head .icon { width: 20px; height: 20px; flex: none; color: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }
  .head .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  .head .label { flex: 1; min-width: 0; }
  .head .label b { display: block; font-size: 14px; font-weight: 600; }
  .head .label span { display: block; font-size: 11px; color: var(--dim); margin-top: 1px; letter-spacing: 0.03em; }
  .head .chev { color: var(--dim); transition: transform 0.25s; flex: none; }
  .section.open .chev { transform: rotate(90deg); }
  .section .body { display: none; padding: 0 8px 10px 12px; max-height: 50vh; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: rgba(186,211,103,0.25) transparent; }
  .section.open .body { display: block; animation: rise 0.3s ease-out; }
  /* A button on a card's header row (Team chat on Agents), left of the arrow. */
  .section .head-action { position: absolute; top: 13px; right: 34px; font: inherit; font-size: 11.5px; font-weight: 600;
    color: var(--accent); background: rgba(255,255,255,0.04); border: 1px solid var(--accent); border-radius: 999px;
    padding: 4px 10px; cursor: pointer; }
  .section .head-action:hover { background: rgba(255,255,255,0.1); }
  /* Team Inbox while files are dragged over the page: dashed when ready, filled when over it. */
  .section.drop-ready { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .section.drop-over { background: rgba(127, 195, 90, 0.2); }
  .item { display: block; width: 100%; box-sizing: border-box; text-align: left; font: inherit; color: var(--ink);
    background: rgba(255,255,255,0.03); border: 1px solid transparent; border-radius: 8px; padding: 7px 10px;
    margin-top: 4px; cursor: pointer; transition: background 0.15s; }
  .item:hover { background: rgba(186,211,103,0.12); }
  .item.active { border-color: var(--accent); background: rgba(42,48,88,0.85); box-shadow: 0 0 18px -6px var(--accent); }
  .item.static { cursor: default; }
  .item.static:hover { background: rgba(255,255,255,0.03); }
  .item .name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; line-height: 1.3; }
  .item .name i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; font-style: normal; }
  .item .name em { font-style: normal; flex: none; width: 16px; text-align: center; }
  .item .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { font-size: 11.5px; color: var(--dim); margin-top: 2px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item.unread .name { color: #fff; }
  .body .tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; }
  .link-btn { font: inherit; font-size: 11.5px; color: var(--ink); background: rgba(186,211,103,0.1);
    border: 1px solid var(--edge); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .link-btn:hover { background: rgba(186,211,103,0.22); }
  .body .note { font-size: 12px; color: var(--dim); padding: 6px 4px; line-height: 1.5; }
  .body .note.error { color: #ffcf8a; }
  .body h4 { margin: 10px 2px 2px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--dim); }
  #legend div, #legend button { display: flex; align-items: center; gap: 9px; }
  #legend button { font: inherit; color: inherit; background: none; border: 0; padding: 1px 0; cursor: pointer; text-align: left; }
  #legend button span { color: #fff; } #legend button:hover span { color: #fff; text-decoration: underline; }
  #legend .zoom { gap: 6px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--edge); }
  #legend .zoom button { width: 28px; height: 26px; justify-content: center; padding: 0; border-radius: 8px;
    border: 1px solid var(--edge); background: rgba(255,255,255,0.04); color: var(--ink); font-size: 15px; line-height: 1; }
  #legend .zoom button:hover { background: rgba(186,211,103,0.18); }
  #legend .zoom button.fit { font-size: 12px; }
  #legend .view { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  #legend .view select { background: rgba(0,0,0,0.25); color: #fff; border: 1px solid var(--edge); border-radius: 8px;
    padding: 3px 6px; font: inherit; cursor: pointer; }
  #legend .view select option { background: #10151c; color: #fff; }
  #legend i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; background: currentColor; }

  #panel { position: fixed; top: 0; right: 0; height: 100%; width: min(420px, 100vw); box-sizing: border-box;
    padding: 28px 28px 24px; background: var(--glass); backdrop-filter: blur(14px);
    border-left: 1px solid var(--edge); transform: translateX(105%);
    transition: transform 0.6s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
  #panel.open { transform: none; }
  #panel .group { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
  #panel h2 { margin: 8px 0 4px; font-size: 22px; font-weight: 500; line-height: 1.25; word-break: break-word; }
  #panel .folder { font-size: 12px; color: var(--dim); margin-bottom: 18px; word-break: break-all; }
  #panel .excerpt { font-size: 14px; line-height: 1.6; white-space: pre-wrap; color: #cfd6e6;
    overflow-y: auto; flex: 0 1 auto; padding-right: 6px; }
  #panel h3 { margin: 22px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--dim); }
  /* A project's deliverables: the same rows as the Team Inbox card. */
  #p-deliverables { flex: 0 1 auto; max-height: 46vh; overflow-y: auto; padding-right: 4px; }
  #p-deliverables[hidden], #p-dhead[hidden] { display: none; }
  #p-deliverables .tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
  #p-deliverables .note { font-size: 12px; color: var(--dim); margin: 2px 0 6px; }
  #p-deliverables .note.error { color: #ffcf8a; }
  #p-deliverables .item { margin-bottom: 4px; }
  /* A project's files as a folder tree: folders open in place. */
  .tree .item { margin-bottom: 2px; padding-top: 6px; padding-bottom: 6px; }
  .tree .item .tw { display: inline-block; width: 10px; overflow: visible; flex: none; color: var(--dim); font-style: normal; font-size: 10px; }
  .tree .kids[hidden] { display: none; }
  .tree-root { font-size: 11.5px; color: var(--dim); margin: 0 0 6px; word-break: break-all; }
  /* Pop-ups: small windows for a list you asked Halo for. Several can be open at once. */
  .popwin { position: fixed; z-index: 8; width: min(440px, calc(100vw - 24px)); height: min(520px, calc(100vh - 140px));
    display: flex; flex-direction: column; border-radius: 14px; background: rgba(14, 17, 44, 0.96); backdrop-filter: blur(16px);
    border: 1px solid var(--edge); border-top: 2px solid var(--accent); box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    animation: rise 0.25s ease-out; --accent: #cfe49a;
    resize: both; overflow: hidden; box-sizing: border-box; min-width: 300px; min-height: 200px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
  .popwin.big { width: min(680px, calc(100vw - 24px)); height: min(640px, calc(100vh - 140px)); }
  .popwin .cal-day { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); padding: 12px 4px 4px; }
  .popwin header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 16px; border-bottom: 1px solid var(--edge);
    cursor: grab; user-select: none; }
  .popwin header .titles { flex: 1; min-width: 0; }
  .popwin header .kicker { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
  .popwin header h3 { margin: 2px 0 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .popwin header .x { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 1px solid var(--edge);
    background: transparent; color: var(--dim); cursor: pointer; font: inherit; font-size: 12px; }
  .popwin header .x:hover { color: var(--ink); }
  .popwin .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--edge); }
  .popwin .bar:empty { display: none; }
  .popwin input[type=search] { flex: 1; min-width: 120px; background: rgba(255,255,255,0.05); border: 1px solid var(--edge);
    border-radius: 8px; color: var(--ink); font: inherit; font-size: 12.5px; padding: 6px 9px; outline: none; }
  .popwin .link-btn.on { background: rgba(186,211,103,0.32); border-color: rgba(186,211,103,0.6); }
  .popwin .count { font-size: 11.5px; color: var(--dim); }
  .popwin .content { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 2px 14px 14px; }
  .popwin .row-item { padding: 9px 2px; }
  .popwin .row-item .t { font-size: 13px; }
  .popwin .empty, .popwin .loading { padding: 18px 2px; color: var(--dim); font-size: 12.5px; }
  .popwin .loading.error { color: #ffcf8a; }
  .fleet .about { font-size: 12px; color: var(--dim); line-height: 1.5; margin: 0 0 8px; max-height: 8em; overflow-y: auto; white-space: pre-line; }
  .fleet .tabs { display: flex; gap: 6px; margin: 0 0 8px; }
  #neighbors { overflow-y: auto; overflow-x: hidden; flex: 1 1 0; min-height: 60px; display: flex; flex-wrap: wrap;
    gap: 6px; align-content: flex-start; }
  #neighbors button { font: inherit; font-size: 12px; color: var(--ink); background: rgba(255,255,255,0.05);
    border: 1px solid var(--edge); border-radius: 999px; padding: 4px 10px; cursor: pointer;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #neighbors button:hover { background: rgba(186,211,103,0.18); }
  #close { position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--edge); background: transparent; color: var(--dim); font-size: 16px; cursor: pointer; }
  #close:hover { color: var(--ink); }

  .scene-tooltip { font-family: inherit !important; font-size: 13px !important;
    background: var(--glass) !important; border: 1px solid var(--edge); border-radius: 6px; padding: 4px 9px !important; }

  /* H.A.L.O. emblem (the Carbonhalo mark): right-hand side, under the Index, left of the panel when it's open. */
  #jarvis { position: fixed; top: var(--jarvis-top); right: calc(var(--right-rail) + 22px);
    width: var(--jarvis-size); height: var(--jarvis-size); padding: 0; border: 0; border-radius: 50%;
    background: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: right 0.6s cubic-bezier(.2,.8,.2,1), top 0.4s ease;
    filter: drop-shadow(0 0 calc(6px + var(--energy, 0) * 14px) rgba(186, 211, 103, calc(0.35 + var(--energy, 0) * 0.45))); }
  /* Wake screen: browsers won't let a page speak until it's clicked, so Halo starts centre stage
     and glides to his corner once woken, announcing himself on the way. */
  .ob-tools { display: grid; gap: 6px; margin: 6px 0 10px; }
  .ob-tools label, #onboard .ob-tools label { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
    padding: 8px 10px; margin: 0; opacity: 1; border: 1px solid var(--edge); border-radius: 10px; cursor: pointer; text-align: left; }
  .ob-tools input[type=checkbox] { margin: 0; accent-color: #bad367; }
  .ob-tools label small { display: block; color: var(--dim); font-size: 12px; }
  .ob-dot { width: 10px; height: 10px; border-radius: 50%; background: transparent; border: 1px solid var(--edge); }
  .ob-dot.ok { background: #8fdc6a; box-shadow: 0 0 8px #8fdc6a; } .ob-dot.bad { background: #ff6b7e; box-shadow: 0 0 8px #ff6b7e; }
  .ob-brief, #onboard .ob-brief { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .popwin .ob-card { padding-top: 10px; font-size: 13px; line-height: 1.5; }
  .popwin .ob-card p { margin: 0 0 8px; } .popwin .ob-card .note { color: var(--dim); font-size: 12px; }
  .popwin .ob-card input[type=text] { width: 100%; box-sizing: border-box; font: inherit; color: var(--ink);
    background: rgba(255,255,255,0.04); border: 1px solid var(--edge); border-radius: 8px; padding: 7px 9px; margin-top: 4px; }
  .popwin .ob-card .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  #onboard { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
             background: rgba(10, 12, 30, 0.72); backdrop-filter: blur(3px); }
  #onboard .card { width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto;
             background: var(--navy, #161933); color: #eef0f6; border: 1px solid rgba(255,255,255,.14);
             border-radius: 16px; padding: 24px 24px 18px; font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; }
  #onboard h2 { margin: 0 0 6px; font-size: 20px; color: var(--brand, #bad367); }
  #onboard .step { font-size: 12px; opacity: .6; margin-bottom: 10px; letter-spacing: .04em; text-transform: uppercase; }
  #onboard label { display: block; margin: 12px 0 4px; font-size: 13px; opacity: .85; }
  #onboard input[type=text], #onboard select { width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 9px;
             border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: inherit; font: inherit; }
  #onboard select option { color: #111; }
  #onboard input[type=range] { width: 100%; }
  #onboard ul { padding-left: 18px; margin: 8px 0; } #onboard li { margin: 3px 0; }
  #onboard .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  #onboard button { padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25);
             background: transparent; color: inherit; font: inherit; cursor: pointer; }
  #onboard button.primary { background: var(--brand, #bad367); color: #161933; border-color: transparent; font-weight: 600; }
  #onboard .note { font-size: 13px; opacity: .75; margin-top: 10px; }
  #onboard code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
  #onboard a { color: var(--brand, #bad367); }
  #onboard .logo-prev { margin-top: 12px; min-height: 48px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.04);
             border: 1px dashed rgba(255,255,255,.18); display: flex; align-items: center; }
  #onboard .logo-prev img { max-height: 60px; max-width: 100%; object-fit: contain; }
  #onboard input[type=file] { margin-top: 8px; font: inherit; color: inherit; }
  /* The user's own logo in place of JARVIS, with the credit under the stats line. */
  #logo-img { display: block; height: 40px; width: auto; max-width: 240px; object-fit: contain; object-position: left center; }
  #hud p#powered { margin-top: 2px; }
  body.has-credit #rail { top: 118px; }
  @media (max-width: 600px) { body.has-credit #rail { top: 92px; } }
  #wake { display: none; position: fixed; inset: 0; z-index: 15; cursor: pointer;
    background: radial-gradient(circle at 50% 50%, rgba(22, 25, 51, 0.35), rgba(10, 12, 32, 0.86)); }
  body.waking #wake { display: block; }
  #wake p { position: absolute; left: 0; right: 0; top: calc(50% + var(--jarvis-size) * 0.85 + 34px); margin: 0;
    text-align: center; font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; color: #d6e89a;
    animation: blink 2.4s ease-in-out infinite; }
  body.waking #jarvis { z-index: 16; top: calc(50% - var(--jarvis-size) / 2); right: calc(50% - var(--jarvis-size) / 2);
    transform: scale(1.7); }
  #jarvis { transition: right 0.9s cubic-bezier(.2,.8,.2,1), top 0.9s cubic-bezier(.2,.8,.2,1), transform 0.9s cubic-bezier(.2,.8,.2,1); }
  body.waking #rail, body.waking #ask, body.waking #jobs, body.waking #legend, body.waking #context, body.waking #metrics { opacity: 0; }
  #rail, #ask, #jobs, #legend { transition: opacity 0.8s 0.3s; }
  /* Settings, bottom left: a gear button and the small window it opens. */
  #settings-btn { position: fixed; left: 18px; bottom: 18px; z-index: 6; display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 12px; color: var(--ink); cursor: pointer;
    background: rgba(13, 16, 40, 0.62); border: 1px solid var(--edge); backdrop-filter: blur(8px); transition: opacity 0.8s 0.3s; }
  #settings-btn:hover, #settings-btn[aria-expanded=true] { border-color: #bad367; color: #bad367; }
  #settings { position: fixed; left: 18px; bottom: 62px; z-index: 30; width: min(360px, calc(100vw - 32px));
    max-height: calc(100vh - 100px); overflow: auto; border-radius: 14px; padding: 14px 16px 16px; color: var(--ink);
    font-size: 13px; background: rgba(13, 16, 40, 0.96); border: 1px solid var(--edge); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
  #settings .st-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #settings .st-close { font: 20px/1 inherit; color: var(--dim); background: none; border: 0; cursor: pointer; padding: 0 4px; }
  #settings .st-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--edge); }
  #settings .st-tabs button { font: inherit; font-size: 12px; color: var(--dim); background: none; border: 0;
    border-bottom: 2px solid transparent; padding: 6px 5px; cursor: pointer; }
  #settings .st-list { display: grid; gap: 6px; }
  #settings .st-tool { display: grid; grid-template-columns: auto 1fr; gap: 4px 9px; align-items: start; padding: 8px 10px;
    border: 1px solid var(--edge); border-radius: 10px; }
  #settings .st-tool.off { opacity: 0.55; }
  #settings .st-tool .st-main small { display: block; color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  #settings .st-tool .st-stat { color: #cfd8e8; }
  #settings .st-kind { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #bad367;
    border: 1px solid rgba(186,211,103,0.4); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
  #settings .st-acts { grid-column: 2; display: flex; gap: 12px; font-size: 12px; }
  #settings .st-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; background: #6b7488; }
  #settings .st-dot.ok { background: #8fdc6a; box-shadow: 0 0 8px #8fdc6a; } #settings .st-dot.bad { background: #ff6b7e; box-shadow: 0 0 8px #ff6b7e; }
  #settings .st-job .st-dot.live { animation: jobdot 2.4s ease-in-out infinite; }
  #settings .st-job .st-dot.run { background: #ffc857; box-shadow: 0 0 8px #ffc857; animation: jobdot 0.8s ease-in-out infinite; }
  @keyframes jobdot { 50% { opacity: 0.35; transform: scale(0.75); } }
  @media (prefers-reduced-motion: reduce) { #settings .st-job .st-dot.live, #settings .st-job .st-dot.run { animation: none; } }
  .popwin .jobform { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding-top: 10px; font-size: 13px; }
  .popwin .jobform label { display: grid; gap: 4px; color: var(--dim); font-size: 12px; }
  .popwin .jobform input[type=text], .popwin .jobform input[type=time], .popwin .jobform input[type=number],

  /* Tutorial: the screen dims except what Halo is explaining; a pointer glides over and clicks;
     a card carries the words, with Back / Next. It sits above everything, pop-ups included. */
  #tourShade { position: fixed; inset: 0; z-index: 80; width: 100vw; height: 100vh; pointer-events: all; }

  /* Jobs handed to Larry: a small tray under the emblem. */
  #jobs { position: fixed; right: calc(var(--right-rail) + 22px); top: calc(var(--jarvis-top) + var(--jarvis-size) + 16px);
    width: max(var(--jarvis-size), 330px); display: flex; flex-direction: column; gap: 8px;

  /* Context gauge: how full each agent's context window is (bottom right, like Claude Code's). */

    transition: right 0.6s cubic-bezier(.2,.8,.2,1); }

<script>
// ---- theme: two base colours drive every green and orange on the page -----------------
// The palette below was written around ORIGIN. Each green or orange shade keeps its offset
// (hue turn, saturation ratio, lightness step) from its family's base, so changing a base moves
// the whole family with it. Navy, blues, greys, whites and the red warnings never change.
window.THEME = (() => {
  const ORIGIN = { green: '#bad367', orange: '#ff9f43' };
  const KEY = 'jarvis-theme';
  const isHex = v => /^#[0-9a-f]{6}$/i.test(v || '');
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (_) {}
  if (window.JARVIS_THEME) saved = window.JARVIS_THEME;   // saved on the server: wins over this browser's copy
  const base = { green: isHex(saved.green) ? saved.green.toLowerCase() : ORIGIN.green,
                 orange: isHex(saved.orange) ? saved.orange.toLowerCase() : ORIGIN.orange };

  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  function toHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
    if (!d) return [0, 0, l];
    const s = d / (1 - Math.abs(2 * l - 1));
    const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [(h * 60 + 360) % 360, s, l];
  }
  function toRgb(h, s, l) {
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
                    : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [r, g, b].map(v => Math.round((v + m) * 255));
  }
  const clamp = v => Math.min(1, Math.max(0, v));
  const families = Object.keys(ORIGIN).map(k => ({ from: toHsl(...hexRgb(ORIGIN[k])), to: toHsl(...hexRgb(base[k])) }));
  const changed = base.green !== ORIGIN.green || base.orange !== ORIGIN.orange;

  function mapRgb(r, g, b) {
    if (!changed) return [r, g, b];
    const [h, s, l] = toHsl(r, g, b);
    // Neutrals, the navy family (blues and purples) and the reds used for warnings stay put.
    if (s < 0.2 || l > 0.96 || l < 0.12 || (h >= 170 && h <= 330) || h > 330 || h < 10) return [r, g, b];
    const dist = f => Math.min(Math.abs(h - f.from[0]), 360 - Math.abs(h - f.from[0]));
    const fam = families.reduce((a, f) => dist(f) < dist(a) ? f : a);
    const nh = (fam.to[0] + (h - fam.from[0]) + 360) % 360;
    const ns = clamp(s * (fam.to[1] / Math.max(0.01, fam.from[1])));
    const nl = clamp(l + (fam.to[2] - fam.from[2]));
    return toRgb(nh, ns, nl);
  }
  const hex2 = v => v.toString(16).padStart(2, '0');
  // Any CSS colour written as #rrggbb, #rgb or rgb()/rgba() with plain numbers.
  const COLOUR = /#[0-9a-f]{6}\b|#[0-9a-f]{3}\b|rgba?\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*(?:,\s*[\d.]+\s*)?\)/gi;
  function colour(str) {
    if (str[0] === '#') {
      const full = str.length === 4 ? '#' + [...str.slice(1)].map(c => c + c).join('') : str;
      return '#' + mapRgb(...hexRgb(full)).map(hex2).join('');
    }
    const nums = str.match(/[\d.]+/g);
    const [r, g, b] = mapRgb(+nums[0], +nums[1], +nums[2]);
    return nums.length > 3 ? `rgba(${r},${g},${b},${nums[3]})` : `rgb(${r},${g},${b})`;
  }
  const hex = n => parseInt(colour('#' + n.toString(16).padStart(6, '0')).slice(1), 16);   // three.js 0xRRGGBB
  const rgb01 = a => mapRgb(...a.map(v => Math.round(v * 255))).map(v => v / 255);         // [r, g, b] in 0..1

  if (changed) {
    const style = document.querySelector('style');
    style.textContent = style.textContent.replace(COLOUR, colour);
  }
  function save(green, orange) {
    try { localStorage.setItem(KEY, JSON.stringify({ green, orange })); } catch (_) {}
  }
  return { ORIGIN, base, isHex, colour, hex, rgb01, save };
})();
const tc = THEME.colour;
</script>

<script>
// Galaxy views (CR-007): inline here because the updater only installs index.html.
// CR-007 Galaxy layouts for the Halo viewer (viewer/index.html).
//
// Every layout is a pure function  (nodes, links, ctx) => Map<node.id, {x, y, z}>
// and returns a position for EVERY node in `nodes` (notes and hubs).
//
// ctx contract (all already exist inside index.html's IIFE):
//   ctx.NOTE_COUNT  number   nodes[0 .. NOTE_COUNT-1] are notes, the rest are hubs
//   ctx.HUB_RADIUS  number   radius of the type-hub sphere (500); all layouts scale from it

      if (e >= 1) { n.fx = n.x = m.to.x; n.fy = n.y = m.to.y; n.fz = n.z = m.to.z; return; }

      st.resolve = resolve;

        const t = ms > 0 ? Math.min(1, (now - t0) / ms) : 1, e = ease(t);

        if (name === 'nucleus' && positions && !still) swirl(Graph, st, positions);
        resolve(true);
      };
      st.raf = requestAnimationFrame(step);
    });

  const LAYOUTS = { concentric: layoutConcentric, rings: layoutRings, spiral: layoutSpiral, nucleus: layoutNucleus, logo: layoutLogo };
  const api = { layoutConcentric, layoutRings, layoutSpiral, layoutNucleus, layoutLogo, applyLayout, LAYOUTS };

  else root.JarvisLayouts = api;

</script>
<script>
(() => {
  const PALETTE = [tc('#bad367'), tc('#ff9f43'), tc('#7fc35a'), tc('#f7853b'), tc('#d9ec8f'), tc('#ffc46b'),
                   tc('#4fa36b'), tc('#e8743b'), tc('#a3e37a'), tc('#ffb37a'), tc('#93c47d'), tc('#f2c14e')];
  const nodes = GRAPH.nodes;            // node.id === its index in this array
  const links = GRAPH.links;
  const NOTE_COUNT = nodes.length, NOTE_LINKS = links.length;   // hubs are added after the notes

  // ---- type hubs ------------------------------------------------------------------------
  // One central dot per kind of note (as in the left rail), a dot per project, agent or sub-folder
  // under it, and every note hanging off its hub. The type hubs ring a core dot for the vault.
  // Each type: [name, colour, folder prefixes, folder depth that names a sub-hub (0: none)].
  const TYPES = [
    ['Projects', '#bad367', ['copilot/projects'], 3],
    ['Agents', '#ffb347', ['Team'], 2],
    ['Notes', '#d9ec8f', ['PKM'], 2],
    ['Actions', '#a3e37a', ['Actions'], 0],
    ['Meetings', '#f7853b', ['PKM/CRM/Meetings'], 0],
    ['CRM', '#9fd3ff', ['PKM/CRM'], 3],
    ['Deliverables', '#ffc46b', ['Deliverables'], 0],
    ['Team Inbox', '#7fc35a', ['Team Inbox'], 0],
    ['Knowledge', '#4fa36b', ['Team Knowledge'], 2],
    ['Chats', '#e8743b', ['copilot/copilot-conversations'], 0],
    ['System', '#8a93a8', [''], 0],
  ];
  const typeOf = folder => {   // the type whose folder prefix matches most closely
    let best = null, len = -1;
    TYPES.forEach(t => t[2].forEach(p => {
      if ((p === '' || folder === p || folder.startsWith(p + '/')) && p.length > len) { best = t; len = p.length; }
    }));
    return best;
  };
  const hubLinks = [];   // kind: core (type hub to vault), sub (sub-hub to type hub), spoke (note to hub)
  const addHub = (label, group, hub, path, excerpt) => {
    const n = { id: nodes.length, label, group, folder: '(hub)', path, hub, excerpt };
    nodes.push(n);
    return n;
  };
  const core = addHub('Vault', 'Vault', 'core', '', `The vault: ${NOTE_COUNT.toLocaleString()} notes.`);
  Object.assign(core, { fx: 0, fy: 0, fz: 0 });
  const typeHub = {}, subHub = {};
  nodes.slice(0, NOTE_COUNT).forEach(n => {
    const t = typeOf(n.folder === '(root)' ? '' : n.folder);
    n.group = t[0];
    let hub = typeHub[t[0]];
    if (!hub) {
      hub = typeHub[t[0]] = addHub(t[0], t[0], 'type', t[2][0], '');
      hubLinks.push({ source: hub.id, target: core.id, kind: 'core' });
    }
    const parts = n.folder.split('/');
    if (t[3] && parts.length >= t[3]) {
      const path = parts.slice(0, t[3]).join('/');
      let sub = subHub[path];
      if (!sub) {
        sub = subHub[path] = addHub(parts[t[3] - 1].split(' - ')[0], t[0], 'sub', path, '');
        hubLinks.push({ source: sub.id, target: hub.id, kind: 'sub' });
      }
      hub = sub;
    }
    hubLinks.push({ source: n.id, target: hub.id, kind: 'spoke' });
  });
  // Type hubs sit evenly on a sphere around the core, so each kind of note gets its own region.
  const typeHubs = Object.values(typeHub), HUB_RADIUS = 500;
  typeHubs.forEach((h, i) => {
    const y = 1 - (2 * (i + 0.5)) / typeHubs.length, r = Math.sqrt(1 - y * y), a = i * Math.PI * (3 - Math.sqrt(5));
    Object.assign(h, { fx: Math.cos(a) * r * HUB_RADIUS, fy: y * HUB_RADIUS, fz: Math.sin(a) * r * HUB_RADIUS });
  });
  nodes.slice(NOTE_COUNT).forEach(h => {
    if (h.hub === 'core') return;
    const notes = hubLinks.filter(l => l.kind === 'spoke' && (l.target === h.id ||
      (h.hub === 'type' && nodes[l.target].hub === 'sub' && nodes[l.target].group === h.label))).length;
    const subs = hubLinks.filter(l => l.kind === 'sub' && l.target === h.id).length;
    h.excerpt = `${h.hub === 'type' ? h.label : h.group + ' · ' + h.label}: ${notes.toLocaleString()} notes` +
      (subs ? ` in ${subs} groups` : '') + (h.path ? `\nFolder: ${h.path}` : '') + '\nClick a note below to open it.';
  });

  // ---- groups, colours, neighbours --------------------------------------------------
  const groupCounts = {};
  nodes.slice(0, NOTE_COUNT).forEach(n => { groupCounts[n.group] = (groupCounts[n.group] || 0) + 1; });
  const groups = TYPES.map(t => t[0]).filter(g => groupCounts[g]);
  const groupColor = { Vault: tc('#e6f2b8') };
  TYPES.forEach(t => { groupColor[t[0]] = tc(t[1]); });

  // Full adjacency: drives the panel's "connected notes" and the focus overlay.
  const neighbors = nodes.map(() => new Set());
  links.forEach(l => { neighbors[l.source].add(l.target); neighbors[l.target].add(l.source); });
  hubLinks.forEach(l => { neighbors[l.source].add(l.target); neighbors[l.target].add(l.source); });

  // Backbone: at rest each note keeps only its few strongest links (ties go to the
  // less-connected partner so hubs don't turn into starbursts). Only these are drawn and
  // used for the layout; the full set appears on demand when a note is in focus.
  const BACKBONE_PER_NODE = 2;
  const linksByNode = nodes.map(() => []);
  links.forEach((l, i) => { linksByNode[l.source].push(i); linksByNode[l.target].push(i); });
  const backboneIdx = new Set();
  linksByNode.forEach((ids, n) => {
    const partnerDegree = i => neighbors[links[i].source === n ? links[i].target : links[i].source].size;
    ids.sort((a, b) => (links[b].w || 1) - (links[a].w || 1) || partnerDegree(a) - partnerDegree(b));
    ids.slice(0, BACKBONE_PER_NODE).forEach(i => backboneIdx.add(i));
  });
  const backbone = [...backboneIdx].map(i => ({ source: links[i].source, target: links[i].target }))
    .concat(hubLinks.map(l => ({ ...l })));   // the hub structure is always part of the layout
  const backbonePairs = backbone.map(l => [l.source, l.target]);  // kept as ids: the graph swaps them for objects

  document.getElementById('stats').textContent =
    `${NOTE_COUNT.toLocaleString()} notes · ${NOTE_LINKS.toLocaleString()} connections`;
  // The legend lists the type hubs; click one to fly to it and light up its notes.
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '<div class="title">Index</div>' + groups.map(g =>
    `<button type="button" data-g="${escapeHtml(g)}" style="color:${groupColor[g]}" title="Show ${escapeHtml(g)} in the galaxy">` +
    `<i></i><span>${escapeHtml(g)} · ${groupCounts[g]}</span></button>`).join('');
  legendEl.querySelectorAll('button').forEach(b => { b.onclick = () => select(typeHub[b.dataset.g]); });
  // Zoom buttons: a gentle step in or out towards whatever the view is centred on; ⌂ goes back to the whole galaxy.
  legendEl.insertAdjacentHTML('beforeend', '<div class="zoom"><button type="button" data-z="out" title="Zoom out">−</button>' +
    '<button type="button" data-z="fit" class="fit" title="Whole galaxy">⌂</button><button type="button" data-z="in" title="Zoom in">+</button></div>');
  function zoomBy(factor) {
    const cam = Graph.camera().position, t = Graph.controls().target;
    const d = cam.distanceTo(t), want = Math.max(40, Math.min(6000, d * factor));
    const k = want / (d || 1);
    pauseDrift(6000);
    Graph.cameraPosition({ x: t.x + (cam.x - t.x) * k, y: t.y + (cam.y - t.y) * k, z: t.z + (cam.z - t.z) * k }, { x: t.x, y: t.y, z: t.z }, 450);
  }
  legendEl.querySelector('.zoom').onclick = e => {
    const z = e.target.closest('button') && e.target.closest('button').dataset.z;
    if (z === 'in') zoomBy(0.75);
    else if (z === 'out') zoomBy(1.33);
    else if (z === 'fit') { pauseDrift(6000); Graph.cameraPosition(VIEW_CAM[viewSel.value] || VIEW_CAM.galaxy, { x: 0, y: 0, z: 0 }, 900); }
  };

  // ---- View: the galaxy (force layout) or a fixed shape, animated between (CR-007) ----------
  const VIEWS = [['galaxy', 'Galaxy'], ['concentric', 'Concentric'], ['rings', 'Rings'], ['spiral', 'Spiral'],
                 ['nucleus', 'Nucleus'], ['logo', 'Logo']];
  legendEl.insertAdjacentHTML('beforeend', '<div class="view"><label for="view-sel">View</label><select id="view-sel">' +
    VIEWS.map(([v, t]) => `<option value="${v}">${t}</option>`).join('') + '</select></div>');
  const viewSel = document.getElementById('view-sel');
  // Where ⌂ and a view change put the camera, so each shape is seen whole and from its best side.
  const VIEW_CAM = { galaxy: { x: 0, y: 200, z: 1150 }, concentric: { x: 0, y: 1900, z: 1900 },
    rings: { x: 0, y: 1500, z: 2100 }, spiral: { x: 0, y: 2300, z: 900 }, nucleus: { x: 0, y: 450, z: 2900 },
    logo: { x: 0, y: -150, z: 2900 } };
  function setView(v, ms = 1200) {
    if (!window.JarvisLayouts || (v !== 'galaxy' && !JarvisLayouts.LAYOUTS[v])) v = 'galaxy';
    viewSel.value = v;
    try { localStorage.setItem('jarvis-layout', v); } catch (e) {}
    if (!window.JarvisLayouts) return;
    const pos = v === 'galaxy' ? null : JarvisLayouts.LAYOUTS[v](nodes, hubLinks, { NOTE_COUNT, HUB_RADIUS, typeHub });
    // Nucleus: the note-to-note links would cross the ball and hide the core, so only the hub lines show.
    Graph.linkVisibility(v === 'nucleus' ? l => l.kind === 'sub' || l.kind === 'core' : l => l.kind !== 'spoke');
    pauseDrift(ms + 4000);
    JarvisLayouts.applyLayout(Graph, v, pos, ms);
    Graph.cameraPosition(VIEW_CAM[v], { x: 0, y: 0, z: 0 }, ms);
  }
  viewSel.onchange = () => setView(viewSel.value);
  let savedView = 'galaxy';
  try { savedView = localStorage.getItem('jarvis-layout') || 'galaxy'; } catch (e) {}
  if (savedView !== 'galaxy') setTimeout(() => setView(savedView, 800), 300); else viewSel.value = 'galaxy';

  // ---- node dot texture: a hard-edged disc with a thin, faint halo ------------------------
  const DOT_CORE = 0.4;   // core diameter as a share of the sprite
  const dotTexture = (() => {
    const S = 256, m = S / 2, c = document.createElement('canvas'); c.width = c.height = S;
    const ctx = c.getContext('2d');
    const halo = ctx.createRadialGradient(m, m, S * DOT_CORE / 2, m, m, m * 0.85);
    halo.addColorStop(0, tc('rgba(255,255,255,0.22)'));
    halo.addColorStop(1, tc('rgba(255,255,255,0)'));
    ctx.fillStyle = halo; ctx.fillRect(0, 0, S, S);
    ctx.beginPath(); ctx.arc(m, m, S * DOT_CORE / 2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    const t = new THREE.CanvasTexture(c);

  })();

  const sprites = new Array(nodes.length);
  function makeNodeObject(node) {
    const mat = new THREE.SpriteMaterial({
      map: dotTexture, color: groupColor[node.group], transparent: true, depthWrite: false
    });

    // Log scale keeps hubs readable without letting them swallow their neighbourhood.
    const core = node.hub ? { core: 30, type: 22, sub: 11 }[node.hub] : 5 + Math.log2(1 + neighbors[node.id].size) * 1.6;
    const size = core / DOT_CORE;
    s.scale.set(size, size, 1);
    s.userData.baseSize = s.userData.cur = size;
    sprites[node.id] = s;
    if (node.hub !== 'type') return s;
    // The big buckets carry their name, floating just above the dot.
    const g = new THREE.Group();
    g.add(s);
    const label = hubLabel(node.label, groupColor[node.group], 1);
    label.position.y = core * 0.9 + 12;
    g.add(label);

  }
  function hubLabel(text, colour, k) {
    const c = document.createElement('canvas'), ctx = c.getContext('2d'), px = 44;
    ctx.font = `600 ${px}px system-ui, sans-serif`;
    c.width = Math.ceil(ctx.measureText(text).width) + 24; c.height = px + 20;
    ctx.font = `600 ${px}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#ffffff'; ctx.fillText(text, c.width / 2, c.height / 2);   // labels in white (CR-004)

  // ---- graph ---------------------------------------------------------------------------
  let selected = null;
  let linksLive = false;   // brighter resting web while Halo speaks
  const highlight = new Set();

  const Graph = ForceGraph3D({ controlType: 'orbit' })(document.getElementById('galaxy'))
    .backgroundColor(tc('#161933'))
    .showNavInfo(false)
    .graphData({ nodes, links: backbone })
    .nodeId('id')
    .nodeLabel(n => escapeHtml(n.label))
    .nodeThreeObject(makeNodeObject)
    .linkColor(linkColor)
    .linkVisibility(l => l.kind !== 'spoke')   // note-to-hub spokes shape the layout but aren't drawn
    .linkOpacity(1)
    .linkWidth(0)

    .warmupTicks(60)
    .cooldownTime(20000)

  Graph.renderer().setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  Graph.controls().zoomSpeed = 0.25;   // the wheel zooms in smaller steps (the default jumps too far per notch)
  // Notes gather round their hub; links between notes still pull related clusters together.
  Graph.d3Force('charge').strength(n => n.hub ? -300 : -60);
  Graph.d3Force('link')
    .distance(l => ({ spoke: 75, sub: 170, core: HUB_RADIUS }[l.kind] || 30))
    .strength(l => ({ spoke: 0.6, sub: 0.7, core: 0 }[l.kind] ?? 0.03));

  // Frame the whole galaxy once the first layout settles (unless the user is already exploring).
  // No automatic zoom-to-fit when the layout settles: the camera stays where it starts (or wherever
  // you've moved it), rather than pulling out 5-10 seconds after load.

  // Backbone links: a fine visible web at rest, nearly gone while something is in focus.
  function linkColor(l) {
    if (l && l.kind && highlight.size === 0) return tc(l.kind === 'core' ? 'rgba(230,242,184,0.4)' : 'rgba(230,242,184,0.3)');
    if (highlight.size === 0) return linksLive ? tc('rgba(205,228,140,0.22)') : tc('rgba(170,200,120,0.08)');
    return tc('rgba(170,200,120,0.035)');
  }

  // ---- focus overlay: the full connections of whatever is in focus --------------------
  const overlayGeo = new THREE.BufferGeometry();
  const overlayMat = new THREE.LineBasicMaterial({ color: THEME.hex(0xe2eec0), transparent: true, opacity: 0.5, depthWrite: false });
  const overlay = new THREE.LineSegments(overlayGeo, overlayMat);
  overlay.frustumCulled = false;
  Graph.scene().add(overlay);
  let overlayPairs = [], overlayOpacity = 0;

  function setOverlay(pairs, opacity) {
    overlayPairs = pairs;
    overlayGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(Math.max(1, pairs.length) * 6), 3));
    overlayMat.opacity = overlayOpacity = opacity;
    updateOverlay();
  }

  function updateOverlay() {
    const arr = overlayGeo.attributes.position ? overlayGeo.attributes.position.array : null;
    if (!arr || !overlayPairs.length) { overlayGeo.setDrawRange(0, 0); return; }
    overlayPairs.forEach(([a, b], k) => {
      const A = nodes[a], B = nodes[b];
      arr[k*6] = A.x; arr[k*6+1] = A.y; arr[k*6+2] = A.z;
      arr[k*6+3] = B.x; arr[k*6+4] = B.y; arr[k*6+5] = B.z;
    });
    overlayGeo.attributes.position.needsUpdate = true;
    overlayGeo.setDrawRange(0, overlayPairs.length * 2);
  }

  // ---- data stream: light packets travelling along the connections while Halo speaks ----
  // Runs along whatever is in focus (the overlay), or along the resting web when nothing is.
  const STREAM_MAX = 1800;
  const streamGeo = new THREE.BufferGeometry();
  streamGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(STREAM_MAX * 3), 3));
  const streamMat = new THREE.PointsMaterial({
    map: (() => {
      const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
      const ctx = c.getContext('2d'), g = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
      g.addColorStop(0, tc('rgba(255,255,255,1)')); g.addColorStop(0.25, tc('rgba(230,242,180,0.8)'));
      g.addColorStop(1, tc('rgba(186,211,103,0)'));
      ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
      return new THREE.CanvasTexture(c);
    })(),
    color: THEME.hex(0xe6f2b8), size: 9, sizeAttenuation: true, transparent: true, opacity: 0,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const stream = new THREE.Points(streamGeo, streamMat);
  stream.frustumCulled = false;
  stream.visible = false;
  Graph.scene().add(stream);
  let streamSource = null, lanes = [];   // lane: [a, b, phase, speed]

  function buildLanes() {
    const pairs = overlayPairs.length ? overlayPairs : backbonePairs;
    if (pairs === streamSource) return;
    streamSource = pairs;

    const count = Math.min(STREAM_MAX, pairs.length * 4);

    for (let k = 0; k < count; k++) {
      const [a, b] = count >= pairs.length * 4 ? pairs[k % pairs.length] : pairs[(Math.random() * pairs.length) | 0];
      const out = Math.random() < 0.5;
      lanes.push([out ? a : b, out ? b : a, Math.random(), 0.45 + Math.random() * 0.7]);

    if (!stream.visible) return;

      const A = nodes[a], B = nodes[b], f = (phase + t * speed) % 1;
      arr[k*3] = A.x + (B.x - A.x) * f; arr[k*3+1] = A.y + (B.y - A.y) * f; arr[k*3+2] = A.z + (B.z - A.z) * f;
    });
    streamGeo.attributes.position.needsUpdate = true;
    streamMat.opacity = level;
    if (overlayPairs.length) overlayMat.opacity = Math.min(1, overlayOpacity * (1 + level * (0.8 + 0.6 * Math.sin(t * 7))));
  }

  // ---- sparks: a few pulses always running along the web, so it looks alive at rest -----
  // Each spark crosses one link, brightening mid-way, then usually hops on to a neighbouring
  // link like current finding its way through; otherwise it fades out and starts somewhere new.
  const SPARK_COUNT = 90;
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SPARK_COUNT * 3), 3));
  sparkGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(SPARK_COUNT * 3), 3));
  const sparkMat = new THREE.PointsMaterial({
    map: streamMat.map, size: 16, sizeAttenuation: true, vertexColors: true, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending   // additive: a dim colour is a faint spark
  });
  const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
  sparkPoints.frustumCulled = false;
  Graph.scene().add(sparkPoints);
  const neighbours = nodes.map(() => []);
  backbonePairs.forEach(([a, b]) => { neighbours[a].push(b); neighbours[b].push(a); });
  const SPARK_RGB = [[0.85, 1.0, 0.45], [1.0, 1.0, 0.85], [1.0, 0.7, 0.3]].map(THEME.rgb01);   // bright brand green, near-white lime, orange
  const sparks = [];
  function launchSpark(s, from) {
    let a = from, b;
    if (a == null || !neighbours[a].length) {
      [a, b] = backbonePairs[(Math.random() * backbonePairs.length) | 0] || [0, 0];
      if (Math.random() < 0.5) [a, b] = [b, a];
      s.wait = Math.random() * 2.5;   // fresh sparks start at staggered moments
    } else {
      b = neighbours[a][(Math.random() * neighbours[a].length) | 0];
      s.wait = 0;
    }
    Object.assign(s, { a, b, f: 0, speed: 0.5 + Math.random() * 0.9,
                       rgb: SPARK_RGB[Math.random() < 0.15 ? 2 : Math.random() < 0.5 ? 1 : 0] });
  }
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (let k = 0; k < SPARK_COUNT; k++) { const s = {}; launchSpark(s); s.f = Math.random(); sparks.push(s); }
  sparkPoints.visible = !reduceMotion && backbonePairs.length > 0;
  function updateSparks(dt, quiet) {
    if (!sparkPoints.visible) return;
    const pos = sparkGeo.attributes.position.array, col = sparkGeo.attributes.color.array;
    // Dimmer while a note is in focus or while the speaking stream is running.
    const gain = (highlight.size ? 0.4 : 1) * (1 - 0.6 * quiet);
    sparks.forEach((s, k) => {
      if (s.wait > 0) { s.wait -= dt; col[k*3] = col[k*3+1] = col[k*3+2] = 0; return; }
      s.f += dt * s.speed;
      if (s.f >= 1) launchSpark(s, Math.random() < 0.7 ? s.b : null);
      const A = nodes[s.a], B = nodes[s.b], f = Math.min(1, s.f);
      if (A.x === undefined || B.x === undefined) return;
      pos[k*3] = A.x + (B.x - A.x) * f; pos[k*3+1] = A.y + (B.y - A.y) * f; pos[k*3+2] = A.z + (B.z - A.z) * f;
      const glow = gain * (0.6 + 0.4 * Math.sin(Math.PI * f));
      col[k*3] = s.rgb[0] * glow; col[k*3+1] = s.rgb[1] * glow; col[k*3+2] = s.rgb[2] * glow;
    });
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.color.needsUpdate = true;
  }

  // Lit notes swell in rolling waves while Halo speaks.
  let nodesPulsing = false;
  function pulseNodes(t, level) {
    if (level <= 0.002) {
      if (nodesPulsing) { nodesPulsing = false; refreshNodes(); }
      return;
    }
    nodesPulsing = true;
    sprites.forEach((s, id) => {
      if (!s || (highlight.size && !highlight.has(id))) return;
      const wave = Math.pow(0.5 + 0.5 * Math.sin(t * 5 - id * 0.7), 3);
      const k = s.userData.cur * (1 + level * 0.5 * wave);
      s.scale.set(k, k, 1);
    });
  }

  Graph.scene().fog = null;   // plain black background: only the notes shine

  // ---- selection ---------------------------------------------------------------------
  function select(node) {
    setActiveProject(null);
    selected = node;
    highlight.clear();
    highlight.add(node.id);
    neighbors[node.id].forEach(id => highlight.add(id));
    refreshNodes();
    Graph.linkColor(linkColor);
    const spokes = [...neighbors[node.id]].map(id => [node.id, id]);
    setOverlay(spokes, Math.max(0.18, Math.min(0.7, 5 / Math.sqrt(spokes.length || 1))));  // hubs stay legible

    const dist = 260 + sprites[node.id].userData.baseSize * 4;
    const r = Math.hypot(node.x, node.y, node.z) || 1;
    const k = 1 + dist / r;
    Graph.cameraPosition({ x: node.x * k, y: node.y * k, z: node.z * k }, node, 1800);
    openPanel(node);
    pauseDrift(Infinity);
  }

  function clearSelection() {
    if (selected === null && highlight.size === 0) return;
    selected = null;
    highlight.clear();
    setActiveProject(null);
    refreshNodes();
    Graph.linkColor(linkColor);
    setOverlay([], 0);
    document.getElementById('panel').classList.remove('open');
    document.getElementById('panel').setAttribute('aria-hidden', 'true');
    document.body.classList.remove('panel-open');
    pauseDrift(4000);
  }

  // Light up a set of notes (e.g. the ones an answer used) and frame them.
  function focusNodes(ids) {
    if (!ids.length) return;
    setActiveProject(null);
    selected = null;
    highlight.clear();
    ids.forEach(id => highlight.add(id));
    refreshNodes();
    Graph.linkColor(linkColor);
    const pairs = [];
    ids.forEach((a, i) => ids.slice(i + 1).forEach(b => { if (neighbors[a].has(b)) pairs.push([a, b]); }));
    setOverlay(pairs, Math.max(0.12, Math.min(0.6, 8 / Math.sqrt(pairs.length || 1))));  // big sets stay readable
    document.getElementById('panel').classList.remove('open');
    document.body.classList.remove('panel-open');

    const pts = ids.map(id => nodes[id]);
    const c = pts.reduce((a, n) => ({ x: a.x + n.x / pts.length, y: a.y + n.y / pts.length, z: a.z + n.z / pts.length }),
                         { x: 0, y: 0, z: 0 });
    // Frame most of the set (85th percentile) so one stray outlier doesn't zoom us out to nothing.
    const dists = pts.map(n => Math.hypot(n.x - c.x, n.y - c.y, n.z - c.z)).sort((a, b) => a - b);
    const spread = Math.max(dists[Math.floor((dists.length - 1) * 0.85)], 60);
    const dist = spread * 2.6 + 120;
    const r = Math.hypot(c.x, c.y, c.z) || 1;
    Graph.cameraPosition({ x: c.x + (c.x / r) * dist, y: c.y + (c.y / r) * dist, z: c.z + (c.z / r) * dist }, c, 1800);
    pauseDrift(Infinity);
  }

  function refreshNodes() {
    sprites.forEach((s, id) => {
      if (!s) return;
      let f = 1;
      if (highlight.size === 0) s.material.opacity = 1;
      else if (selected === null && highlight.has(id)) { s.material.opacity = 1; f = 1.5; }
      else if (selected !== null && id === selected.id) { s.material.opacity = 1; f = 1.35; }
      else if (highlight.has(id)) { s.material.opacity = 1; f = 1.05; }
      else s.material.opacity = 0.12;
      const k = s.userData.cur = s.userData.baseSize * f;   // resting size; the speech pulse scales from it
      s.scale.set(k, k, 1);
    });
  }

  // With a project chat (or team chat) on screen, clicking another project (or agent) in the

  // ---- workspace: documents, Actions, Meetings and the CRM in the main window ------------
  // Views stack: opening a document from a list keeps a "← Back" to that list.
  const workEl = document.getElementById('work');

  const nodeByLabel = new Map();
  nodes.forEach(n => { if (!nodeByLabel.has(n.label.toLowerCase())) nodeByLabel.set(n.label.toLowerCase(), n); });
  const nodePath = n => (n.folder === '(root)' ? '' : n.folder + '/') + n.label + '.md';
  const nodeForPath = p => nodeByPath.get(p.replace(/\.md$/i, '').toLowerCase());

  function showWork(view) {               // view: { kicker, title, accent, render(bar, content) }
    if (workEl.current && workEl.current.stop) workEl.current.stop();   // e.g. dictation in Notes
    // The side panel would squeeze the main window: close it (what's lit in the galaxy stays lit).

      `<div class="titles"><div class="kicker">${escapeHtml(view.kicker)}</div><h2>${escapeHtml(view.title)}</h2></div>` +
      `<span class="hdr-tools"></span><button class="x min-btn" type="button" title="Minimise (it keeps running)">–</button>` +
      `<button class="x" type="button" title="Close (Esc)">✕</button></header>` +

  // The window's own size and place, once you've moved or resized it; remembered for next time.
  const WIN_KEY = 'jarvis-work-window';
  function applyWindow() {
    let r = null;
    try { r = JSON.parse(localStorage.getItem(WIN_KEY) || 'null'); } catch (_) {}
    if (!r || window.innerWidth < 1000) { ['left', 'top', 'width', 'height', 'right', 'bottom'].forEach(k => workEl.style[k] = ''); return; }
    const w = Math.min(r.width, window.innerWidth - 20), h = Math.min(r.height, window.innerHeight - 20);
    Object.assign(workEl.style, { left: Math.max(0, Math.min(r.left, window.innerWidth - w)) + 'px',
      top: Math.max(0, Math.min(r.top, window.innerHeight - h)) + 'px', width: w + 'px', height: h + 'px', right: 'auto', bottom: 'auto' });
  }
  function saveWindow() {
    const b = workEl.getBoundingClientRect();
    try { localStorage.setItem(WIN_KEY, JSON.stringify({ left: b.left, top: b.top, width: b.width, height: b.height })); } catch (_) {}
  }
  function wireWindow() {
    applyWindow();
    const header = workEl.querySelector('header'), grip = workEl.querySelector('.grip');
    workEl.querySelector('.min-btn').onclick = e => { e.stopPropagation(); workEl.classList.add('min'); };
    // Drag: the title bar moves the window, the corner grip resizes it.
    const drag = (e, resize) => {
      if (window.innerWidth < 1000) return;
      e.preventDefault();
      const b = workEl.getBoundingClientRect(), x0 = e.clientX, y0 = e.clientY;
      Object.assign(workEl.style, { left: b.left + 'px', top: b.top + 'px', width: b.width + 'px', height: b.height + 'px', right: 'auto', bottom: 'auto' });
      const move = ev => {
        const dx = ev.clientX - x0, dy = ev.clientY - y0;
        if (resize) {
          workEl.style.width = Math.max(360, Math.min(window.innerWidth - b.left - 4, b.width + dx)) + 'px';
          workEl.style.height = Math.max(240, Math.min(window.innerHeight - b.top - 4, b.height + dy)) + 'px';
        } else {
          workEl.style.left = Math.max(0, Math.min(window.innerWidth - 80, b.left + dx)) + 'px';
          workEl.style.top = Math.max(0, Math.min(window.innerHeight - 40, b.top + dy)) + 'px';
        }
      };
      const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); saveWindow(); };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    };
    grip.onpointerdown = e => drag(e, true);
    header.onpointerdown = e => {
      if (e.target.closest('button, select, input, a')) return;
      if (workEl.classList.contains('min')) { workEl.classList.remove('min'); return; }   // click the bar to bring it back
      drag(e, false);
    };
    header.ondblclick = e => {   // back to the normal size and place
      if (e.target.closest('button, select, input, a') || workEl.classList.contains('min')) return;
      try { localStorage.removeItem(WIN_KEY); } catch (_) {}
      applyWindow();
    };
  }

  // Markdown → safe HTML, with [[wikilinks]] turned into links that open the linked note.
  function renderMarkdown(md, opts) {
    const linked = md.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g,
      (_, target, alias) => `[${(alias || target).replace(/[[\]]/g, '')}](#note:${encodeURIComponent(target.trim())})`);
    if (!window.marked || !window.DOMPurify) return `<pre>${escapeHtml(md)}</pre>`;
    const div = document.createElement('div');
    div.innerHTML = DOMPurify.sanitize(marked.parse(linked, opts));
    div.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (href.startsWith('#note:')) a.dataset.note = decodeURIComponent(href.slice(6));
      else if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    });
    return div.innerHTML;
  }
  function wireNoteLinks(el) {
    el.querySelectorAll('a[data-note]').forEach(a => a.onclick = e => {
      e.preventDefault();
      const n = nodeByLabel.get(a.dataset.note.split('/').pop().toLowerCase());

    });
  }

  const FM_SKIP = new Set(['summary', 'action_items', 'title', 'source_quote', 'tags']);
  function openDoc(path, fromList = workEl.classList.contains('open')) {
    const node = nodeForPath(path);
    const isMeeting = path.startsWith('PKM/CRM/Meetings/');
    openView({
      kicker: path.split('/').slice(0, -1).join(' / ') || 'Vault', title: path.split('/').pop().replace(/\.md$/i, ''),

      render: async (bar, content, tools) => {
        linkButton(bar, 'Open on desktop ↗', () => openOnDesktop(path));
        if (node) linkButton(bar, '✦ Show in galaxy', () => { closeWork(); select(node); });
        loadingInto(content, 'Opening…');
        let note;
        try { note = await api(`/api/note?path=${encodeURIComponent(path)}`); } catch (err) { return failInto(content, err); }
        const f = note.fields;
        const heading = f.title || f.action || f.full_name || f.name;
        if (heading) workEl.querySelector('h2').textContent = heading;
        if (isMeeting || note.fireflies) {
          if (note.fireflies) linkButton(bar, 'Fireflies ↗', () => window.open(note.fireflies, '_blank', 'noopener'));
          linkButton(bar, note.transcript_cached ? '🎙 Transcript' : '🎙 Transcript (fetch)', () => openTranscript(path, f.title || note.title));
        }
        const rows = Object.entries(f).filter(([k, v]) => !FM_SKIP.has(k) && v !== '' && !(Array.isArray(v) && !v.length));
        const fm = rows.length ? `<dl class="fm">${rows.map(([k, v]) =>
          `<dt>${escapeHtml(k.replace(/_/g, ' '))}</dt><dd>${escapeHtml(Array.isArray(v) ? v.join(', ') : String(v))}</dd>`).join('')}</dl>` : '';
        const summary = f.summary ? `<div class="fm-summary">${renderMarkdown(String(f.summary))}</div>` : '';
        content.innerHTML = `<div class="doc">${fm}${summary}${renderMarkdown(note.body)}</div>`;
        wireNoteLinks(content);
      }
    }, fromList);
  }

  function openTranscript(path, title) {
    openView({
      kicker: 'Meeting transcript', title, accent: tc('#ff9f43'),
      render: async (bar, content) => {
        loadingInto(content, 'Fetching the transcript from Fireflies… the first time takes a minute or two; after that it opens instantly.');

  // A searchable list view; `row(item)` returns { el } contents, `match(item)` the search text.
  // A searchable list (with optional filter buttons) drawn into any bar and content: the workspace or a pop-up.
  async function listInto(bar, content, { load, filters, row, match, empty }, state) {
    const search = document.createElement('input');
    search.type = 'search'; search.placeholder = 'Search…'; search.value = state.q;
    bar.appendChild(search);
    const btns = (filters || []).map(f => linkButton(bar, f.label, () => { state.filter = f.key; paint(); }));
    const count = document.createElement('span'); count.className = 'count'; bar.appendChild(count);
    loadingInto(content, 'Loading…');
    let items;
    try { items = await load(); } catch (err) { failInto(content, err); return null; }
    function paint() {
      btns.forEach((b, i) => b.classList.toggle('on', filters[i].key === state.filter));
      const q = state.q.toLowerCase();
      const shown = items.filter(it => (!filters || filters.find(f => f.key === state.filter).test(it)) &&
                                       (!q || match(it).toLowerCase().includes(q)));
      count.textContent = `${shown.length} of ${items.length}`;
      content.innerHTML = shown.length ? '' : `<div class="empty">${escapeHtml(empty)}</div>`;
      shown.slice(0, 400).forEach(it => content.appendChild(row(it, paint)));
    }
    search.oninput = () => { state.q = search.value; paint(); };
    paint();
    return paint;
  }
  function listView({ kicker, title, accent, load, filters, row, match, empty }, start = {}) {
    let state = { q: start.q || '', filter: start.filter || (filters ? filters[0].key : null) };
    openView({
      kicker, title, accent,
      render: async (bar, content) => {
        const paint = await listInto(bar, content, { load, filters, row, match, empty }, state);
        if (paint) workEl.current.repaint = paint;
      }
    }, false);
  }

  const crmLink = (label, folder) => {

  };
  function rowEl(cls, html, onOpen) {
    const el = document.createElement('div'); el.className = 'row-item ' + (cls || '');

  // Actions: tick them off right here. The tick rewrites only the note's done: line.

  const ACTION_FILTERS = [{ key: 'open', label: 'Open', test: a => !a.done }, { key: 'done', label: 'Done', test: a => a.done },
                          { key: 'all', label: 'All', test: () => true }];
  const actionMatch = a => `${a.action} ${a.owner} ${a.org} ${a.meeting} ${a.id}`;
  function actionRow(a) {
    const meta = [`#${a.id}`, a.owner && crmLink(a.owner, 'PKM/CRM/People'), a.org && crmLink(a.org, 'PKM/CRM/Organizations'),

                  a.meeting && crmLink(a.meeting, 'PKM/CRM/Meetings')].filter(Boolean).join(' · ');
    const el = rowEl(a.done ? 'done' : '', `<input type="checkbox" class="check" ${a.done ? 'checked' : ''} ` +
      `aria-label="Done"><div class="main"><div class="t">${escapeHtml(a.action)}</div><div class="m">${meta}</div></div>`,
      () => openDoc(a.path, true));
    const box = el.querySelector('.check');
    box.onchange = async () => {

  function showActions(start) {
    listView({
      kicker: 'Actions', title: 'Your action list', accent: tc('#a3e37a'), empty: 'Nothing here. Enviable.',
      filters: ACTION_FILTERS, load: async () => (await api('/api/actions')).actions, match: actionMatch, row: actionRow
    }, start);
  }

  const meetingMatch = m => `${m.title} ${m.org} ${m.date}`;
  const meetingRow = m => rowEl('', `<div class="when">${escapeHtml(prettyDate(m.date))}</div><div class="main">` +
    `<div class="t">${escapeHtml(m.title)}</div><div class="m">${[m.org && crmLink(m.org, 'PKM/CRM/Organizations'),
      m.attendees && `${m.attendees} attendees`, m.fireflies && '🎙 Fireflies'].filter(Boolean).join(' · ')}</div></div>`,
    () => openDoc(m.path, true));
  function showMeetings(start) {
    listView({
      kicker: 'Meetings', title: 'Meeting history', accent: tc('#ff9f43'), empty: 'No meetings match.',
      load: async () => (await api('/api/meetings')).meetings, match: meetingMatch, row: meetingRow

  // Pop-ups: a small window of its own for a list you asked Halo for (a client's actions or
  // meetings, a project's files). Several can be open; drag one by its title bar, ✕ or Esc closes it.
  const popups = [];
  function popup({ kicker, title, accent, render, kind = '', big = false }) {
    const el = document.createElement('div');
    el.className = 'popwin' + (big ? ' big' : ''); el.dataset.kind = kind; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', `${kicker}: ${title}`);
    el.style.setProperty('--accent', accent || tc('#cfe49a'));
    el.innerHTML = `<header><div class="titles"><div class="kicker">${escapeHtml(kicker)}</div><h3>${escapeHtml(title)}</h3></div>` +
      `<span class="hdr-tools"></span><button class="x" type="button" title="Close">✕</button></header>` +
      `<div class="bar"></div><div class="content"></div>`;
    // Each opens in the middle of the screen, the next a little down and to the right so none hides another.
    const step = popups.length % 6, w = Math.min(big ? 680 : 440, innerWidth - 24), h = Math.min(big ? 640 : 520, innerHeight - 140);
    el.style.left = Math.max(12, Math.min(innerWidth - w - 12, innerWidth / 2 - w / 2 + step * 28)) + 'px';
    el.style.top = Math.max(72, Math.min(innerHeight - h - 12, (innerHeight - h) / 2 + step * 28)) + 'px';
    // Drag the bottom-right corner to resize; the size is remembered per kind of window.
    const sizeKey = kind ? `jarvis-pop-size-${kind}` : '';
    try {
      const sz = sizeKey && JSON.parse(localStorage.getItem(sizeKey) || 'null');
      if (sz && sz.w && sz.h) {
        el.style.width = Math.min(sz.w, innerWidth - 16) + 'px'; el.style.height = Math.min(sz.h, innerHeight - 16) + 'px';
        el.style.left = Math.max(8, Math.min(parseFloat(el.style.left), innerWidth - Math.min(sz.w, innerWidth - 16) - 8)) + 'px';
        el.style.top = Math.max(8, Math.min(parseFloat(el.style.top), innerHeight - Math.min(sz.h, innerHeight - 16) - 8)) + 'px';
      }
    } catch (_) {}
    document.body.appendChild(el); popups.push(el);
    let sized = null;
    const opened = [el.offsetWidth, el.offsetHeight];   // only a size you changed is saved
    const saveSize = () => {
      if (!sizeKey || !el.isConnected) return;
      const w = Math.round(el.offsetWidth), h = Math.round(el.offsetHeight);
      if (w === opened[0] && h === opened[1]) return;
      try { localStorage.setItem(sizeKey, JSON.stringify({ w, h })); } catch (_) {}
    };
    if (sizeKey && window.ResizeObserver) { sized = new ResizeObserver(saveSize); sized.observe(el); }
    const close = () => { saveSize(); if (sized) sized.disconnect(); el.remove(); popups.splice(popups.indexOf(el), 1); };
    el.querySelector('.x').onclick = close;
    el.addEventListener('pointerdown', () => { if (el.nextElementSibling) document.body.appendChild(el); }, true);   // to the front
    el.querySelector('header').onpointerdown = e => {
      if (e.target.closest('button, select, input, a')) return;
      e.preventDefault();
      const b = el.getBoundingClientRect(), x0 = e.clientX, y0 = e.clientY;
      const move = ev => {
        el.style.left = Math.max(0, Math.min(innerWidth - 80, b.left + ev.clientX - x0)) + 'px';
        el.style.top = Math.max(0, Math.min(innerHeight - 40, b.top + ev.clientY - y0)) + 'px';
      };
      const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    };
    el.close = close;
    render(el.querySelector('.bar'), el.querySelector('.content'), el.querySelector('.hdr-tools'));
    return el;
  }
  const orgName = slug => slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  // "Bring up the actions for Acme": that client's actions (or meetings) in a pop-up.
  function popClientList({ what, org, label, search, status, due }) {
    const meetings = what === 'meetings';
    const who = org ? orgName(org) : label;
    const dueOk = DUE_TESTS[due] || (() => true);
    popup({
      kicker: meetings ? 'Meetings' : 'Actions', accent: meetings ? tc('#ff9f43') : tc('#a3e37a'), kind: what, big: true,
      title: (who || (meetings ? 'All meetings' : 'All actions')) + (DUE_TESTS[due] ? ` · due ${DUE_SAY[due]}` : ''),
      render: (bar, content, tools) => {
        const opts = meetings
          ? { load: async () => (await api('/api/meetings')).meetings.filter(m => !org || m.org === org),
              match: meetingMatch, row: meetingRow, empty: `No meetings filed${who ? ' for ' + who : ''}.` }
          : { load: async () => (await api('/api/actions')).actions.filter(a => (!org || a.org === org) && dueOk(a.due)),
              filters: ACTION_FILTERS, match: actionMatch, row: actionRow, empty: `Nothing here${who ? ' for ' + who : ''}.` };
        listInto(bar, content, opts, { q: search || '', filter: meetings ? null : status || 'open' });
        linkButton(tools, '⤢', () => (meetings ? showMeetings : showActions)({ q: org || search || '', filter: status }),
                   'Open the full list in the workspace');
      }
    });
  }

  // Due-date filters Halo can put on an action list ("what's overdue", "due this week").
  const isoDay = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const weekOf = (k = 0) => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 7 * k); const e = new Date(d); e.setDate(d.getDate() + 6); return [isoDay(d), isoDay(e)]; };
  const DUE_TESTS = {
    overdue: due => !!due && due.slice(0, 10) < isoDay(new Date()),
    today: due => !!due && due.slice(0, 10) === isoDay(new Date()),
    thisweek: due => { const [a, b] = weekOf(0); return !!due && due.slice(0, 10) >= a && due.slice(0, 10) <= b; },
    nextweek: due => { const [a, b] = weekOf(1); return !!due && due.slice(0, 10) >= a && due.slice(0, 10) <= b; }
  };
  const DUE_SAY = { overdue: 'overdue', today: 'today', thisweek: 'this week', nextweek: 'next week' };
  // The calendar over any span Halo was asked for: today, Friday, next week.
  function popCalendar(span = 'today') {
    popup({
      kicker: 'Calendar', title: span.replace(/^\w/, c => c.toUpperCase()), accent: tc('#f7853b'), kind: 'calendar', big: true,
      render: async (bar, content, tools) => {
        const paint = async () => {
          loadingInto(content, 'Checking Outlook…');
          let c;
          try { c = await api(`/api/calendar?span=${encodeURIComponent(span)}`); } catch (err) { failInto(content, err); return; }
          bar.innerHTML = `<span class="count">${escapeHtml(c.label)} · ${c.events.length} ${c.events.length === 1 ? 'event' : 'events'} · checked ${escapeHtml(c.fetched)}</span>`;
          content.innerHTML = c.events.length ? '' : '<div class="empty">Nothing in the diary. Savour it.</div>';
          let day = null;
          c.events.forEach(e => {
            if (e.day && e.day !== day) { day = e.day; const h = document.createElement('div'); h.className = 'cal-day'; h.textContent = day; content.appendChild(h); }
            content.appendChild(rowEl('', `<div class="when">${escapeHtml(e.start || '')}${e.end ? '<br><small>' + escapeHtml(e.end) + '</small>' : ''}</div>` +
              `<div class="main"><div class="t">${escapeHtml(e.title || '(no title)')}</div><div class="m">${escapeHtml([e.location, e.organiser].filter(Boolean).join(' · '))}</div></div>`, () => {}));
          });
        };
        paint();
      }
    });
  }

  function showCrm(kind = 'organizations', q = '') {
    listView({
      kicker: 'CRM', title: kind === 'people' ? 'Contacts' : 'Organisations', accent: tc('#ffc46b'),
      empty: 'Nobody by that name. Yet.',

      match: r => `${r.name} ${r.sub}`,
      row: r => rowEl('', `<div class="main"><div class="t">${escapeHtml(r.name)}</div>` +
        `<div class="m">${escapeHtml(r.sub || '')}</div></div>`, () => openDoc(r.path, true))
    }, { q });

    linkButton(tools, 'Contacts', () => showCrm('people')).classList.toggle('on', kind === 'people');

  // Rail cards that open the workspace rather than expanding.
  function launcher({ icon, title, sub, color, open }) {
    const sec = document.createElement('section');
    sec.className = 'section';
    sec.style.setProperty('--accent', color);
    sec.innerHTML = `<button class="head" type="button"><span class="icon">${icon}</span>` +
      `<span class="label"><b>${escapeHtml(title)}</b><span>${escapeHtml(sub)}</span></span><span class="chev">›</span></button>`;
