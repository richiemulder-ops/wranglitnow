  // Notes: a new fleeting note you can type or dictate, saved to PKM/Fleeting Notes at the vault
  // root (Larry files them into topic folders). Earlier fleeting notes sit alongside, ready to reopen.
  const FLEETING = 'PKM/Fleeting Notes';
  const DRAFT_KEY = 'galaxy-note-draft';
  let noteRec = null;   // dictation runs on its own recogniser, separate from the ask-bar mic

  // Notes are edited formatted (bold looks bold, lists look like lists) and saved as markdown, the way
  // Obsidian keeps them. marked turns markdown into the editor's HTML; turndown turns it back on save.
  let turndown = null;
  function mdFromHtml(html) {
    if (!window.TurndownService) return null;
    if (!turndown) {
      turndown = new TurndownService({ headingStyle: 'atx', bulletListMarker: '-', emDelimiter: '*',
        strongDelimiter: '**', codeBlockStyle: 'fenced', br: '' });
      if (window.turndownPluginGfm) turndown.use([turndownPluginGfm.tables, turndownPluginGfm.strikethrough, turndownPluginGfm.taskListItems]);
      turndown.addRule('listItem', { filter: 'li', replacement: (content, node, options) => {
        const parent = node.parentNode;
        let prefix = options.bulletListMarker + ' ';
        if (parent.nodeName === 'OL') {
          const start = parent.getAttribute('start'), idx = Array.prototype.indexOf.call(parent.children, node);
          prefix = (start ? Number(start) + idx : idx + 1) + '. ';
        }
        content = content.replace(/^\n+/, '').replace(/\n+$/, '\n').replace(/\n/gm, '\n' + ' '.repeat(prefix.length));
        return prefix + content + (node.nextSibling && !/\n$/.test(content) ? '\n' : '');
      } });
      turndown.addRule('wikilink', { filter: n => n.nodeName === 'A' && n.getAttribute('data-note'),
        replacement: (c, n) => { const t = n.getAttribute('data-note'); c = c.trim(); return c && c !== t ? `[[${t}|${c}]]` : `[[${t}]]`; } });
      turndown.addRule('bareUrl', { filter: n => n.nodeName === 'A' && !n.getAttribute('data-note') && n.getAttribute('href') === n.textContent,
        replacement: c => c });
      turndown.escape = s => s.replace(/^(#{1,6} |[-+*] |\d+\. |> )/gm, '\\$1');
    }
    return turndown.turndown(html).replace(/\[( |x)\]\s+/g, '[$1] ').replace(/[ \t]+$/gm, '').replace(/\n{3,}/g, '\n\n').trim();
  }
  function htmlFromMd(md) {
    const div = document.createElement('div');
    div.innerHTML = md.trim() ? renderMarkdown(md, { breaks: true }) : '';
    // marked puts newlines between tags; in an editor they become stray blank lines.
    const walker = document.createTreeWalker(div, NodeFilter.SHOW_TEXT), blanks = [];
    while (walker.nextNode()) if (!walker.currentNode.textContent.trim() && /^(DIV|UL|OL|LI|BLOCKQUOTE|TABLE|THEAD|TBODY|TR)$/.test(walker.currentNode.parentNode.nodeName)) blanks.push(walker.currentNode);
    blanks.forEach(t => t.remove());
    div.querySelectorAll('li, p, h1, h2, h3, h4, h5, h6').forEach(el => { const t = el.lastChild; if (t && t.nodeType === 3) t.textContent = t.textContent.replace(/\s+$/, ''); });
    // Loose lists wrap each item in <p>: unwrap them so items stay tight and tick boxes stay tasks.
    div.querySelectorAll('li').forEach(li => [...li.children].filter(c => c.nodeName === 'P').forEach((p, i) => {
      if (i) p.before(document.createElement('br'));
      while (p.firstChild) p.before(p.firstChild);
      p.remove();
    }));
    div.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.removeAttribute('disabled'); cb.setAttribute('contenteditable', 'false');
      const t = cb.nextSibling; if (t && t.nodeType === 3) t.textContent = t.textContent.replace(/^\s+/, '');
    });
    return div.innerHTML;
  }
  const NOTE_BLOCKS = /^(P|DIV|LI|H[1-6]|BLOCKQUOTE|PRE)$/;
  // Spoken formatting while dictating: "new paragraph", "new line", "bullet point" / "dot point",
  // "number point", "new heading", "new subheading", "new task", plus "full stop", "comma",
  // "question mark", "colon".
  const SPOKEN = [
    [/\b(?:new|next) paragraph\b/gi, '\u0001P'],
    [/\b(?:new|next) line\b/gi, '\u0001L'],
    [/\b(?:new |next )?sub ?heading\b/gi, '\u0001S'],
    [/\b(?:new|next|add an?) heading\b/gi, '\u0001H'],
    [/\b(?:new |next )?(?:bullet|dot) points?\b|\b(?:new|next) bullet\b/gi, '\u0001B'],
    [/\b(?:new |next )?number(?:ed)? points?\b|\bnext number\b/gi, '\u0001N'],
    [/\b(?:new|next) (?:task|to-?do|to do|action)\b/gi, '\u0001T'],
    [/\s*\bfull stop\b/gi, '.'], [/\s*\bquestion mark\b/gi, '?'], [/\s*\bexclamation (?:mark|point)\b/gi, '!'],
    [/\s*\bcomma\b/gi, ','], [/\s*\bcolon\b/gi, ':'],
  ];

  function showNotes(editPath = null, listen = false, projectName = null) {
    const project = projectName && projects.find(p => p.name === projectName);
    openView({
      kicker: project ? `Notes · ${project.name}` : 'Notes',
      title: editPath ? editPath.split('/').pop().replace(/\.md$/, '') : 'New fleeting note', accent: project ? project.color : tc('#d9ec8f'),
      render: async (bar, content) => {
        let current = editPath, dirty = false, dictating = false, base = '';
        linkButton(bar, '＋ New note', () => { stopDictation(); showNotes(); });
        linkButton(bar, 'Fleeting Notes folder ↗', () => openOnDesktop(FLEETING), 'Open the folder on your desktop');
        content.innerHTML = `<div class="notes-grid"><div class="editor">
            <input class="note-title" type="text" maxlength="80" placeholder="Name your note (or leave it for a dated name)">
            <div class="fmt-bar"></div>
            <div class="doc note-rich blank" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Note"
              data-placeholder="Type, or press Dictate and talk. Say &quot;new paragraph&quot;, &quot;bullet point&quot;, &quot;number point&quot;, &quot;new heading&quot; or &quot;new task&quot; to shape it as you go."></div>
            <div class="heard" hidden></div>
            <div class="tools"></div></div>
          <div class="fleet"><h4>Fleeting notes</h4><input type="search" placeholder="Search notes…"><div class="list"></div></div></div>`;
        // On a project: its description, then its notes, with the fleeting notes a tab away.
        let showing = project ? 'project' : 'fleeting';
        if (project) {
          const fleet = content.querySelector('.fleet'), h4 = fleet.querySelector('h4');
          h4.textContent = project.name;
          const about = document.createElement('div'); about.className = 'about';
          about.textContent = project.description || 'No description in Projects.md yet.';
          const tabs = document.createElement('div'); tabs.className = 'tabs';
          const tabBtns = [['project', `Project notes · ${project.nodes.length}`], ['fleeting', 'Fleeting notes']].map(([k, label]) =>
            linkButton(tabs, label, () => { showing = k; tabBtns.forEach(b => b.classList.toggle('on', b.dataset.k === k)); paintList(); }));
          tabBtns.forEach((b, i) => { b.dataset.k = i ? 'fleeting' : 'project'; b.classList.toggle('on', !i); });
          h4.after(about, tabs);
          linkButton(bar, '✦ Show in galaxy', () => { closeWork(); showProject(project); });
          linkButton(bar, '📁 Files', () => popProjectFiles(project));
        }
        const titleEl = content.querySelector('.note-title'), rich = content.querySelector('.note-rich');
        const tools = content.querySelector('.editor .tools'), listEl = content.querySelector('.fleet .list');
        const searchEl = content.querySelector('.fleet input');
        const heardEl = content.querySelector('.heard'), fmtBar = content.querySelector('.fmt-bar');
        const dictBtn = linkButton(tools, '🎙 Dictate', () => dictating ? stopDictation(true) : startDictation());
        const saveBtn = linkButton(tools, 'Save', save); saveBtn.classList.add('primary');
        const tidyBtn = linkButton(tools, '✨ Tidy up', () => tidy(), 'Let Halo add headings, bullets, numbers and paragraphs. Your words stay the same; Ctrl+Z undoes it.');
        const autoLbl = document.createElement('label'); autoLbl.className = 'auto-tidy';
        autoLbl.title = 'When you stop dictating, Halo tidies the note into headings, bullets and paragraphs';
        autoLbl.innerHTML = '<input type="checkbox"> Tidy after dictating';
        const autoChk = autoLbl.querySelector('input'); tools.appendChild(autoLbl);
        try { autoChk.checked = localStorage.getItem('galaxy-note-autotidy') !== '0'; } catch (_) { autoChk.checked = true; }
        autoChk.onchange = () => { try { localStorage.setItem('galaxy-note-autotidy', autoChk.checked ? '1' : '0'); } catch (_) {} };
        const hint = document.createElement('span'); hint.className = 'hint'; tools.appendChild(hint);
        const say = (text, cls = '') => { hint.textContent = text; hint.className = 'hint ' + cls; };
        try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (_) {}

        // ---- the formatted editor: what you see is what is saved (as markdown) ----
        const sel = () => window.getSelection();
        const inRich = n => !!n && rich.contains(n.nodeType === 1 ? n : n.parentNode);
        function blockOf(n) {
          for (let el = n && (n.nodeType === 1 ? n : n.parentNode); el && el !== rich; el = el.parentNode)
            if (NOTE_BLOCKS.test(el.nodeName)) return el;
          return null;
        }
        const curBlock = () => { const s = sel(); return s.rangeCount && inRich(s.focusNode) ? blockOf(s.focusNode) : null; };
        const curLi = () => { const b = curBlock(); return b && b.closest('li'); };
        const hasBox = li => !!(li && li.querySelector(':scope > input[type=checkbox]'));
        const dropBoxes = li => li && li.querySelectorAll(':scope > input[type=checkbox]').forEach(c => c.remove());
        const run = (cmd, val = null) => document.execCommand(cmd, false, val);
        function textBeforeCaret() {
          const s = sel(), b = curBlock();
          if (!b || !s.rangeCount) return '';
          const r = document.createRange(); r.setStart(b, 0); r.setEnd(s.focusNode, s.focusOffset);
          return r.toString();
        }
        function addBox(li) {
          if (!li || hasBox(li)) return;
          const cb = document.createElement('input'); cb.type = 'checkbox'; cb.setAttribute('contenteditable', 'false');
          li.insertBefore(cb, li.firstChild);
          if (!li.textContent.trim() && !li.querySelector('br')) li.appendChild(document.createElement('br'));
          const r = document.createRange(); r.setStartAfter(cb); r.collapse(true); sel().removeAllRanges(); sel().addRange(r);
        }
        function selectedItems() {   // the list items the selection touches (or the caret's)
          const s = sel(); if (!s.rangeCount) return [];
          const r = s.getRangeAt(0);
          const items = [...rich.querySelectorAll('li')].filter(li => r.intersectsNode(li) && !li.querySelector('li'));
          return items.length ? items : [curLi()].filter(Boolean);
        }
        // Lists are built by hand rather than with execCommand, which nests them inside paragraphs.
        function caretAtEnd(el) {
          const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
          sel().removeAllRanges(); sel().addRange(r);
        }
        function exitList() {   // the caret's list item becomes a plain paragraph (splitting the list there)
          const li = curLi(); if (!li) return;
          dropBoxes(li);
          const list = li.parentNode, p = document.createElement('p');
          while (li.firstChild) p.appendChild(li.firstChild);
          if (!p.textContent.trim() && !p.querySelector('br')) p.appendChild(document.createElement('br'));
          const after = [];
          for (let n = li.nextElementSibling; n; n = n.nextElementSibling) after.push(n);
          li.remove();
          list.after(p);
          if (after.length) { const tail = document.createElement(list.nodeName); after.forEach(n => tail.appendChild(n)); p.after(tail); }
          if (!list.children.length) list.remove();
          caretAtEnd(p);
        }
        function makeList(tag, task = false) {   // the caret's paragraph or heading becomes a list item
          const b = curBlock();
          if (!b || b.closest('li') || !sel().isCollapsed) {
            if (!b || !b.closest('li')) run(tag === 'UL' ? 'insertUnorderedList' : 'insertOrderedList');
            if (task) selectedItems().forEach(addBox);
            return;
          }
          const li = document.createElement('li');
          while (b.firstChild) li.appendChild(b.firstChild);
          if (!li.textContent.trim() && !li.querySelector('br')) li.appendChild(document.createElement('br'));
          const prev = b.previousElementSibling;
          if (prev && prev.nodeName === tag && hasBox(prev.lastElementChild) === task) { prev.appendChild(li); b.remove(); }
          else { const list = document.createElement(tag); list.appendChild(li); b.replaceWith(list); }
          caretAtEnd(li);
          if (task) addBox(li);
        }
        function retag(li, tag) {    // switch the caret's list between bullets and numbers
          const list = li.parentNode; if (list.nodeName === tag) return;
          const nl = document.createElement(tag);
          while (list.firstChild) nl.appendChild(list.firstChild);
          list.replaceWith(nl); caretAtEnd(li);
        }
        function newItem(li, task) {    // Enter in a list item: split it at the caret into a new item
          const s = sel(), r = document.createRange();
          r.setStart(s.focusNode, s.focusOffset); r.setEnd(li, li.childNodes.length);
          const n = document.createElement('li');
          n.appendChild(r.extractContents());
          dropBoxes(n);
          if (!li.textContent.trim() && !li.querySelector('br')) li.appendChild(document.createElement('br'));
          if (!n.textContent.trim()) n.innerHTML = '<br>';
          li.after(n);
          const c = document.createRange(); c.setStart(n, 0); c.collapse(true); sel().removeAllRanges(); sel().addRange(c);
          if (task) addBox(n);
        }
        function newBlock() {    // start a fresh paragraph after the current one, out of any list
          const b = curBlock();
          if (!b || !b.textContent.trim()) { if (curLi()) exitList(); else if (b && /^H[1-6]$/.test(b.nodeName)) run('formatBlock', 'p'); return; }
          const li = curLi();
          if (li) { newItem(li, false); exitList(); return; }
          run('insertParagraph');
          const nb = curBlock(); if (nb && /^H[1-6]$/.test(nb.nodeName)) run('formatBlock', 'p');
        }
        const fmt = {
          heading(level = 'h2') {
            const v = (document.queryCommandValue('formatBlock') || '').toLowerCase();
            if (curLi()) exitList();
            run('formatBlock', v === level ? 'p' : level);
          },
          bullets() {
            const li = curLi();
            if (!li) return makeList('UL');
            if (li.parentNode.nodeName === 'OL') return retag(li, 'UL');
            const items = selectedItems();
            if (items.some(hasBox)) { items.forEach(dropBoxes); return; }
            exitList();
          },
          numbers() {
            const li = curLi();
            if (!li) return makeList('OL');
            if (li.parentNode.nodeName === 'UL') { selectedItems().forEach(dropBoxes); return retag(li, 'OL'); }
            exitList();
          },
          task() {
            const li = curLi();
            if (!li) return makeList('UL', true);
            const items = selectedItems();
            if (items.every(hasBox)) { items.forEach(dropBoxes); return; }
            if (li.parentNode.nodeName === 'OL') retag(li, 'UL');
            items.forEach(addBox);
          },
          bold() { run('bold'); }, italic() { run('italic'); },
        };
        const fmtBtns = [
          ['H', 'Heading (Ctrl+Alt+H, or type "## " at the start of a line)', 'heading', () => fmt.heading()],
          ['• List', 'Bullet list (Ctrl+Shift+8, or type "- ")', 'bullets', fmt.bullets],
          ['1. List', 'Numbered list (Ctrl+Shift+7, or type "1. ")', 'numbers', fmt.numbers],
          ['☐ Task', 'Task with a tick box (or type "[] ")', 'task', fmt.task],
          ['B', 'Bold (Ctrl+B)', 'bold', fmt.bold],
          ['I', 'Italic (Ctrl+I)', 'italic', fmt.italic],
        ].map(([label, title, key, fn]) => {
          const b = linkButton(fmtBar, label, () => {
            if (!inRich(sel().focusNode)) { if (lastRange) { rich.focus(); sel().removeAllRanges(); sel().addRange(lastRange); } else placeCaretAtEnd(); }
            fn(); markDirty(); paintFmt();
          }, title);
          b.classList.add('fmt'); b.dataset.k = key;
          b.onmousedown = e => e.preventDefault();      // keep the selection in the note
          return b;
        });
        fmtBtns[4].style.fontWeight = '700'; fmtBtns[5].style.fontStyle = 'italic';
        function paintFmt() {    // light up the buttons for what the caret is in
          if (!inRich(sel().focusNode)) return;
          const li = curLi(), block = (document.queryCommandValue('formatBlock') || '').toLowerCase();
          const on = { heading: /^h[1-6]$/.test(block), bullets: !!li && li.parentNode.nodeName === 'UL' && !hasBox(li),
            numbers: !!li && li.parentNode.nodeName === 'OL', task: hasBox(li),
            bold: document.queryCommandState('bold'), italic: document.queryCommandState('italic') };
          fmtBtns.forEach(b => b.classList.toggle('on', !!on[b.dataset.k]));
        }
        function placeCaretAtEnd() {
          rich.focus();
          let end = rich;      // the end of the last paragraph or list item, not after it
          while (end.lastElementChild && NOTE_BLOCKS.test(end.lastElementChild.nodeName) || end.lastElementChild && /^(UL|OL)$/.test(end.lastElementChild.nodeName)) end = end.lastElementChild;
          const r = document.createRange(); r.selectNodeContents(end); r.collapse(false);
          sel().removeAllRanges(); sel().addRange(r);
        }
        let lastRange = null;
        const onSel = () => {
          if (!rich.isConnected) { document.removeEventListener('selectionchange', onSel); return; }
          const s = sel(); if (s.rangeCount && inRich(s.focusNode)) { lastRange = s.getRangeAt(0).cloneRange(); paintFmt(); }
        };
        document.addEventListener('selectionchange', onSel);
        const getMd = () => {
          rich.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked ? cb.setAttribute('checked', '') : cb.removeAttribute('checked'));
          const md = mdFromHtml(rich.innerHTML);
          return md === null ? rich.innerText.trim() : md;
        };
        const paintBlank = () => rich.classList.toggle('blank', !rich.textContent.trim() && !rich.querySelector('li, input, h1, h2, h3, hr, table'));
        function setMd(md) { rich.innerHTML = htmlFromMd(md || '') || '<p><br></p>'; paintBlank(); }
        if (!window.TurndownService) say('Formatting tools did not load (offline?): notes save as plain text', 'err');

        async function loadInto(path) {
          stopDictation();
          current = path;
          titleEl.value = path.split('/').pop().replace(/\.md$/, '');
          workEl.querySelector('h2').textContent = titleEl.value;
          setMd(''); say('Opening…');
          try { setMd((await api(`/api/note?path=${encodeURIComponent(path)}`)).body); say(path.split('/').slice(0, -1).join(' / ')); }
          catch (err) { say(err.message, 'err'); }
          dirty = false; lastRange = null; paintList();
        }
        if (current) loadInto(current);
        else {
          try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (d) { titleEl.value = d.title || ''; setMd(d.body || ''); if (d.body) say('Unsaved draft restored'); } } catch (_) {}
          if (!rich.innerHTML.trim()) setMd('');
          setTimeout(() => placeCaretAtEnd(), 50);
        }

        let draftTimer = null;
        function markDirty() {
          dirty = true; paintBlank();
          if (current) return;
          clearTimeout(draftTimer);
          draftTimer = setTimeout(() => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ title: titleEl.value, body: getMd() })); } catch (_) {} }, 400);
        }
        titleEl.oninput = markDirty;
        titleEl.onkeydown = e => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
          else if (e.key === 'Enter') { e.preventDefault(); placeCaretAtEnd(); }
        };
        // Markdown shortcuts as you type: "- " bullets, "1. " numbers, "## " heading, "[] " task.
        rich.oninput = e => {
          markDirty();
          if (!curBlock() && inRich(sel().focusNode)) run('formatBlock', 'p');   // loose text gets a paragraph

          const b = curBlock(); if (!b || !/^(P|DIV)$/.test(b.nodeName)) return;
          const m = textBeforeCaret().replace(/ /g, ' ').match(/^(-|\*|1\.|#{1,3}|\[ ?\]) $/);
          if (!m) return;
          const s = sel(), r = document.createRange(); r.setStart(b, 0); r.setEnd(s.focusNode, s.focusOffset);
          s.removeAllRanges(); s.addRange(r); run('delete');
          const k = m[1];
          if (!curBlock()) run('formatBlock', 'p');
          if (k[0] === '#') run('formatBlock', k.length >= 3 ? 'h3' : 'h2');

          paintFmt();
        };
        rich.onkeydown = e => {
          const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
          if (mod && k === 's') { e.preventDefault(); save(); }
          else if (mod && e.altKey && k === 'h') { e.preventDefault(); fmt.heading(); markDirty(); }
          else if (mod && e.shiftKey && e.code === 'Digit8') { e.preventDefault(); fmt.bullets(); markDirty(); }
          else if (mod && e.shiftKey && e.code === 'Digit7') { e.preventDefault(); fmt.numbers(); markDirty(); }
          else if (e.key === 'Enter' && !e.shiftKey && !mod && !e.isComposing) {
            const li = curLi();
            if (!li) return;
            // Enter on an empty item ends the list; tasks carry on with a fresh tick box.
            if (!li.textContent.trim() && !li.querySelector('li')) { e.preventDefault(); exitList(); markDirty(); paintFmt(); }
            else if (hasBox(li)) { e.preventDefault(); newItem(li, true); markDirty(); }
          }
        };
        rich.onclick = e => {
          if (e.target.matches('input[type=checkbox]')) { markDirty(); return; }
          const a = e.target.closest('a'); if (!a) return;
          e.preventDefault();
          if (!(e.ctrlKey || e.metaKey)) { say('Ctrl+click a link to open it'); return; }
          if (a.dataset.note) {
            const n = nodeByLabel.get(a.dataset.note.split('/').pop().toLowerCase());
            if (n) openDoc(nodePath(n), true); else say(`No note called "${a.dataset.note}" in the vault`, 'err');
          } else if (/^https?:/i.test(a.getAttribute('href') || '')) window.open(a.href, '_blank', 'noopener');
        };
        // Paste comes in as text; markdown in it (from Obsidian, say) arrives formatted.
        rich.onpaste = e => {

          else run('insertText', text);
        };

        // AI tidy: Halo adds structure without changing the words. Ctrl+Z puts the old text back.
        let tidying = false;
        async function tidy(auto = false) {
          if (tidying) return;
          const before = getMd();
          if (!before.trim()) { if (!auto) say('Nothing to tidy yet', 'err'); return; }
          tidying = true; tidyBtn.disabled = true; say('Tidying into headings, bullets and paragraphs…');
          try {
            const r = await api('/api/note-tidy', { body: before });
            if (getMd() !== before) { say('You kept typing, so the tidy was skipped. Press Tidy up again.', 'err'); return; }
            rich.focus(); sel().selectAllChildren(rich);
            if (!run('insertHTML', htmlFromMd(r.body))) setMd(r.body);
            markDirty();
            say('Tidied. Check it, then Save (Ctrl+Z undoes it)', 'ok');
          } catch (err) { say(err.message, 'err'); }
          finally { tidying = false; tidyBtn.disabled = false; }
        }

        async function save() {
          const body = getMd();
          if (!body.trim()) { say('Nothing to save yet', 'err'); return; }
          saveBtn.disabled = true; say('Saving…');
          try {
            const r = await api('/api/fleeting', { title: titleEl.value, body, path: current });
            const wasNew = !current, renamed = current && r.path !== current;
            current = r.path; dirty = false;
            titleEl.value = r.path.split('/').pop().replace(/\.md$/, '');
            workEl.querySelector('h2').textContent = titleEl.value;
            if (wasNew) try { clearTimeout(draftTimer); localStorage.removeItem(DRAFT_KEY); } catch (_) {}
            say(renamed ? `Renamed and saved to ${r.path}` : `Saved to ${r.path}`, 'ok');
            refreshList();
          } catch (err) { say(err.message, 'err'); }
          finally { saveBtn.disabled = false; }
        }

        // Dictation: continuous, keeps going through pauses until you press Stop. Only finished phrases
        // go into the note, at the cursor, so typing or formatting while it listens is never overwritten.
        // What it is still hearing shows underneath. Spoken commands format as you go.
        let handled = new Set(), dictWords = 0;
        function startDictation() {
          if (!Recognition) { say('Dictation needs Chrome or Edge', 'err'); return; }
          if (wantOn) micEl.onclick();                     // don't run alongside the ask-bar mic
          stopSpeaking();
          noteRec = noteRec || new Recognition();
          Object.assign(noteRec, { lang: navigator.language || 'en-GB', interimResults: true, continuous: true });
          dictating = true; handled = new Set(); dictWords = 0;
          if (!inRich(sel().focusNode)) placeCaretAtEnd();
          dictBtn.textContent = '■ Stop dictating'; dictBtn.classList.add('dictating');
          say('Listening… say "new paragraph", "bullet point", "number point", "new heading", "new task"');
          noteRec.onstart = () => { handled = new Set(); };
          noteRec.onresult = e => {
            let interim = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
              const r = e.results[i];

              insertSpoken(r[0].transcript);
            }
            heardEl.hidden = !interim.trim(); heardEl.textContent = interim.trim() ? '… ' + interim.trim() : '';
          };
          noteRec.onerror = e => { if (FATAL_REC_ERRORS.has(e.error)) { say(REC_ERRORS[e.error] || e.error, 'err'); stopDictation(); } };
          noteRec.onend = () => {                          // Chrome ends sessions now and then: carry on

          };
          try { noteRec.start(); } catch (_) {}
        }
        function insertSpoken(raw) {
          if (!raw.trim() || !rich.isConnected) return;
          dictWords += raw.trim().split(/\s+/).length;
          if (document.activeElement !== rich) rich.focus();
          if (!inRich(sel().focusNode)) {
            if (lastRange) { sel().removeAllRanges(); sel().addRange(lastRange); } else placeCaretAtEnd();
          }
          let t = ' ' + raw.trim() + ' ';
          for (const [re, rep] of SPOKEN) t = t.replace(re, rep);
          t.split('\u0001').forEach((part, i) => {
            let piece = part;
            if (i > 0) {
              const cmd = part[0], li = curLi(); piece = part.slice(1);
              const inUl = li && li.parentNode.nodeName === 'UL', inOl = li && li.parentNode.nodeName === 'OL';
              if (cmd === 'P') { if (li) { if (li.textContent.trim()) newItem(li, false); exitList(); } else run('insertParagraph'); }
              else if (cmd === 'L') run('insertLineBreak');
              else if (cmd === 'H' || cmd === 'S') { newBlock(); run('formatBlock', cmd === 'H' ? 'h2' : 'h3'); }
              else if (cmd === 'B') { if (inUl && !hasBox(li)) newItem(li, false); else { newBlock(); makeList('UL'); } }
              else if (cmd === 'N') { if (inOl) newItem(li, false); else { newBlock(); makeList('OL'); } }
              else if (cmd === 'T') { if (inUl && hasBox(li)) newItem(li, true); else { newBlock(); makeList('UL', true); } }

            const before = textBeforeCaret().replace(/ /g, ' ');
            const atStart = !before.trim();
            if (atStart || /\s$/.test(before)) piece = piece.trimStart();
            else if (piece.trim() && !/^[ .,?!:;]/.test(piece)) piece = ' ' + piece;
            if (atStart || /[.?!]\s*$/.test(before)) piece = piece.replace(/^(\s*)([a-z])/, (_, s, c) => s + c.toUpperCase());
            piece = piece.replace(/([.?!] )([a-z])/g, (_, p, c) => p + c.toUpperCase()).replace(/\s+$/, '');
            if (piece) run('insertText', piece);
          });
          markDirty(); paintFmt();
          const b = curBlock(); if (b) b.scrollIntoView({ block: 'nearest' });
        }
        function stopDictation(byUser = false) {
          if (!dictating) return;
          dictating = false;
          try { noteRec.stop(); } catch (_) {}
          heardEl.hidden = true;
          dictBtn.textContent = '🎙 Dictate'; dictBtn.classList.remove('dictating'); say(dirty ? 'Not saved yet' : '');
          // Give Chrome a moment to hand over the last phrase, then tidy if asked to.
          if (byUser && autoChk.checked) setTimeout(() => { if (!dictating && dictWords >= 15) tidy(true); }, 700);
        }
        workEl.current.stop = stopDictation;

        let fleeting = [];
        function paintList() {
          const q = searchEl.value.toLowerCase();
          listEl.innerHTML = '';
          if (showing === 'project') {
            const own = project.nodes.map(id => nodes[id]).filter(n => !q || `${n.label} ${n.folder}`.toLowerCase().includes(q));
            if (!own.length) listEl.innerHTML = '<div class="empty">No notes match.</div>';
            own.slice(0, 300).forEach(n => listEl.appendChild(rowEl('', `<div class="main"><div class="t">${escapeHtml(n.label)}</div>` +
              `<div class="m">${escapeHtml(n.folder.replace(/\//g, ' / '))}</div></div>`, () => openDoc(nodePath(n), true))));
            return;
          }
          const shown = fleeting.filter(n => !q || `${n.name} ${n.topic} ${n.preview}`.toLowerCase().includes(q));
          if (!shown.length) listEl.innerHTML = '<div class="empty">No notes match.</div>';
          shown.forEach(n => listEl.appendChild(rowEl(n.path === current ? 'current' : '',
            `<div class="main"><div class="t">${escapeHtml(n.name)}</div><div class="m">${escapeHtml(n.topic || 'Unfiled')} · ` +
            `${escapeHtml(fmtDate(n.modified))} · ${escapeHtml(n.preview.replace(/(^|\s)(#{1,6}|[-*] \[[ xX]\]|[-*]|\d+\.)(?=\s)/g, '$1').replace(/\*\*|__/g, '').replace(/\s+/g, ' ').trim())}</div></div>`,
            () => { if (dirty && !confirm('Leave this note without saving?')) return; loadInto(n.path); })));
        }
        async function refreshList() {
          try { fleeting = (await api('/api/fleeting')).notes; paintList(); }
          catch (err) { listEl.innerHTML = `<div class="loading error">${escapeHtml(err.message)}</div>`; }
        }
        searchEl.oninput = paintList;
        refreshList();
        if (listen && !current) startDictation();
      }
    }, false);
  }
  launcher({ icon: ICON.notes, title: 'Notes', sub: 'New note · Fleeting Notes', color: tc('#d9ec8f'), open: () => showNotes() });

  // Project chat: pick a project and talk to Halo about it alone. Each conversation is saved as
  // a markdown file in copilot/projects/<Project>/jarvis-chats/ and remembered when reopened.
  let lastChatProject = null;
  const chatDrafts = {};   // unsent words per project, kept when you switch projects (CR-016)
  function showProjectChat(projectName = lastChatProject || (projects[0] && projects[0].name), chatPath = null) {
    lastChatProject = projectName;
    const project = projects.find(p => p.name === projectName);
    openView({
      kicker: 'Project chat', title: projectName, accent: project ? project.color : tc('#bad367'),
      render: async (bar, content, tools) => {
        let current = chatPath, busy = false, listening = false, rec = null;   // current: this chat's file
        const pick = document.createElement('select'); pick.className = 'project-pick'; pick.setAttribute('aria-label', 'Project');
        (tourOn ? TOUR_DEMO.projects : projects).forEach(p => { const o = document.createElement('option'); o.value = o.textContent = p.name; pick.appendChild(o); });
        pick.value = projectName;
        pick.onchange = () => showProjectChat(pick.value);
        bar.appendChild(pick);
        linkButton(bar, '＋ New chat', () => showProjectChat(projectName));
        if (project) linkButton(bar, '✦ Light up project', () => { closeWork(); showProject(project); });
        linkButton(bar, 'Chats folder ↗', () => openOnDesktop(`copilot/projects/${projectName}/jarvis-chats`),
                   'Open this project’s saved chats on your desktop');

        content.innerHTML = `<div class="chat-grid"><div class="chat-list"><div class="about"></div><div class="list"></div></div>
          <div class="convo"><div class="msgs"></div><div class="attached" hidden></div><div class="compose">
            <input type="file" multiple hidden>
            <button class="icon-btn clip" type="button" title="Add a file to the Team Inbox (or paste one with Ctrl+V, or drop it here)" aria-label="Attach a file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5l-8.3 8.3a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.8 1.8 0 0 1-2.5-2.5l7.9-7.9"/></svg></button>
            <textarea rows="1" placeholder="Ask about ${escapeHtml(projectName)}…"></textarea>
            <button class="icon-btn mic" type="button" title="Talk (click again to send)">${ICON.mic}</button>
            <button class="icon-btn send" type="button" title="Send (Enter)" aria-label="Send" style="background:var(--brand);color:#10170a;border-color:var(--brand)">${ICON.send}</button>
          </div></div></div>`;
        const listEl = content.querySelector('.chat-list .list'), aboutEl = content.querySelector('.about');
        const msgsEl = content.querySelector('.msgs'), input = content.querySelector('textarea');
        const micBtn = content.querySelector('.mic'), sendBtn = content.querySelector('.send');

        const addMsg = (who, text, extra = {}) => {
          const m = document.createElement('div');
          m.className = `msg ${who}` + (extra.cls ? ' ' + extra.cls : '');
          if (extra.when) { const w = document.createElement('span'); w.className = 'when'; w.textContent = extra.when; m.appendChild(w); }
          m.appendChild(document.createTextNode(text));
          if (extra.sources && extra.sources.length) {
            const s = document.createElement('div'); s.className = 'srcs';
            extra.sources.forEach(src => {
              const n = nodes[src.id] && nodes[src.id].label === src.label ? nodes[src.id] : nodeByLabel.get(src.label.toLowerCase());
              const b = document.createElement('button'); b.type = 'button'; b.textContent = src.label;
              b.title = 'Open this note';
              b.onclick = () => n ? openDoc(nodePath(n), true) : setStatus('error', 'That note has moved since', 3000);
              s.appendChild(b);
            });
            m.appendChild(s);
          }
          msgsEl.appendChild(m); msgsEl.scrollTop = msgsEl.scrollHeight;
          return m;
        };
        // CR-017 in project chat: 📎, Ctrl+V or drop puts the file in Team Inbox; the next question names it.
        const chipsEl = content.querySelector('.convo .attached'), pickEl = content.querySelector('.compose input[type=file]');
        const composeEl = content.querySelector('.compose');
        let attached = [];
        const paintChips = () => {
          chipsEl.hidden = !attached.length;
          chipsEl.innerHTML = attached.map((n, i) =>
            `<span class="chip" title="In Team Inbox: ${escapeHtml(n)}">📎 <span>${escapeHtml(n)}</span>` +
            `<button type="button" data-i="${i}" title="Don't mention it in my next question (the file stays in Team Inbox)">✕</button></span>`).join('');
        };
        chipsEl.onclick = e => { const b = e.target.closest('button[data-i]'); if (b) { attached.splice(+b.dataset.i, 1); paintChips(); } };
        const attach = async files => { const got = await uploadToInbox(files); if (got.length) { attached = attached.concat(got); paintChips(); } input.focus(); };
        content.querySelector('.clip').onclick = () => pickEl.click();
        pickEl.onchange = () => { attach([...pickEl.files]); pickEl.value = ''; };
        input.addEventListener('paste', e => {
          const files = [...((e.clipboardData && e.clipboardData.files) || [])];
          if (!files.length || (e.clipboardData.getData('text/plain') || '').trim()) return;
          e.preventDefault();
          attach(files.map((f, i) => new File([f], pastedName(f, i), { type: f.type })));
        });
        const hasFileDrag = e => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes('Files');
        composeEl.addEventListener('dragover', e => { if (!hasFileDrag(e)) return; e.preventDefault(); e.stopPropagation(); composeEl.classList.add('drop-over'); e.dataTransfer.dropEffect = 'copy'; });
        composeEl.addEventListener('dragleave', () => composeEl.classList.remove('drop-over'));
        composeEl.addEventListener('drop', e => {
          if (!hasFileDrag(e)) return;
          e.preventDefault(); e.stopPropagation(); composeEl.classList.remove('drop-over');
          attach([...e.dataTransfer.files].filter(f => f.size || f.type));
        });
        const greet = () => addMsg('jarvis', `Ask me anything about ${projectName}. I'll stick to its ${project ? project.nodes.length : ''} notes, and this conversation is saved in the project folder.`);

        async function loadList() {
          try {
            const d = await api(`/api/project-chats?project=${encodeURIComponent(projectName)}`);
            aboutEl.textContent = (d.description ? d.description + ' · ' : '') + `${d.notes} notes · ${d.chats.length} saved chat${d.chats.length === 1 ? '' : 's'}`;
            listEl.innerHTML = d.chats.length ? '' : '<div class="empty">No chats yet. Ask your first question.</div>';
            d.chats.forEach(c => listEl.appendChild(rowEl(c.path === current ? 'current' : '',
              `<div class="main"><div class="t">${escapeHtml(c.title)}</div><div class="m">${escapeHtml(c.updated || c.created)} · ${c.turns} ` +
              `question${c.turns === 1 ? '' : 's'}</div></div>`, () => showProjectChat(projectName, c.path))));
          } catch (err) { failInto(listEl, err); }
        }
        async function loadChat() {
          if (!current) { greet(); return; }
          try {
            const d = await api(`/api/project-chat?project=${encodeURIComponent(projectName)}&path=${encodeURIComponent(current)}`);
            d.turns.forEach(t => { addMsg('you', t.q, { when: t.time }); addMsg('jarvis', t.a, { sources: t.sources }); });
            if (!d.turns.length) greet();
          } catch (err) { addMsg('jarvis', err.message, { cls: 'error' }); }
        }

        async function send() {
          const q = input.value.trim();
          if (!q || busy) return;
          busy = true; input.value = ''; delete chatDrafts[projectName];
          const mentioned = attached.slice();
          const sent = mentioned.length ? `${q}

(I've just added to the Team Inbox for ${projectName}: ${mentioned.join(', ')}.)` : q;
          sendBtn.innerHTML = STOP_ICON; sendBtn.title = 'Stop'; sendBtn.classList.add('stopper');
          stopSpeaking();
          addMsg('you', q);
          const wait = addMsg('jarvis', 'Consulting the project notes…', { cls: 'thinking' });
          setStatus('thinking', 'thinking…');
          try {
            const data = await streamChat({ question: sent, project: projectName, chat: current }, {
              onText: t => { wait.textContent = t || 'Consulting the project notes…'; msgsEl.scrollTop = msgsEl.scrollHeight; },
              onSpeak: line => speak(line),
            });
            wait.remove();
            if (mentioned.length) { attached = attached.filter(n => !mentioned.includes(n)); paintChips(); }
            addMsg('jarvis', data.answer, { sources: data.sources });
            const isNew = !current;
            current = data.path;
            if (data.context) { jarvisContext = data.context; renderContext(); }
            if (data.job) trackJob(data.job);
            setStatus('');
            if (data.spokenEarly !== data.speech) speak(data.speech || data.answer);
            actionsOf(data).forEach(handleAction);
            loadList();   // new chat appears, question counts update
          } catch (err) {
            wait.remove(); addMsg('jarvis', err.message, { cls: 'error' }); setStatus('');
          } finally {
            busy = false; input.focus();
            sendBtn.innerHTML = ICON.send; sendBtn.title = 'Send (Enter)'; sendBtn.classList.remove('stopper');
          }
        }
        let micOff = () => {};
        sendBtn.onclick = () => busy ? api('/api/stop-answer', {}).catch(() => {}) : (micOff(), send());
        input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); micOff(); send(); } };
        input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(160, input.scrollHeight) + 'px'; };

        // Talk: tap the mic to talk, tap again to pause (the words stay in the box); only the arrow
        // or Enter sends (CR-005). Held while Halo speaks, so it never types his words (CR-002).
        let base = '', held = false;
        const micHold = {
          hold() { if (!listening) return; held = true; micBtn.classList.add('held'); try { rec.abort(); } catch (_) {} },
          resume() {
            if (!held) return;
            held = false; micBtn.classList.remove('held');
            if (listening) { base = input.value.trim(); try { rec.start(); } catch (_) {} }
          },
        };
        micOff = () => {
          if (!listening && !held) return;
          listening = false; held = false; micHolds.delete(micHold);
          micBtn.classList.remove('on', 'held');
          try { rec.abort(); } catch (_) {}
        };
        micBtn.onclick = () => {
          if (!Recognition) { setStatus('error', 'voice input needs Chrome or Edge', 4000); return; }
          if (listening) {                       // second tap: pause, keep the words, send nothing
            listening = false; micHolds.delete(micHold);
            if (held) { held = false; micBtn.classList.remove('on', 'held'); setStatus(input.value.trim() ? 'paused' : '', PAUSED_TEXT); }
            else try { rec.stop(); } catch (_) {}
            return;
          }
          if (wantOn) micEl.onclick();
          stopSpeaking();
          rec = rec || new Recognition();
          Object.assign(rec, { lang: navigator.language || 'en-GB', interimResults: true, continuous: true });
          base = input.value.trim();
          rec.onresult = e => { if (!listening || held) return; let t = ''; for (const r of e.results) t += r[0].transcript; input.value = (base ? base + ' ' : '') + t.trim(); };
          rec.onerror = e => { if (FATAL_REC_ERRORS.has(e.error)) { listening = false; micHolds.delete(micHold); setStatus('error', REC_ERRORS[e.error] || e.error, 4000); } };
          rec.onend = () => {
            if (listening && held) { base = input.value.trim(); return; }   // Halo is talking: resume() restarts it
            if (listening) { base = input.value.trim(); setTimeout(() => { if (listening && !held) try { rec.start(); } catch (_) {} }, 150); return; }
            micBtn.classList.remove('on', 'held');
            if (statusEl.classList.contains('listening')) setStatus(input.value.trim() ? 'paused' : '', PAUSED_TEXT);
          };
          listening = true; held = false; micHolds.add(micHold);
          micBtn.classList.add('on'); setStatus('listening', 'listening… tap the mic to pause, the arrow to send');
          try { rec.start(); } catch (_) {}
        };
        workEl.current.stop = () => {
          if (listening || held) micOff();
          const left = input.value.trim();
          if (left) chatDrafts[projectName] = left; else delete chatDrafts[projectName];
        };
        if (chatDrafts[projectName]) { input.value = chatDrafts[projectName]; input.oninput(); }

        loadList(); loadChat();
        setTimeout(() => input.focus(), 50);
      }
    }, false);
  }

  // Team chat: talk to one agent directly. Each message runs that agent in the vault and later
  // messages continue the same session; replies arrive in the background, so the view polls.
  const team = (GRAPH.agents || []).slice().sort((a, b) => (a.name === 'Larry' ? -1 : b.name === 'Larry' ? 1 : a.name.localeCompare(b.name)));
  let lastTeamAgent = 'Larry';
  let viewingChat = null;   // the team chat on screen, if any

  // Requests you turned down, so the office CEO bins the paper instead of stamping it.
  const deniedTickets = new Set();
  // One approval request: the exact command, the agent's reason, and your answer.
  function approvalCard(req, onDone) {
    const el = document.createElement('div'); el.className = 'approval';
    if (req.kind === 'question') {
      const n = (req.questions || []).length;
      el.innerHTML = `<div class="ap-head">❓ ${escapeHtml(req.asker)} has ${n === 1 ? 'a question' : n + ' questions'} for you</div>` +
        '<div class="ap-why"></div><div class="ap-actions"><button type="button" class="ap-yes">Answer</button></div>';
      el.querySelector('.ap-why').textContent = (req.questions || []).map(q => q.question).join('  ·  ');
      el.querySelector('.ap-yes').onclick = () => askQuestions(req, onDone);
      return el;
    }
    // What will happen, in plain English (a step list); the agent's reason; the exact command tucked away.
    const bold = t => escapeHtml(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    const steps = req.plain ? `<ul class="ap-steps">${req.plain.map(st => `<li>${bold(st)}</li>`).join('')}</ul>`
                            : '<div class="ap-why">Working out what this does…</div>';
    el.innerHTML = `<div class="ap-head">⚠ ${escapeHtml(req.asker)} would like to:</div>${steps}` +
      (req.why ? `<div class="ap-why">${escapeHtml(req.asker)}'s reason: <span></span></div>` : '') +
      '<details class="ap-cmd"><summary>Show the exact command</summary><pre></pre></details>' +
      '<div class="ap-actions"><button type="button" class="ap-yes">Approve</button><button type="button" class="ap-no">Deny</button></div>';
    el.querySelector('pre').textContent = req.what;
    if (req.why) el.querySelector('.ap-why span').textContent = req.why;
    const answer = async decision => {
      el.querySelectorAll('button').forEach(b => { b.disabled = true; });
      try {
        const chat = await api('/api/approval/decide', { ticket: req.ticket, decision });
        if (decision === 'deny') deniedTickets.add(req.ticket);
        onDone(chat);
      }
      catch (err) { setStatus('error', err.message, 4000); el.querySelectorAll('button').forEach(b => { b.disabled = false; }); }
    };
    el.querySelector('.ap-yes').onclick = () => answer('approve');
    el.querySelector('.ap-no').onclick = () => answer('deny');
    return el;
  }

  // An agent's questions, one at a time: pick an option (or several, where allowed), or type
  // your own; Back steps back; the answers go to the agent together at the end.
  const qModal = document.getElementById('qmodal'), qBox = qModal.querySelector('.qbox');
  let qOpenFor = null;
  function askQuestions(req, onDone = () => {}) {
    const qs = req.questions || [];
    if (!qs.length) return;
    qOpenFor = req.ticket;
    const picks = qs.map(() => new Set()), others = qs.map(() => '');
    let at = 0;
    const close = () => { qModal.hidden = true; qOpenFor = null; };
    const finish = async decision => {
      qBox.querySelectorAll('button').forEach(b => { b.disabled = true; });
      const answers = {};
      qs.forEach((q, i) => {
        const chosen = [...picks[i]];
        if (others[i].trim()) chosen.push(others[i].trim());
        answers[q.question] = chosen.join(', ');
      });
      try { const chat = await api('/api/approval/decide', decision === 'answer' ? { ticket: req.ticket, decision, answers } : { ticket: req.ticket, decision }); close(); onDone(chat); }
      catch (err) { setStatus('error', err.message, 5000); close(); }
    };
    function draw() {
      const q = qs[at], multi = !!q.multiSelect;
      qBox.innerHTML = `<div class="q-top"><span>${escapeHtml(req.asker)} asks</span><span>${at + 1} of ${qs.length}</span></div>` +
        (q.header ? `<div class="q-chip"></div>` : '') + '<h3></h3><div class="q-opts"></div>' +
        `<input class="q-other" type="text" placeholder="Something else? Type it here">` +
        `<div class="q-foot"><button type="button" class="q-skip">Skip</button>` +
        (at ? '<button type="button" class="q-back">Back</button>' : '') +
        `<button type="button" class="q-next">${at === qs.length - 1 ? 'Send answers' : 'Next'}</button></div>`;
      if (q.header) qBox.querySelector('.q-chip').textContent = q.header;
      qBox.querySelector('h3').textContent = q.question + (multi ? ' (choose any)' : '');
      const opts = qBox.querySelector('.q-opts'), other = qBox.querySelector('.q-other'), next = qBox.querySelector('.q-next');
      const ready = () => { next.disabled = !(picks[at].size || other.value.trim()); };
      (q.options || []).forEach(o => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'q-opt' + (picks[at].has(o.label) ? ' on' : '');
        b.innerHTML = '<b></b>' + (o.description ? '<span></span>' : '');
        b.querySelector('b').textContent = o.label;
        if (o.description) b.querySelector('span').textContent = o.description;
        b.onclick = () => {
          if (multi) picks[at].has(o.label) ? picks[at].delete(o.label) : picks[at].add(o.label);
          else { picks[at].clear(); picks[at].add(o.label); others[at] = ''; }
          draw();
        };
        opts.appendChild(b);
      });
      other.value = others[at];
      other.oninput = () => { others[at] = other.value; if (!multi && other.value.trim()) { picks[at].clear(); opts.querySelectorAll('.on').forEach(x => x.classList.remove('on')); } ready(); };
      other.onkeydown = e => { if (e.key === 'Enter' && !next.disabled) next.click(); };
      next.onclick = () => { if (at < qs.length - 1) { at++; draw(); } else finish('answer'); };
      const back = qBox.querySelector('.q-back'); if (back) back.onclick = () => { at--; draw(); };
      qBox.querySelector('.q-skip').onclick = () => finish('deny');
      ready();
    }
    qModal.hidden = false;
    draw();
  }

  // Jobs and team chats run in the background, so a request can arrive at any time. When one
  // does, open that agent's chat with the details (once per request) and say so.
  const announced = new Set();
  let pendingByChat = new Map();
  async function watchApprovals() {
    try {
      const { pending } = await api('/api/approvals');
      const before = [...pendingByChat.keys()].join();
      pendingByChat = new Map(pending.map(r => [r.chat, r]));
      const trayChanged = before !== [...pendingByChat.keys()].join();
      const fresh = pending.find(r => !announced.has(r.ticket));
      pending.forEach(r => announced.add(r.ticket));
      if (fresh) {
        if (viewingChat !== fresh.chat) showTeamChat(fresh.agent, fresh.chat);
        else workEl.classList.remove('min');   // minimised: bring it back up to show the request
        // With Halo open in more than one tab, only the first to see a request says it out loud.
        let first = true;
        try {
          const key = 'jarvis-said-' + fresh.ticket;
          first = !localStorage.getItem(key);
          localStorage.setItem(key, '1');
        } catch (_) {}
        if (fresh.kind === 'question') {
          if (first) speak(`${fresh.asker} has a question for you.`);
          if (!qOpenFor) askQuestions(fresh);
        } else if (first) speak(`${fresh.asker} needs your approval.`);
      }
      if (qOpenFor && !pending.some(r => r.ticket === qOpenFor)) { qModal.hidden = true; qOpenFor = null; }   // answered elsewhere, or the run ended
      // Redraw Larry's tray only when a request comes or goes: redrawing every check replays the
      // cards' fade-in, so they flicker.
      if (trayChanged && typeof renderJobs === 'function') renderJobs();
      if (trayChanged && crewOpen) { assignBots(); renderCrewList(); }
    } catch (_) { /* the server may be restarting */ }
    setTimeout(watchApprovals, 3000);
  }
  setTimeout(watchApprovals, 3000);
  function showTeamChat(agentName = lastTeamAgent, chatId = null, draft = '') {
    const member = team.find(a => a.name.toLowerCase() === String(agentName).toLowerCase()) || team[0];
    if (!member) { setStatus('error', 'No team in this vault yet', 4000); return; }
    lastTeamAgent = member.name;
    const colour = (agents.find(a => a.name === member.name) || {}).color || tc('#ffb347');
    openView({
      kicker: `Team chat · ${member.role}`, title: member.name, accent: colour,
      render: async (bar, content) => {
        let current = chatId, busy = false, poll = null, listening = false, rec = null, seen = 0;
        let jobChat = false;   // a job's chat: you can keep talking to Larry while the job runs
        const pick = document.createElement('select'); pick.className = 'project-pick'; pick.setAttribute('aria-label', 'Team member');
        team.forEach(a => { const o = document.createElement('option'); o.value = a.name; o.textContent = `${a.name} · ${a.role}`; pick.appendChild(o); });
        pick.value = member.name;
        pick.onchange = () => showTeamChat(pick.value);
        bar.appendChild(pick);
        linkButton(bar, '＋ New chat', () => showTeamChat(member.name));

        content.innerHTML = `<div class="chat-grid"><div class="chat-list"><div class="about"></div><div class="list"></div></div>
          <div class="convo"><div class="msgs"></div><div class="compose">
            <textarea rows="1" placeholder="Message ${escapeHtml(member.name)}…"></textarea>
            <button class="icon-btn mic" type="button" title="Talk (click again to send)">${ICON.mic}</button>
            <button class="icon-btn send" type="button" title="Send (Enter)" aria-label="Send" style="background:var(--brand);color:#10170a;border-color:var(--brand)">${ICON.send}</button>
          </div></div></div>`;
        const listEl = content.querySelector('.chat-list .list'), aboutEl = content.querySelector('.about');
        const msgsEl = content.querySelector('.msgs'), input = content.querySelector('textarea');
        const micBtn = content.querySelector('.mic'), sendBtn = content.querySelector('.send');
        if (draft) { input.value = draft; setTimeout(() => { input.focus(); input.setSelectionRange(draft.length, draft.length); }, 50); }
        aboutEl.textContent = (member.description || member.role) + ' Each message runs ' + member.name +
          ' in your vault, so replies can take a minute or more when there is work to do.';

        const addMsg = m => {
          const el = document.createElement('div');
          if (m.who === 'you') { el.className = 'msg you' + (m.approval ? (m.approval === 'approve' ? ' approved' : ' denied') : ''); el.textContent = m.text; }
          else {
            el.className = 'msg agent doc' + (m.error ? ' error' : '');
            el.innerHTML = `<span class="who">${escapeHtml(member.name)}</span>` + renderMarkdown(m.text);
            wireNoteLinks(el);
          }
          if (m.time) { const w = document.createElement('span'); w.className = 'when'; w.textContent = m.time; el.prepend(w); }
          msgsEl.appendChild(el);
        };
        let workingEl = null, approvalsEl = null, approvalsKey = '';
        function paint(chat) {
          jobChat = !!chat.job;
          (chat.messages || []).slice(seen).forEach(addMsg);
          seen = (chat.messages || []).length;
          if (workingEl) { workingEl.remove(); workingEl = null; }
          // Redraw the approval cards only when they change, so an open "exact command" stays open.
          const cardsKey = JSON.stringify((chat.pending || []).map(r => [r.ticket, r.plain]));
          if (approvalsEl && cardsKey === approvalsKey) msgsEl.appendChild(approvalsEl);
          if (approvalsEl && cardsKey !== approvalsKey) { approvalsEl.remove(); approvalsEl = null; }
          approvalsKey = cardsKey;
          viewingChat = current;
          if (!approvalsEl && (chat.pending || []).length) {
            approvalsEl = document.createElement('div');
            approvalsEl.style.cssText = 'display:flex;flex-direction:column;gap:10px';
            chat.pending.forEach(req => approvalsEl.appendChild(approvalCard(req, paint)));
            msgsEl.appendChild(approvalsEl);
          }
          if (chat.status === 'running') {
            workingEl = document.createElement('div'); workingEl.className = 'msg agent working';
            workingEl.textContent = (chat.activity || `${member.name} is working`) + '…';
            msgsEl.appendChild(workingEl);
          }
          msgsEl.scrollTop = msgsEl.scrollHeight;
        }
        function greet() {
          const g = document.createElement('div'); g.className = 'msg agent doc';
          g.innerHTML = `<span class="who">${escapeHtml(member.name)}</span><p>${escapeHtml(member.name)} here. What do you need?</p>`;
          msgsEl.appendChild(g);
        }

        async function loadList() {
          try {
            const d = await api(`/api/agent-chats?agent=${encodeURIComponent(member.name)}`);
            listEl.innerHTML = d.chats.length ? '' : '<div class="empty">No chats yet.</div>';
            d.chats.forEach(c => listEl.appendChild(rowEl(c.id === current ? 'current' : '',
              `<div class="main"><div class="t">${escapeHtml(c.title)}</div><div class="m">${escapeHtml(c.updated)} · ${c.turns} ` +
              `message${c.turns === 1 ? '' : 's'}</div></div>`, () => showTeamChat(member.name, c.id))));
          } catch (err) { failInto(listEl, err); }
        }
        async function refresh() {
          if (!current) return;
          try {
            const chat = await api(`/api/agent-chat?id=${encodeURIComponent(current)}`);
            const wasRunning = busy;
            paint(chat);
            setBusy(chat.status === 'running');
            if (busy) { clearTimeout(poll); poll = setTimeout(refresh, 2000); }
            else if (wasRunning) {
              loadList();
              const last = chat.messages[chat.messages.length - 1];
              if (last && last.who === 'agent' && !chat.job) speak(`${member.name} has replied.`);   // a job's own tray says it
              loadHires();
            }
          } catch (err) { clearTimeout(poll); poll = setTimeout(refresh, 5000); }
        }
        // While the agent works, the send button is Stop: it ends the agent's run at once.
        function setBusy(on) {
          busy = on;
          sendBtn.innerHTML = on ? STOP_ICON : ICON.send;
          sendBtn.title = on ? `Stop ${member.name} now` + (jobChat ? ' (type a message to add it to the job instead)' : '') : 'Send (Enter)';
          sendBtn.classList.toggle('stopper', on);
        }
        async function stopAgent() {
          if (!current) return;
          sendBtn.disabled = true;
          try { paint(await api('/api/agent-chat/stop', { chat: current })); }
          catch (err) { setStatus('error', err.message, 4000); }
          finally { sendBtn.disabled = false; clearTimeout(poll); poll = setTimeout(refresh, 800); }
        }

        async function send() {
          const text = input.value.trim();
          if (!text || (busy && !jobChat)) return;   // mid-job, a message joins the job in hand
          setBusy(true); input.value = ''; input.style.height = 'auto';
          stopSpeaking();
          try {
            const chat = await api('/api/agent-chat', { agent: member.name, message: text, chat: current });
            if (!current) { msgsEl.innerHTML = ''; seen = 0; }
            current = chat.id;
            paint(chat);
            loadList();
            clearTimeout(poll); poll = setTimeout(refresh, 1500);
          } catch (err) {
            setBusy(false); input.value = text;
            setStatus('error', err.message, 5000);
          }
        }
        let micOff = () => {};
        sendBtn.onclick = () => busy && !(jobChat && input.value.trim()) ? stopAgent() : (micOff(), send());
        input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); micOff(); send(); } };
        input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(160, input.scrollHeight) + 'px'; };

        // Talk: tap the mic to talk, tap again to pause (the words stay in the box); only the arrow
        // or Enter sends (CR-005). Held while Halo speaks, so it never types his words (CR-002).
        let base = '', held = false;
        const micHold = {
          hold() { if (!listening) return; held = true; micBtn.classList.add('held'); try { rec.abort(); } catch (_) {} },
          resume() {
            if (!held) return;
            held = false; micBtn.classList.remove('held');
            if (listening) { base = input.value.trim(); try { rec.start(); } catch (_) {} }
          },
        };
        micOff = () => {
          if (!listening && !held) return;
          listening = false; held = false; micHolds.delete(micHold);
          micBtn.classList.remove('on', 'held');
          try { rec.abort(); } catch (_) {}
        };
        micBtn.onclick = () => {
          if (!Recognition) { setStatus('error', 'voice input needs Chrome or Edge', 4000); return; }
          if (listening) {                       // second tap: pause, keep the words, send nothing
            listening = false; micHolds.delete(micHold);
            if (held) { held = false; micBtn.classList.remove('on', 'held'); setStatus(input.value.trim() ? 'paused' : '', PAUSED_TEXT); }
            else try { rec.stop(); } catch (_) {}
            return;
          }
          if (wantOn) micEl.onclick();
          stopSpeaking();
          rec = rec || new Recognition();
          Object.assign(rec, { lang: navigator.language || 'en-GB', interimResults: true, continuous: true });
          base = input.value.trim();
          rec.onresult = e => { if (!listening || held) return; let t = ''; for (const r of e.results) t += r[0].transcript; input.value = (base ? base + ' ' : '') + t.trim(); };
          rec.onerror = e => { if (FATAL_REC_ERRORS.has(e.error)) { listening = false; micHolds.delete(micHold); setStatus('error', REC_ERRORS[e.error] || e.error, 4000); } };
          rec.onend = () => {
            if (listening && held) { base = input.value.trim(); return; }   // Halo is talking: resume() restarts it
            if (listening) { base = input.value.trim(); setTimeout(() => { if (listening && !held) try { rec.start(); } catch (_) {} }, 150); return; }
            micBtn.classList.remove('on', 'held');
            if (statusEl.classList.contains('listening')) setStatus(input.value.trim() ? 'paused' : '', PAUSED_TEXT);
          };
          listening = true; held = false; micHolds.add(micHold);
          micBtn.classList.add('on'); setStatus('listening', 'listening… tap the mic to pause, the arrow to send');
          try { rec.start(); } catch (_) {}
        };
        workEl.current.stop = () => {
          clearTimeout(poll); viewingChat = null;
          if (listening) { micOff(); input.value = ''; }
        };

        loadList();
        if (current) refresh(); else greet();
        setTimeout(() => input.focus(), 50);
      }
    }, false);
  }


  const actionsSub = launcher({ icon: ICON.actions, title: 'Actions', sub: 'Tick off what’s done', color: tc('#a3e37a'), open: () => showActions() });

  // Team Inbox and Deliverables: live folder listings. Notes fly to their dot; documents open in
  // their usual app; folders open in place.
  const FILE_ICONS = { md: '✦', pdf: '📕', docx: '📝', doc: '📝', xlsx: '📊', xls: '📊', csv: '📊', pptx: '📽',
                       png: '🖼', jpg: '🖼', jpeg: '🖼', gif: '🖼', svg: '🖼', html: '🌐' };
  const fmtSize = b => b < 1024 ? `${b} B` : b < 1048576 ? `${Math.round(b / 1024)} KB` : `${(b / 1048576).toFixed(1)} MB`;
  const fmtDate = s => new Date(s * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });

  // One row per entry: folders open in place, notes open as documents, anything else opens in
  // its usual desktop app. `root` is the folder's vault path; `load` opens a subfolder and
  // `refresh` redraws the listing. Right-click a row for Open, Show in folder and Delete.
  function folderEntries(b, data, { key, root, color, load, refresh }) {
    data.entries.forEach(e => {
      const ext = e.name.includes('.') ? e.name.split('.').pop().toLowerCase() : '';
      const note = ext === 'md' && nodeByPath.get(`${root}/${e.path.replace(/\.md$/i, '')}`.toLowerCase());
      const open = () => e.dir ? load(e.path) : ext === 'md' ? openDoc(`${root}/${e.path}`) : openInDesktop(key, e.path);
      const row = itemButton(b, {
        name: e.name, icon: e.dir ? '📁' : FILE_ICONS[ext] || '📄', color,
        sub: e.dir ? `Folder · ${fmtDate(e.modified)}` : `${fmtDate(e.modified)} · ${fmtSize(e.size)}${note ? ' · in the galaxy' : ''}`,
        title: (e.dir ? 'Open this folder' : ext === 'md' ? 'Read this note' : 'Open on your desktop') + ' · right-click for more',
        onClick: open
      });

  function entryMenu(row, e, { key, root, open, refresh }) {
    const ext = e.name.includes('.') ? e.name.split('.').pop().toLowerCase() : '';
    row.oncontextmenu = ev => {
      ev.preventDefault();
      contextMenu(ev.clientX, ev.clientY, [
        { label: e.dir ? 'Open folder' : ext === 'md' ? 'Read note' : 'Open', run: open },
        ...(e.dir || ext === 'md' ? [{ label: 'Open on desktop', run: () => openInDesktop(key, e.path) }] : []),
        { label: 'Show in File Explorer', run: () => api('/api/reveal', { name: key, path: e.path }).catch(err => setStatus('error', err.message, 4000)) },
        null,
        { label: e.dir ? 'Delete folder…' : 'Delete…', danger: true, run: () => trashEntry(key, root, e, refresh) },
      ]);

  // A folder as a tree: each folder opens in place (loaded the first time), files open as in the lists.
  async function folderTree(box, { key, color, refresh }, path = '', depth = 0) {
    const data = await api(`/api/folder?name=${encodeURIComponent(key)}&path=${encodeURIComponent(path)}`);
    const root = data.folder;
    data.entries.forEach(e => {
      const ext = e.name.includes('.') ? e.name.split('.').pop().toLowerCase() : '';
      let kids = null;
      const toggle = async () => {
        if (!kids) {
          kids = document.createElement('div'); kids.className = 'kids';
          row.after(kids);
          kids.innerHTML = `<div class="note" style="padding-left:${22 + depth * 14}px">Loading…</div>`;
          try {
            const inner = document.createElement('div');
            await folderTree(inner, { key, color, refresh }, e.path, depth + 1);
            kids.innerHTML = '';
            if (inner.childElementCount) kids.append(...inner.children);
            else kids.innerHTML = `<div class="note" style="padding-left:${22 + (depth + 1) * 14}px">Empty.</div>`;
          } catch (err) { kids.innerHTML = `<div class="note error">${escapeHtml(err.message)}</div>`; return; }
        } else kids.hidden = !kids.hidden;
        const open = !kids.hidden;
        row.querySelector('.tw').textContent = open ? '▾' : '▸';
        row.querySelector('em').textContent = open ? '📂' : '📁';
      };
      const open = () => e.dir ? toggle() : ext === 'md' ? openDoc(`${root}/${e.path}`) : openInDesktop(key, e.path);
      const row = itemButton(box, {
        name: e.name, icon: e.dir ? '📁' : FILE_ICONS[ext] || '📄', color,
        sub: e.dir ? `Folder · ${fmtDate(e.modified)}` : `${fmtDate(e.modified)} · ${fmtSize(e.size)}`,
        title: (e.dir ? 'Show what is in this folder' : ext === 'md' ? 'Read this note' : 'Open on your desktop') + ' · right-click for more',
        onClick: open
      });
      row.style.paddingLeft = (8 + depth * 14) + 'px';
      const tw = document.createElement('small'); tw.className = 'tw'; tw.textContent = e.dir ? '▸' : '';
      row.querySelector('.name').prepend(tw);
      row.querySelector('.sub') && (row.querySelector('.sub').style.paddingLeft = '18px');
      entryMenu(row, e, { key, root, open: e.dir ? () => openInDesktop(key, e.path) : open, refresh });
    });
    return data;
  }

  // Delete from a card: after a confirm, it moves to the vault's .trash folder (as Obsidian does),
  // so it leaves the vault, the cards and the galaxy but can still be brought back.
  async function trashEntry(key, root, e, refresh) {
    const what = e.dir ? `the folder "${e.name}" and everything in it` : `"${e.name}"`;
    if (!confirm(`Delete ${what}?\n\nIt moves to the vault's .trash folder, so you can still get it back from File Explorer.`)) return;
    try {
      const r = await api('/api/trash', { name: key, path: e.path });
      setStatus('thinking', `deleted ${e.name} (moved to ${r.trashed.split('/').slice(0, -1).join('/') || '.trash'})`, 5000);
      if (refresh) refresh();
    } catch (err) { setStatus('error', err.message, 5000); }
  }

  // A small menu at the pointer; Esc, a click elsewhere or scrolling closes it.
  const ctxEl = document.getElementById('ctxmenu');
  function contextMenu(x, y, items) {
    ctxEl.innerHTML = '';
    items.forEach(it => {
      if (!it) { const d = document.createElement('div'); d.className = 'sep'; ctxEl.appendChild(d); return; }
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'menuitem');
      b.textContent = it.label; if (it.danger) b.className = 'danger';
      b.onclick = () => { closeContextMenu(); it.run(); };
      ctxEl.appendChild(b);
    });
    ctxEl.hidden = false;
    const w = ctxEl.offsetWidth, h = ctxEl.offsetHeight;
    ctxEl.style.left = Math.min(x, innerWidth - w - 8) + 'px';
    ctxEl.style.top = Math.min(y, innerHeight - h - 8) + 'px';
    ctxEl.querySelector('button').focus();
  }
  function closeContextMenu() { ctxEl.hidden = true; }
  window.addEventListener('pointerdown', ev => { if (!ctxEl.hidden && !ctxEl.contains(ev.target)) closeContextMenu(); }, true);
  window.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !ctxEl.hidden) { ev.stopPropagation(); closeContextMenu(); } }, true);
  window.addEventListener('scroll', closeContextMenu, true);
  async function openInDesktop(key, path) {
    try { await api('/api/open', { name: key, path }); }
    catch (err) { setStatus('error', err.message, 4000); }

  const tourRefreshers = [];   // cards that cache a listing: the tour swaps examples in and out
  function folderSection(key, icon, title, color) {
    const root = { inbox: 'Team Inbox', deliverables: 'Deliverables' }[key];
    const inFolder = nodes.filter(n => n.folder === root || n.folder.startsWith(root + '/')).map(n => n.id);
    let loaded = false;
    const body = addSection({ icon, title, sub: root, color, onOpen: b => { if (!loaded) load(b, ''); } });
    // Name the user's own knowledge folder, and show its full path on hover.
    const subEl = body.parentElement.querySelector('.label > span');
    api('/api/setup').then(d => {
      if (!d.vault_name) return;
      subEl.textContent = `${d.vault_name} / ${root}`;
      subEl.parentElement.parentElement.title = d.vault + '\\' + root;
    }).catch(() => {});
    let current = '', justAdded = [];
    tourRefreshers.push(() => { loaded = false; if (body.parentElement.classList.contains('open')) load(body, ''); else body.innerHTML = ''; });

      loaded = true; current = path;

    function render(b, data) {

      const btn = (label, fn, tip) => {

      };
      if (data.path) btn('← Back', () => load(b, data.path.split('/').slice(0, -1).join('/')));
      btn('📂 Open folder', () => showFolder(key, title, data.path, color), 'Show these files in the main window');
      if (!data.path && inFolder.length) btn(`✦ Show ${inFolder.length} in galaxy`, () => focusNodes(inFolder));
      if (key === 'inbox') {
        btn('+ Add files', () => picker.click(), 'Or drag files from your desktop onto this card');
        if (justAdded.length) btn(`File ${justAdded.length === 1 ? 'it' : 'them'}`, () => {
          const names = justAdded; justAdded = []; render(b, data);
          ask(`Get the team to file these new files from the Team Inbox: ${names.join(', ')}`);
        }, 'Hands the new files to the team to file in the vault');
      }
      b.appendChild(tools);
      if (data.path) { const c = document.createElement('div'); c.className = 'note'; c.textContent = `${root} / ${data.path}`; b.appendChild(c); }
      if (!data.entries.length) { const e = document.createElement('div'); e.className = 'note'; e.textContent = 'Empty.'; b.appendChild(e); }
      folderEntries(b, data, { key, root, color, load: path => load(b, path), refresh: () => load(b, data.path) });
    }

    const openInOs = path => openInDesktop(key, path);

    // Team Inbox takes files: dragged from the desktop onto its card, or picked with "+ Add files".
    // They go into whichever inbox folder the card is showing.
    if (key !== 'inbox') return;
    const sec = body.parentElement;
    const picker = Object.assign(document.createElement('input'), { type: 'file', multiple: true, hidden: true });
    picker.onchange = () => { upload([...picker.files], 0); picker.value = ''; };
    sec.appendChild(picker);
    inboxAdded = names => {   // the main chat added these to the inbox root: offer "File it" and refresh
      justAdded = justAdded.concat(names);
      if (sec.classList.contains('open') && !current) load(body, current);
    };

    async function upload(files, skippedFolders) {
      if (!sec.classList.contains('open')) sec.querySelector('.head').click();
      const added = [], failed = [];
      for (const [i, f] of files.entries()) {
        setStatus('thinking', `Adding ${i + 1} of ${files.length} to Team Inbox…`);
        try {
          const res = await fetch(`/api/upload?name=inbox&path=${encodeURIComponent(current)}&file=${encodeURIComponent(f.name)}`, {
            method: 'POST', credentials: 'same-origin',
            headers: { 'X-Galaxy': '1', 'Content-Type': 'application/octet-stream' }, body: f
          });
          const data = await res.json().catch(() => ({ error: `Server error ${res.status}` }));
          if (!res.ok || data.error) throw new Error(data.error || `Server error ${res.status}`);
          added.push(data.name);
        } catch (err) { failed.push(`${f.name}: ${err.message}`); }
      }
      justAdded = justAdded.concat(added);
      await load(body, current);
      const problems = failed.concat(skippedFolders ? [`${skippedFolders} folder${skippedFolders === 1 ? '' : 's'} skipped: drop the files inside instead`] : []);
      if (problems.length) {
        const n = document.createElement('div'); n.className = 'note error';
        n.textContent = problems.join(' · ');
        body.insertBefore(n, body.children[1] || null);
      }
      if (added.length) {
        setStatus('done', `${added.length} added to Team Inbox`, 3000);
        speak(added.length === 1 ? 'Placed in the Team Inbox. I will see to it the moment you ask.'
                                 : `${added.length} files in the Team Inbox, stacked with more care than they arrived.`);
      } else setStatus('error', 'Nothing was added', 4000);
    }

    const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
    let dragDepth = 0;
    const askForm = document.getElementById('ask-form');
    const clearDrag = () => { dragDepth = 0; sec.classList.remove('drop-ready', 'drop-over'); askForm.classList.remove('drop-over'); };
    // Anywhere on the page: show where files can go, and stop the browser opening a dropped file.
    window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; sec.classList.add('drop-ready'); } });
    window.addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) clearDrag(); });
    window.addEventListener('dragover', e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      const over = sec.contains(e.target), onChat = askForm.contains(e.target);
      sec.classList.toggle('drop-over', over);
      askForm.classList.toggle('drop-over', onChat);
      e.dataTransfer.dropEffect = over || onChat ? 'copy' : 'none';
    });
    window.addEventListener('drop', e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      const over = sec.contains(e.target), onChat = askForm.contains(e.target);
      clearDrag();
      if (onChat) {   // dropped on the chat box: straight into the inbox root (CR-017)
        attachToInbox([...e.dataTransfer.files].filter(f => f.size || f.type));
        return;
      }
      if (!over) return;
      // Folders arrive as zero-byte "files"; keep real files only.
      const items = [...e.dataTransfer.items].filter(it => it.kind === 'file');
      const entries = items.map(it => it.webkitGetAsEntry && it.webkitGetAsEntry());
      const files = items.map((it, i) => (!entries[i] || entries[i].isFile) ? it.getAsFile() : null).filter(Boolean);
      const skipped = entries.filter(en => en && en.isDirectory).length;
      if (files.length || skipped) upload(files, skipped);
    });
  }

  })();

  // Jobs (CR-023): scheduled work as a card on the rail. Opening the card lists every job in the main
  // window; a job opens its own page (what it does, who does it, how often, how it went last time)
  // with its instructions editable in place. Schedule, tools and outputs change in the full editor.
  var openJobEditor = null;   // set by the settings panel, further down
  var jobsChanged = () => {};
  var showJobs = () => {}, showJobNamed = () => {};
  (() => {
    let data = null;
    const accent = tc('#7fd6c2');
    const RUNNER = { larry: "Larry's team", quick: 'Halo (a quick read-only answer)', brief: 'Halo (built in)' };
    const SAY = { done: '✓ Done', failed: '✗ Failed', skipped: 'Skipped', missed: 'Missed (PC was off)', interrupted: 'Interrupted', running: 'Running now…' };
