<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.157.0/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="graph-data.js"></script>
<script>
(() => {
  const PALETTE = [tc('#bad367'), tc('#ff9f43'), tc('#7fc35a'), tc('#f7853b'), tc('#d9ec8f'), tc('#ffc46b'),
                   tc('#4fa36b'), tc('#e8743b'), tc('#a3e37a'), tc('#ffb37a'), tc('#93c47d'), tc('#f2c14e')];
  const nodes = GRAPH.nodes;            // node.id === its index in this array
  const links = GRAPH.links;

  // ---- groups, colours, neighbours --------------------------------------------------
  const groupCounts = {};
  nodes.forEach(n => { groupCounts[n.group] = (groupCounts[n.group] || 0) + 1; });
  const groups = Object.keys(groupCounts).sort((a, b) => groupCounts[b] - groupCounts[a]);
  const groupColor = {};
  groups.forEach((g, i) => { groupColor[g] = PALETTE[i % PALETTE.length]; });

  // Full adjacency: drives the panel's "connected notes" and the focus overlay.
  const neighbors = nodes.map(() => new Set());
  links.forEach(l => { neighbors[l.source].add(l.target); neighbors[l.target].add(l.source); });

  // Backbone: at rest each note keeps only its few strongest links (ties go to the
  // less-connected partner so hubs don't turn into starbursts). Only these are drawn and
  // used for the layout; the full set appears on demand when a note is in focus.
  const BACKBONE_PER_NODE = 2;
  const linksByNode = nodes.map(() => []);
  links.forEach((l, i) => { linksByNode[l.source].push(i); linksByNode[l.target].push(i); });
  const backboneIdx = new Set();
  linksByNode.forEach((ids, n) => {
    const partnerDegree = i => neighbors[links[i].source === n ? links[i].target : links[i].source].size;
    ids.sort((a, b) => (links[b].w || 1) - (links[a].w || 1) || partnerDegree(a) - partnerDegree(b));
    ids.slice(0, BACKBONE_PER_NODE).forEach(i => backboneIdx.add(i));
  });
  const backbone = [...backboneIdx].map(i => ({ source: links[i].source, target: links[i].target }));
  const backbonePairs = backbone.map(l => [l.source, l.target]);  // kept as ids: the graph swaps them for objects

  document.getElementById('stats').textContent =
    `${nodes.length.toLocaleString()} notes · ${links.length.toLocaleString()} connections`;
  document.getElementById('legend').innerHTML = '<div class="title">Index</div>' + groups.map(g =>
    `<div style="color:${groupColor[g]}"><i></i><span style="color:var(--dim)">${escapeHtml(g)} · ${groupCounts[g]}</span></div>`
  ).join('');

  // ---- node dot texture: a hard-edged disc with a thin, faint halo ------------------------
  const DOT_CORE = 0.4;   // core diameter as a share of the sprite
  const dotTexture = (() => {
    const S = 256, m = S / 2, c = document.createElement('canvas'); c.width = c.height = S;
    const ctx = c.getContext('2d');
    const halo = ctx.createRadialGradient(m, m, S * DOT_CORE / 2, m, m, m * 0.85);
    halo.addColorStop(0, tc('rgba(255,255,255,0.22)'));
    halo.addColorStop(1, tc('rgba(255,255,255,0)'));
    ctx.fillStyle = halo; ctx.fillRect(0, 0, S, S);
    ctx.beginPath(); ctx.arc(m, m, S * DOT_CORE / 2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = 4;
    return t;
  })();

  const sprites = new Array(nodes.length);
  function makeNodeObject(node) {
    const mat = new THREE.SpriteMaterial({
      map: dotTexture, color: groupColor[node.group], transparent: true, depthWrite: false
    });
    const s = new THREE.Sprite(mat);
    // Log scale keeps hubs readable without letting them swallow their neighbourhood.
    const core = 5 + Math.log2(1 + neighbors[node.id].size) * 1.6;
    const size = core / DOT_CORE;
    s.scale.set(size, size, 1);
    s.userData.baseSize = s.userData.cur = size;
    sprites[node.id] = s;
    return s;
  }

  // ---- graph ---------------------------------------------------------------------------
  let selected = null;
  let linksLive = false;   // brighter resting web while Jarvis speaks
  const highlight = new Set();

  const Graph = ForceGraph3D({ controlType: 'orbit' })(document.getElementById('galaxy'))
    .backgroundColor(tc('#161933'))
    .showNavInfo(false)
    .graphData({ nodes, links: backbone })
    .nodeId('id')
    .nodeLabel(n => escapeHtml(n.label))
    .nodeThreeObject(makeNodeObject)
    .linkColor(linkColor)
    .linkOpacity(1)
    .linkWidth(0)
    .enableNodeDrag(false)
    .warmupTicks(60)
    .cooldownTime(20000)
    .onNodeClick(n => select(n))
    .onBackgroundClick(clearSelection);

  Graph.renderer().setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  Graph.d3Force('charge').strength(-45);
  Graph.d3Force('link').distance(30).strength(0.35);

  // Frame the whole galaxy once the first layout settles (unless the user is already exploring).
  // No automatic zoom-to-fit when the layout settles: the camera stays where it starts (or wherever
  // you've moved it), rather than pulling out 5-10 seconds after load.

  // Backbone links: a fine visible web at rest, nearly gone while something is in focus.
  function linkColor() {
    if (highlight.size === 0) return linksLive ? tc('rgba(205,228,140,0.3)') : tc('rgba(170,200,120,0.16)');
    return tc('rgba(170,200,120,0.035)');
  }

  // ---- focus overlay: the full connections of whatever is in focus --------------------
  const overlayGeo = new THREE.BufferGeometry();
  const overlayMat = new THREE.LineBasicMaterial({ color: THEME.hex(0xe2eec0), transparent: true, opacity: 0.5, depthWrite: false });
  const overlay = new THREE.LineSegments(overlayGeo, overlayMat);
  overlay.frustumCulled = false;
  Graph.scene().add(overlay);
  let overlayPairs = [], overlayOpacity = 0;

  function setOverlay(pairs, opacity) {
    overlayPairs = pairs;
    overlayGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(Math.max(1, pairs.length) * 6), 3));
    overlayMat.opacity = overlayOpacity = opacity;
    updateOverlay();
  }

  function updateOverlay() {
    const arr = overlayGeo.attributes.position ? overlayGeo.attributes.position.array : null;
    if (!arr || !overlayPairs.length) { overlayGeo.setDrawRange(0, 0); return; }
    overlayPairs.forEach(([a, b], k) => {
      const A = nodes[a], B = nodes[b];
      arr[k*6] = A.x; arr[k*6+1] = A.y; arr[k*6+2] = A.z;
      arr[k*6+3] = B.x; arr[k*6+4] = B.y; arr[k*6+5] = B.z;
    });
    overlayGeo.attributes.position.needsUpdate = true;
    overlayGeo.setDrawRange(0, overlayPairs.length * 2);
  }

  // ---- data stream: light packets travelling along the connections while Jarvis speaks ----
  // Runs along whatever is in focus (the overlay), or along the resting web when nothing is.
  const STREAM_MAX = 1800;
  const streamGeo = new THREE.BufferGeometry();
  streamGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(STREAM_MAX * 3), 3));
  const streamMat = new THREE.PointsMaterial({
    map: (() => {
      const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
      const ctx = c.getContext('2d'), g = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
      g.addColorStop(0, tc('rgba(255,255,255,1)')); g.addColorStop(0.25, tc('rgba(230,242,180,0.8)'));
      g.addColorStop(1, tc('rgba(186,211,103,0)'));
      ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
      return new THREE.CanvasTexture(c);
    })(),
    color: THEME.hex(0xe6f2b8), size: 9, sizeAttenuation: true, transparent: true, opacity: 0,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const stream = new THREE.Points(streamGeo, streamMat);
  stream.frustumCulled = false;
  stream.visible = false;
  Graph.scene().add(stream);
  let streamSource = null, lanes = [];   // lane: [a, b, phase, speed]

  function buildLanes() {
    const pairs = overlayPairs.length ? overlayPairs : backbonePairs;
    if (pairs === streamSource) return;
    streamSource = pairs;
    // Small sets get several packets per connection; big ones get one on a random sample.
    const count = Math.min(STREAM_MAX, pairs.length * 4);
    lanes = [];
    for (let k = 0; k < count; k++) {
      const [a, b] = count >= pairs.length * 4 ? pairs[k % pairs.length] : pairs[(Math.random() * pairs.length) | 0];
      const out = Math.random() < 0.5;
      lanes.push([out ? a : b, out ? b : a, Math.random(), 0.45 + Math.random() * 0.7]);
    }
    streamGeo.setDrawRange(0, lanes.length);
  }

  function updateStream(t, level) {
    stream.visible = level > 0.01;
    if (!stream.visible) return;
    buildLanes();
    const arr = streamGeo.attributes.position.array;
    lanes.forEach(([a, b, phase, speed], k) => {
      const A = nodes[a], B = nodes[b], f = (phase + t * speed) % 1;
      arr[k*3] = A.x + (B.x - A.x) * f; arr[k*3+1] = A.y + (B.y - A.y) * f; arr[k*3+2] = A.z + (B.z - A.z) * f;
    });
    streamGeo.attributes.position.needsUpdate = true;
    streamMat.opacity = level;
    if (overlayPairs.length) overlayMat.opacity = Math.min(1, overlayOpacity * (1 + level * (0.8 + 0.6 * Math.sin(t * 7))));
  }

  // ---- sparks: a few pulses always running along the web, so it looks alive at rest -----
  // Each spark crosses one link, brightening mid-way, then usually hops on to a neighbouring
  // link like current finding its way through; otherwise it fades out and starts somewhere new.
  const SPARK_COUNT = 90;
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SPARK_COUNT * 3), 3));
  sparkGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(SPARK_COUNT * 3), 3));
  const sparkMat = new THREE.PointsMaterial({
    map: streamMat.map, size: 16, sizeAttenuation: true, vertexColors: true, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending   // additive: a dim colour is a faint spark
  });
  const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
  sparkPoints.frustumCulled = false;
  Graph.scene().add(sparkPoints);
  const neighbours = nodes.map(() => []);
  backbonePairs.forEach(([a, b]) => { neighbours[a].push(b); neighbours[b].push(a); });
  const SPARK_RGB = [[0.85, 1.0, 0.45], [1.0, 1.0, 0.85], [1.0, 0.7, 0.3]].map(THEME.rgb01);   // bright brand green, near-white lime, orange
  const sparks = [];
  function launchSpark(s, from) {
    let a = from, b;
    if (a == null || !neighbours[a].length) {
      [a, b] = backbonePairs[(Math.random() * backbonePairs.length) | 0] || [0, 0];
      if (Math.random() < 0.5) [a, b] = [b, a];
      s.wait = Math.random() * 2.5;   // fresh sparks start at staggered moments
    } else {
      b = neighbours[a][(Math.random() * neighbours[a].length) | 0];
      s.wait = 0;
    }
    Object.assign(s, { a, b, f: 0, speed: 0.5 + Math.random() * 0.9,
                       rgb: SPARK_RGB[Math.random() < 0.15 ? 2 : Math.random() < 0.5 ? 1 : 0] });
  }
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (let k = 0; k < SPARK_COUNT; k++) { const s = {}; launchSpark(s); s.f = Math.random(); sparks.push(s); }
  sparkPoints.visible = !reduceMotion && backbonePairs.length > 0;
  function updateSparks(dt, quiet) {
    if (!sparkPoints.visible) return;
    const pos = sparkGeo.attributes.position.array, col = sparkGeo.attributes.color.array;
    // Dimmer while a note is in focus or while the speaking stream is running.
    const gain = (highlight.size ? 0.4 : 1) * (1 - 0.6 * quiet);
    sparks.forEach((s, k) => {
      if (s.wait > 0) { s.wait -= dt; col[k*3] = col[k*3+1] = col[k*3+2] = 0; return; }
      s.f += dt * s.speed;
      if (s.f >= 1) launchSpark(s, Math.random() < 0.7 ? s.b : null);
      const A = nodes[s.a], B = nodes[s.b], f = Math.min(1, s.f);
      if (A.x === undefined || B.x === undefined) return;
      pos[k*3] = A.x + (B.x - A.x) * f; pos[k*3+1] = A.y + (B.y - A.y) * f; pos[k*3+2] = A.z + (B.z - A.z) * f;
      const glow = gain * (0.6 + 0.4 * Math.sin(Math.PI * f));
      col[k*3] = s.rgb[0] * glow; col[k*3+1] = s.rgb[1] * glow; col[k*3+2] = s.rgb[2] * glow;
    });
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.color.needsUpdate = true;
  }

  // Lit notes swell in rolling waves while Jarvis speaks.
  let nodesPulsing = false;
  function pulseNodes(t, level) {
    if (level <= 0.002) {
      if (nodesPulsing) { nodesPulsing = false; refreshNodes(); }
      return;
    }
    nodesPulsing = true;
    sprites.forEach((s, id) => {
      if (!s || (highlight.size && !highlight.has(id))) return;
      const wave = Math.pow(0.5 + 0.5 * Math.sin(t * 5 - id * 0.7), 3);
      const k = s.userData.cur * (1 + level * 0.5 * wave);
      s.scale.set(k, k, 1);
    });
  }

  Graph.scene().fog = null;   // plain black background: only the notes shine

  // ---- selection ---------------------------------------------------------------------
  function select(node) {
    setActiveProject(null);
    selected = node;
    highlight.clear();
    highlight.add(node.id);
    neighbors[node.id].forEach(id => highlight.add(id));
    refreshNodes();
    Graph.linkColor(linkColor);
    const spokes = [...neighbors[node.id]].map(id => [node.id, id]);
    setOverlay(spokes, Math.max(0.18, Math.min(0.7, 5 / Math.sqrt(spokes.length || 1))));  // hubs stay legible

    const dist = 260 + sprites[node.id].userData.baseSize * 4;
    const r = Math.hypot(node.x, node.y, node.z) || 1;
    const k = 1 + dist / r;
    Graph.cameraPosition({ x: node.x * k, y: node.y * k, z: node.z * k }, node, 1800);
    openPanel(node);
    pauseDrift(Infinity);
  }

  function clearSelection() {
    if (selected === null && highlight.size === 0) return;
    selected = null;
    highlight.clear();
    setActiveProject(null);
    refreshNodes();
    Graph.linkColor(linkColor);
    setOverlay([], 0);
    document.getElementById('panel').classList.remove('open');
    document.getElementById('panel').setAttribute('aria-hidden', 'true');
    document.body.classList.remove('panel-open');
    pauseDrift(4000);
  }

  // Light up a set of notes (e.g. the ones an answer used) and frame them.
  function focusNodes(ids) {
    if (!ids.length) return;
    setActiveProject(null);
    selected = null;
    highlight.clear();
    ids.forEach(id => highlight.add(id));
    refreshNodes();
    Graph.linkColor(linkColor);
    const pairs = [];
    ids.forEach((a, i) => ids.slice(i + 1).forEach(b => { if (neighbors[a].has(b)) pairs.push([a, b]); }));
    setOverlay(pairs, Math.max(0.12, Math.min(0.6, 8 / Math.sqrt(pairs.length || 1))));  // big sets stay readable
    document.getElementById('panel').classList.remove('open');
    document.body.classList.remove('panel-open');

    const pts = ids.map(id => nodes[id]);
    const c = pts.reduce((a, n) => ({ x: a.x + n.x / pts.length, y: a.y + n.y / pts.length, z: a.z + n.z / pts.length }),
                         { x: 0, y: 0, z: 0 });
    // Frame most of the set (85th percentile) so one stray outlier doesn't zoom us out to nothing.
    const dists = pts.map(n => Math.hypot(n.x - c.x, n.y - c.y, n.z - c.z)).sort((a, b) => a - b);
    const spread = Math.max(dists[Math.floor((dists.length - 1) * 0.85)], 60);
    const dist = spread * 2.6 + 120;
    const r = Math.hypot(c.x, c.y, c.z) || 1;
    Graph.cameraPosition({ x: c.x + (c.x / r) * dist, y: c.y + (c.y / r) * dist, z: c.z + (c.z / r) * dist }, c, 1800);
    pauseDrift(Infinity);
  }

  function refreshNodes() {
    sprites.forEach((s, id) => {
      if (!s) return;
      let f = 1;
      if (highlight.size === 0) s.material.opacity = 1;
      else if (selected === null && highlight.has(id)) { s.material.opacity = 1; f = 1.5; }
      else if (selected !== null && id === selected.id) { s.material.opacity = 1; f = 1.35; }
      else if (highlight.has(id)) { s.material.opacity = 1; f = 1.05; }
      else s.material.opacity = 0.12;
      const k = s.userData.cur = s.userData.baseSize * f;   // resting size; the speech pulse scales from it
      s.scale.set(k, k, 1);
    });
  }

  function openPanel(node) {
    const color = groupColor[node.group];
    const pg = document.getElementById('p-group');
    pg.textContent = node.group; pg.style.color = color;
    document.getElementById('p-title').textContent = node.label;
    document.getElementById('p-folder').textContent = node.folder;
    document.getElementById('p-excerpt').textContent = node.excerpt || '(empty note)';
    renderDocButtons(document.getElementById('p-actions'), nodePath(node));

    const ids = [...neighbors[node.id]].sort((a, b) => neighbors[b].size - neighbors[a].size);
    document.getElementById('p-ncount').textContent = `Connected notes · ${ids.length}`;
    const box = document.getElementById('neighbors');
    box.innerHTML = '';
    ids.slice(0, 80).forEach(id => {
      const b = document.createElement('button');
      b.textContent = nodes[id].label;
      b.style.borderColor = groupColor[nodes[id].group] + '66';
      b.onclick = () => select(nodes[id]);
      box.appendChild(b);
    });
    box.scrollTop = 0;
    document.getElementById('p-excerpt').scrollTop = 0;
    projectDeliverables(null);

    const panel = document.getElementById('panel');
    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
    document.body.classList.add('panel-open');
  }

  // ---- left rail: Projects, Agents, Team Inbox, Deliverables, Outlook ----------------------
  // Projects and agents come from build.py (copilot/projects folders + Projects.md; Team/<Name - Role>
  // folders). Each lists every note about it. The two folders and Outlook are fetched live from server.py.
  const railEl = document.getElementById('rail');
  // Line icons for the rail cards: drawn in currentColor, so each matches its card's accent bar.
  const ICON = Object.fromEntries(Object.entries({
    projects: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
    agents: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.6a3.2 3.2 0 0 1 0 6.3M18 14.3c1.8.8 3 2.7 3 5.7"/>',
    notes: '<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 7.5l3 3"/>',
    chat: '<path d="M4 5.5h16v10H10l-4.5 3.5v-3.5H4z"/><path d="M8 9.5h8M8 12.5h5"/>',
    actions: '<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 12.5l2.8 2.8L16.5 9"/>',
    meetings: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
    crm: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2.3"/><path d="M5.8 16.5c.6-1.7 1.8-2.6 3.2-2.6s2.6.9 3.2 2.6M14.5 10h3.5M14.5 13.5h3.5"/>',
    inbox: '<path d="M3 13l2.5-8h13L21 13v6H3v-6z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/>',
    deliverables: '<path d="M12 3l8.5 4.5v9L12 21l-8.5-4.5v-9L12 3z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/>',
    outlook: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    send: '<path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/>',
    stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
    speaker: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.5a8 8 0 0 1 0 11"/>',
    muted: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
  }).map(([k, d]) => [k, `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`]));
  const STOP_ICON = ICON.stop.replace('<svg ', '<svg class="stop-icon" ');
  const projects = (GRAPH.projects || []).filter(p => p.nodes.length);
  const agents = (GRAPH.agents || []).filter(a => a.nodes.length);
  const hue = (i, n, start) => PALETTE[(i + start) % PALETTE.length];
  projects.forEach((p, i) => Object.assign(p, { kind: 'Project', color: hue(i, projects.length, 0),
                                                folder: `copilot/projects/${p.name}` }));
  agents.forEach((a, i) => {
    const folder = `Team/${a.name} - ${a.role}`;
    Object.assign(a, { kind: `Agent · ${a.role}`, color: hue(i, agents.length, 1), folder });
  });
  const nodeByPath = new Map(nodes.map(n => [`${n.folder}/${n.label}`.toLowerCase(), n]));
  let activeProject = null;   // the project or agent currently lit up

  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? 'POST' : 'GET', credentials: 'same-origin',
      headers: body ? { 'X-Galaxy': '1', 'Content-Type': 'application/json' } : { 'X-Galaxy': '1' },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => ({ error: `Server error ${res.status}` }));
    if (!res.ok || data.error) throw new Error(data.error || `Server error ${res.status}`);
    return data;
  }

  function addSection({ icon, title, sub, color, onOpen }) {
    const sec = document.createElement('section');
    sec.className = 'section';
    sec.style.setProperty('--accent', color);
    sec.innerHTML = `<button class="head" type="button" aria-expanded="false"><span class="icon">${icon}</span>` +
      `<span class="label"><b>${escapeHtml(title)}</b><span>${escapeHtml(sub)}</span></span>` +
      `<span class="chev">›</span></button><div class="body"></div>`;
    const head = sec.querySelector('.head'), body = sec.querySelector('.body');
    head.onclick = () => {
      const open = !sec.classList.contains('open');
      // One section open at a time keeps the rail readable.
      if (open) railEl.querySelectorAll('.section.open').forEach(s => {
        s.classList.remove('open'); s.querySelector('.head').setAttribute('aria-expanded', 'false');
      });
      sec.classList.toggle('open', open);
      head.setAttribute('aria-expanded', String(open));
      if (open && onOpen) onOpen(body);
    };
    railEl.appendChild(sec);
    return body;
  }

  function itemButton(parent, { name, sub, color, dot = true, icon, title, onClick, cls }) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'item' + (cls ? ' ' + cls : '') + (onClick ? '' : ' static');
    if (color) b.style.setProperty('--accent', color);
    b.innerHTML = `<div class="name">${icon ? `<em>${icon}</em>` : dot ? '<i></i>' : ''}<span>${escapeHtml(name)}</span></div>` +
                  (sub ? `<div class="sub">${escapeHtml(sub)}</div>` : '');
    if (title) b.title = title;
    if (onClick) b.onclick = onClick; else b.tabIndex = -1;
    parent.appendChild(b);
    return b;
  }

  // Projects and Agents: click one to light up every note about it.
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  // A button on a card's header row; the arrow still opens the card's list.
  function headButton(body, label, title, onClick) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'head-action'; b.textContent = label; b.title = title; b.onclick = onClick;
    body.parentElement.insertBefore(b, body);
  }
  const projectsBody = addSection({ icon: ICON.projects, title: 'Projects', sub: plural(projects.length, 'project'), color: tc('#bad367') });
  headButton(projectsBody, 'Project chat', 'Talk to Jarvis about one project', () => showProjectChat());
  { const t = document.createElement('div'); t.className = 'tools'; projectsBody.appendChild(t);
    linkButton(t, '＋ New project', () => showNewProject()); }
  projects.forEach(p => {
    const extra = p.deliverables == null ? '' : ` · ${plural(p.deliverables, 'deliverable')}`;
    p.card = itemButton(projectsBody, { name: p.name, sub: `${plural(p.nodes.length, 'note')}${extra}`,
      color: p.color, title: p.description || p.name, onClick: () => toggleGroup(p) });
  });
  const agentsBody = addSection({ icon: ICON.agents, title: 'Agents', sub: plural(agents.length, 'agent'), color: tc('#ffb347') });
  headButton(agentsBody, 'Team chat', 'Talk to Larry, Penn or anyone on the team', () => showTeamChat());
  agents.forEach(a => {
    a.card = itemButton(agentsBody, { name: a.name, sub: a.role, color: a.color,
      title: a.description || a.role, onClick: () => toggleGroup(a) });
  });
  function toggleGroup(g) { activeProject === g ? clearSelection() : showProject(g); }

  // ---- workspace: documents, Actions, Meetings and the CRM in the main window ------------
  // Views stack: opening a document from a list keeps a "← Back" to that list.
  const workEl = document.getElementById('work');
  const workStack = [];
  const nodeByLabel = new Map();
  nodes.forEach(n => { if (!nodeByLabel.has(n.label.toLowerCase())) nodeByLabel.set(n.label.toLowerCase(), n); });
  const nodePath = n => (n.folder === '(root)' ? '' : n.folder + '/') + n.label + '.md';
  const nodeForPath = p => nodeByPath.get(p.replace(/\.md$/i, '').toLowerCase());

  function showWork(view) {               // view: { kicker, title, accent, render(bar, content) }
    if (workEl.current && workEl.current.stop) workEl.current.stop();   // e.g. dictation in Notes
    // The side panel would squeeze the main window: close it (what's lit in the galaxy stays lit).
    document.getElementById('panel').classList.remove('open');
    document.body.classList.remove('panel-open');
    workEl.style.setProperty('--accent', view.accent || tc('#cfe49a'));
    workEl.innerHTML = `<header>${workStack.length ? '<button class="link-btn back" type="button">← Back</button>' : ''}` +
      `<div class="titles"><div class="kicker">${escapeHtml(view.kicker)}</div><h2>${escapeHtml(view.title)}</h2></div>` +
      `<span class="hdr-tools"></span><button class="x min-btn" type="button" title="Minimise (it keeps running)">–</button>` +
      `<button class="x" type="button" title="Close (Esc)">✕</button></header>` +
      `<div class="bar"></div><div class="content"></div><div class="grip" title="Drag to resize"></div>`;
    workEl.classList.remove('min');
    workEl.querySelector('.x:not(.min-btn)').onclick = closeWork;
    wireWindow();
    const back = workEl.querySelector('.back');
    if (back) back.onclick = () => showWork(workStack.pop());
    workEl.classList.add('open');
    workEl.current = view;
    view.render(workEl.querySelector('.bar'), workEl.querySelector('.content'), workEl.querySelector('.hdr-tools'));
  }
  function openView(view, fromList) {
    if (fromList && workEl.classList.contains('open') && workEl.current) workStack.push(workEl.current);
    else workStack.length = 0;
    showWork(view);
  }
  function closeWork() {
    if (workEl.current && workEl.current.stop) workEl.current.stop();
    workEl.classList.remove('open', 'min'); workStack.length = 0; workEl.current = null; }

  // The window's own size and place, once you've moved or resized it; remembered for next time.
  const WIN_KEY = 'jarvis-work-window';
  function applyWindow() {
    let r = null;
    try { r = JSON.parse(localStorage.getItem(WIN_KEY) || 'null'); } catch (_) {}
    if (!r || window.innerWidth < 1000) { ['left', 'top', 'width', 'height', 'right', 'bottom'].forEach(k => workEl.style[k] = ''); return; }
    const w = Math.min(r.width, window.innerWidth - 20), h = Math.min(r.height, window.innerHeight - 20);
    Object.assign(workEl.style, { left: Math.max(0, Math.min(r.left, window.innerWidth - w)) + 'px',
      top: Math.max(0, Math.min(r.top, window.innerHeight - h)) + 'px', width: w + 'px', height: h + 'px', right: 'auto', bottom: 'auto' });
  }
  function saveWindow() {
    const b = workEl.getBoundingClientRect();
    try { localStorage.setItem(WIN_KEY, JSON.stringify({ left: b.left, top: b.top, width: b.width, height: b.height })); } catch (_) {}
  }
  function wireWindow() {
    applyWindow();
    const header = workEl.querySelector('header'), grip = workEl.querySelector('.grip');
    workEl.querySelector('.min-btn').onclick = e => { e.stopPropagation(); workEl.classList.add('min'); };
    // Drag: the title bar moves the window, the corner grip resizes it.
    const drag = (e, resize) => {
      if (window.innerWidth < 1000) return;
      e.preventDefault();
      const b = workEl.getBoundingClientRect(), x0 = e.clientX, y0 = e.clientY;
      Object.assign(workEl.style, { left: b.left + 'px', top: b.top + 'px', width: b.width + 'px', height: b.height + 'px', right: 'auto', bottom: 'auto' });
      const move = ev => {
        const dx = ev.clientX - x0, dy = ev.clientY - y0;
        if (resize) {
          workEl.style.width = Math.max(360, Math.min(window.innerWidth - b.left - 4, b.width + dx)) + 'px';
          workEl.style.height = Math.max(240, Math.min(window.innerHeight - b.top - 4, b.height + dy)) + 'px';
        } else {
          workEl.style.left = Math.max(0, Math.min(window.innerWidth - 80, b.left + dx)) + 'px';
          workEl.style.top = Math.max(0, Math.min(window.innerHeight - 40, b.top + dy)) + 'px';
        }
      };
      const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); saveWindow(); };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    };
    grip.onpointerdown = e => drag(e, true);
    header.onpointerdown = e => {
      if (e.target.closest('button, select, input, a')) return;
      if (workEl.classList.contains('min')) { workEl.classList.remove('min'); return; }   // click the bar to bring it back
      drag(e, false);
    };
    header.ondblclick = e => {   // back to the normal size and place
      if (e.target.closest('button, select, input, a') || workEl.classList.contains('min')) return;
      try { localStorage.removeItem(WIN_KEY); } catch (_) {}
      applyWindow();
    };
  }

  const loadingInto = (el, text) => { el.innerHTML = `<div class="loading">${escapeHtml(text)}</div>`; };
  const failInto = (el, err) => { el.innerHTML = `<div class="loading error">${escapeHtml(err.message || String(err))}</div>`; };
  const prettyDate = d => { const t = Date.parse(d); return isNaN(t) ? d : new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); };
  function linkButton(parent, label, fn, title) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'link-btn';
    b.textContent = label; b.onclick = fn; if (title) b.title = title; parent.appendChild(b); return b;
  }
  async function openOnDesktop(path) {
    try { await api('/api/open', { name: 'vault', path }); setStatus('thinking', 'opened on your desktop', 2500); }
    catch (err) { setStatus('error', err.message, 4000); }
  }
  // "Open document" and "Open on desktop" for any note (used by the side panel too).
  function renderDocButtons(el, path) {
    el.innerHTML = '';
    linkButton(el, '📄 Open document', () => openDoc(path));
    linkButton(el, 'Open on desktop ↗', () => openOnDesktop(path), 'Open in its usual app (Obsidian, if that is your .md app)');
  }

  // Markdown → safe HTML, with [[wikilinks]] turned into links that open the linked note.
  function renderMarkdown(md) {
    const linked = md.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g,
      (_, target, alias) => `[${(alias || target).replace(/[[\]]/g, '')}](#note:${encodeURIComponent(target.trim())})`);
    if (!window.marked || !window.DOMPurify) return `<pre>${escapeHtml(md)}</pre>`;
    const div = document.createElement('div');
    div.innerHTML = DOMPurify.sanitize(marked.parse(linked));
    div.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (href.startsWith('#note:')) a.dataset.note = decodeURIComponent(href.slice(6));
      else if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    });
    return div.innerHTML;
  }
  function wireNoteLinks(el) {
    el.querySelectorAll('a[data-note]').forEach(a => a.onclick = e => {
      e.preventDefault();
      const n = nodeByLabel.get(a.dataset.note.split('/').pop().toLowerCase());
      if (n) openDoc(nodePath(n), true); else setStatus('error', `No note called "${a.dataset.note}" in the vault`, 3500);
    });
  }

  const FM_SKIP = new Set(['summary', 'action_items', 'title', 'source_quote', 'tags']);
  function openDoc(path, fromList = workEl.classList.contains('open')) {
    const node = nodeForPath(path);
    const isMeeting = path.startsWith('PKM/CRM/Meetings/');
    openView({
      kicker: path.split('/').slice(0, -1).join(' / ') || 'Vault', title: path.split('/').pop().replace(/\.md$/i, ''),
      accent: node ? groupColor[node.group] : tc('#cfe49a'),
      render: async (bar, content, tools) => {
        linkButton(bar, 'Open on desktop ↗', () => openOnDesktop(path));
        if (node) linkButton(bar, '✦ Show in galaxy', () => { closeWork(); select(node); });
        loadingInto(content, 'Opening…');
        let note;
        try { note = await api(`/api/note?path=${encodeURIComponent(path)}`); } catch (err) { return failInto(content, err); }
        const f = note.fields;
        const heading = f.title || f.action || f.full_name || f.name;
        if (heading) workEl.querySelector('h2').textContent = heading;
        if (isMeeting || note.fireflies) {
          if (note.fireflies) linkButton(bar, 'Fireflies ↗', () => window.open(note.fireflies, '_blank', 'noopener'));
          linkButton(bar, note.transcript_cached ? '🎙 Transcript' : '🎙 Transcript (fetch)', () => openTranscript(path, f.title || note.title));
        }
        const rows = Object.entries(f).filter(([k, v]) => !FM_SKIP.has(k) && v !== '' && !(Array.isArray(v) && !v.length));
        const fm = rows.length ? `<dl class="fm">${rows.map(([k, v]) =>
          `<dt>${escapeHtml(k.replace(/_/g, ' '))}</dt><dd>${escapeHtml(Array.isArray(v) ? v.join(', ') : String(v))}</dd>`).join('')}</dl>` : '';
        const summary = f.summary ? `<div class="fm-summary">${renderMarkdown(String(f.summary))}</div>` : '';
        content.innerHTML = `<div class="doc">${fm}${summary}${renderMarkdown(note.body)}</div>`;
        wireNoteLinks(content);
      }
    }, fromList);
  }

  function openTranscript(path, title) {
    openView({
      kicker: 'Meeting transcript', title, accent: tc('#ff9f43'),
      render: async (bar, content) => {
        loadingInto(content, 'Fetching the transcript from Fireflies… the first time takes a minute or two; after that it opens instantly.');
        try {
          const t = await api(`/api/transcript?path=${encodeURIComponent(path)}`);
          bar.innerHTML = `<span class="count">${t.cached ? 'Saved copy' : 'Fetched from Fireflies just now'} · ${t.transcript.split('\n').length} lines</span>`;
          const pre = document.createElement('div'); pre.className = 'transcript'; pre.textContent = t.transcript;
          content.innerHTML = ''; content.appendChild(pre);
        } catch (err) { failInto(content, err); }
      }
    }, true);
  }

  // A searchable list view; `row(item)` returns { el } contents, `match(item)` the search text.
  function listView({ kicker, title, accent, load, filters, row, match, empty }) {
    let state = { q: '', filter: filters ? filters[0].key : null };
    openView({
      kicker, title, accent,
      render: async (bar, content) => {
        const search = document.createElement('input');
        search.type = 'search'; search.placeholder = 'Search…'; search.value = state.q;
        bar.appendChild(search);
        const btns = (filters || []).map(f => linkButton(bar, f.label, () => { state.filter = f.key; paint(); }));
        const count = document.createElement('span'); count.className = 'count'; bar.appendChild(count);
        loadingInto(content, 'Loading…');
        let items;
        try { items = await load(); } catch (err) { return failInto(content, err); }
        function paint() {
          btns.forEach((b, i) => b.classList.toggle('on', filters[i].key === state.filter));
          const q = state.q.toLowerCase();
          const shown = items.filter(it => (!filters || filters.find(f => f.key === state.filter).test(it)) &&
                                           (!q || match(it).toLowerCase().includes(q)));
          count.textContent = `${shown.length} of ${items.length}`;
          content.innerHTML = shown.length ? '' : `<div class="empty">${escapeHtml(empty)}</div>`;
          shown.slice(0, 400).forEach(it => content.appendChild(row(it, paint)));
        }
        search.oninput = () => { state.q = search.value; paint(); };
        paint();
        workEl.current.repaint = paint;
      }
    }, false);
  }

  const crmLink = (label, folder) => {
    if (!label) return '';
    const path = `${folder}/${label}.md`;
    return nodeForPath(path) ? `<a data-path="${escapeHtml(path)}">${escapeHtml(label.replace(/-/g, ' '))}</a>` : escapeHtml(label.replace(/-/g, ' '));
  };
  function rowEl(cls, html, onOpen) {
    const el = document.createElement('div'); el.className = 'row-item ' + (cls || '');
    el.innerHTML = html;
    const main = el.querySelector('.main');
    if (main) main.onclick = e => {
      const a = e.target.closest('a[data-path]');
      if (a) { e.stopPropagation(); openDoc(a.dataset.path, true); return; }
      onOpen();
    };
    return el;
  }

  // Actions: tick them off right here. The tick rewrites only the note's done: line.
  let openActionCount = null;
  function showActions() {
    listView({
      kicker: 'Actions', title: 'Your action list', accent: tc('#a3e37a'), empty: 'Nothing here. Enviable.',
      filters: [{ key: 'open', label: 'Open', test: a => !a.done }, { key: 'done', label: 'Done', test: a => a.done },
                { key: 'all', label: 'All', test: () => true }],
      load: async () => (await api('/api/actions')).actions,
      match: a => `${a.action} ${a.owner} ${a.org} ${a.meeting} ${a.id}`,
      row: (a, repaint) => {
        const meta = [`#${a.id}`, a.owner && crmLink(a.owner, 'PKM/CRM/People'), a.org && crmLink(a.org, 'PKM/CRM/Organizations'),
                      a.due && `due ${escapeHtml(prettyDate(a.due))}`, a.raised && `raised ${escapeHtml(prettyDate(a.raised))}`,
                      a.meeting && crmLink(a.meeting, 'PKM/CRM/Meetings')].filter(Boolean).join(' · ');
        const el = rowEl(a.done ? 'done' : '', `<input type="checkbox" class="check" ${a.done ? 'checked' : ''} ` +
          `aria-label="Done"><div class="main"><div class="t">${escapeHtml(a.action)}</div><div class="m">${meta}</div></div>`,
          () => openDoc(a.path, true));
        const box = el.querySelector('.check');
        box.onchange = async () => {
          const done = box.checked;
          el.classList.toggle('done', done);
          try {
            await api('/api/action', { path: a.path, done });
            a.done = done;
            openActionCount += done ? -1 : 1; updateActionsCard(); refreshMetrics();
            setStatus('thinking', done ? `ticked off #${a.id}` : `#${a.id} is open again`, 2500);
          } catch (err) {
            box.checked = !done; el.classList.toggle('done', !done);
            setStatus('error', err.message, 4000);
          }
        };
        return el;
      }
    });
  }

  function showMeetings() {
    listView({
      kicker: 'Meetings', title: 'Meeting history', accent: tc('#ff9f43'), empty: 'No meetings match.',
      load: async () => (await api('/api/meetings')).meetings,
      match: m => `${m.title} ${m.org} ${m.date}`,
      row: m => rowEl('', `<div class="when">${escapeHtml(prettyDate(m.date))}</div><div class="main">` +
        `<div class="t">${escapeHtml(m.title)}</div><div class="m">${[m.org && crmLink(m.org, 'PKM/CRM/Organizations'),
          m.attendees && `${m.attendees} attendees`, m.fireflies && '🎙 Fireflies'].filter(Boolean).join(' · ')}</div></div>`,
        () => openDoc(m.path, true))
    });
  }

  function showCrm(kind = 'organizations') {
    listView({
      kicker: 'CRM', title: kind === 'people' ? 'Contacts' : 'Organisations', accent: tc('#ffc46b'),
      empty: 'Nobody by that name. Yet.',
      load: async () => (await api(`/api/crm?kind=${kind}`)).rows,
      match: r => `${r.name} ${r.sub}`,
      row: r => rowEl('', `<div class="main"><div class="t">${escapeHtml(r.name)}</div>` +
        `<div class="m">${escapeHtml(r.sub || '')}</div></div>`, () => openDoc(r.path, true))
    });
    // Organisations ⇄ Contacts switch in the header.
    const tools = workEl.querySelector('.hdr-tools');
    linkButton(tools, 'Organisations', () => showCrm('organizations')).classList.toggle('on', kind !== 'people');
    linkButton(tools, 'Contacts', () => showCrm('people')).classList.toggle('on', kind === 'people');
  }

  // Rail cards that open the workspace rather than expanding.
  function launcher({ icon, title, sub, color, open }) {
    const sec = document.createElement('section');
    sec.className = 'section';
    sec.style.setProperty('--accent', color);
    sec.innerHTML = `<button class="head" type="button"><span class="icon">${icon}</span>` +
      `<span class="label"><b>${escapeHtml(title)}</b><span>${escapeHtml(sub)}</span></span><span class="chev">›</span></button>`;
    sec.querySelector('.head').onclick = open;
    railEl.appendChild(sec);
    return sec.querySelector('.label span');
  }
  // Notes: a new fleeting note you can type or dictate, saved to PKM/Fleeting Notes at the vault
  // root (Larry files them into topic folders). Earlier fleeting notes sit alongside, ready to reopen.
  const FLEETING = 'PKM/Fleeting Notes';
  const DRAFT_KEY = 'galaxy-note-draft';
  let noteRec = null;   // dictation runs on its own recogniser, separate from the ask-bar mic

  function showNotes(editPath = null, listen = false) {
    openView({
      kicker: 'Notes', title: editPath ? editPath.split('/').pop().replace(/\.md$/, '') : 'New fleeting note', accent: tc('#d9ec8f'),
      render: async (bar, content) => {
        let current = editPath, dirty = false, dictating = false, base = '';
        linkButton(bar, '＋ New note', () => { stopDictation(); showNotes(); });
        linkButton(bar, 'Fleeting Notes folder ↗', () => openOnDesktop(FLEETING), 'Open the folder on your desktop');
        content.innerHTML = `<div class="notes-grid"><div class="editor">
            <input class="note-title" type="text" maxlength="80" placeholder="Name your note (or leave it for a dated name)">
            <textarea placeholder="Type, or press Dictate and talk. Pauses and full stops won't stop it."></textarea>
            <div class="tools"></div></div>
          <div class="fleet"><h4>Fleeting notes</h4><input type="search" placeholder="Search notes…"><div class="list"></div></div></div>`;
        const titleEl = content.querySelector('.note-title'), textEl = content.querySelector('textarea');
        const tools = content.querySelector('.editor .tools'), listEl = content.querySelector('.fleet .list');
        const searchEl = content.querySelector('.fleet input');
        const dictBtn = linkButton(tools, '🎙 Dictate', () => dictating ? stopDictation() : startDictation());
        const saveBtn = linkButton(tools, 'Save', save); saveBtn.classList.add('primary');
        const readBtn = linkButton(tools, 'Read', () => current && openDoc(current, true));
        const hint = document.createElement('span'); hint.className = 'hint'; tools.appendChild(hint);
        const say = (text, cls = '') => { hint.textContent = text; hint.className = 'hint ' + cls; };

        async function loadInto(path) {
          stopDictation();
          current = path;
          titleEl.value = path.split('/').pop().replace(/\.md$/, ''); titleEl.disabled = true;
          workEl.querySelector('h2').textContent = titleEl.value;
          textEl.value = ''; say('Opening…');
          try { textEl.value = (await api(`/api/note?path=${encodeURIComponent(path)}`)).body; say(path.split('/').slice(0, -1).join(' / ')); }
          catch (err) { say(err.message, 'err'); }
          readBtn.hidden = false; dirty = false; paintList();
        }
        if (current) loadInto(current);
        else {
          readBtn.hidden = true;
          try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (d) { titleEl.value = d.title || ''; textEl.value = d.body || ''; if (d.body) say('Unsaved draft restored'); } } catch (_) {}
          setTimeout(() => textEl.focus(), 50);
        }

        const keepDraft = () => {
          dirty = true;
          if (!current) try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ title: titleEl.value, body: textEl.value })); } catch (_) {}
        };
        titleEl.oninput = textEl.oninput = keepDraft;
        textEl.onkeydown = titleEl.onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } };

        async function save() {
          if (!textEl.value.trim()) { say('Nothing to save yet', 'err'); return; }
          saveBtn.disabled = true; say('Saving…');
          try {
            const r = await api('/api/fleeting', { title: titleEl.value, body: textEl.value, path: current });
            const wasNew = !current;
            current = r.path; dirty = false; titleEl.disabled = true; readBtn.hidden = false;
            titleEl.value = r.path.split('/').pop().replace(/\.md$/, '');
            workEl.querySelector('h2').textContent = titleEl.value;
            if (wasNew) try { localStorage.removeItem(DRAFT_KEY); } catch (_) {}
            say(`Saved to ${r.path}`, 'ok');
            refreshList();
          } catch (err) { say(err.message, 'err'); }
          finally { saveBtn.disabled = false; }
        }

        // Dictation: continuous, keeps going through pauses until you press Stop.
        function startDictation() {
          if (!Recognition) { say('Dictation needs Chrome or Edge', 'err'); return; }
          if (wantOn) micEl.onclick();                     // don't run alongside the ask-bar mic
          stopSpeaking();
          noteRec = noteRec || new Recognition();
          Object.assign(noteRec, { lang: navigator.language || 'en-GB', interimResults: true, continuous: true });
          dictating = true; base = textEl.value;
          dictBtn.textContent = '■ Stop dictating'; dictBtn.classList.add('dictating'); say('Listening…');
          noteRec.onresult = e => {
            let text = '';
            for (const r of e.results) text += r[0].transcript;
            textEl.value = base + (base && !/\s$/.test(base) ? ' ' : '') + text.trim();
            textEl.scrollTop = textEl.scrollHeight; keepDraft();
          };
          noteRec.onerror = e => { if (FATAL_REC_ERRORS.has(e.error)) { say(REC_ERRORS[e.error] || e.error, 'err'); stopDictation(); } };
          noteRec.onend = () => {                          // Chrome ends sessions now and then: carry on
            base = textEl.value;
            if (dictating) setTimeout(() => { if (dictating) try { noteRec.start(); } catch (_) {} }, 150);
          };
          try { noteRec.start(); } catch (_) {}
        }
        function stopDictation() {
          if (!dictating) return;
          dictating = false;
          try { noteRec.stop(); } catch (_) {}
          dictBtn.textContent = '🎙 Dictate'; dictBtn.classList.remove('dictating'); say(dirty ? 'Not saved yet' : '');
        }
        workEl.current.stop = stopDictation;

        let fleeting = [];
        function paintList() {
          const q = searchEl.value.toLowerCase();
          listEl.innerHTML = '';
          const shown = fleeting.filter(n => !q || `${n.name} ${n.topic} ${n.preview}`.toLowerCase().includes(q));
          if (!shown.length) listEl.innerHTML = '<div class="empty">No notes match.</div>';
          shown.forEach(n => listEl.appendChild(rowEl(n.path === current ? 'current' : '',
            `<div class="main"><div class="t">${escapeHtml(n.name)}</div><div class="m">${escapeHtml(n.topic || 'Unfiled')} · ` +
            `${escapeHtml(fmtDate(n.modified))} · ${escapeHtml(n.preview)}</div></div>`,
            () => { if (dirty && !confirm('Leave this note without saving?')) return; loadInto(n.path); })));
        }
        async function refreshList() {
          try { fleeting = (await api('/api/fleeting')).notes; paintList(); }
          catch (err) { listEl.innerHTML = `<div class="loading error">${escapeHtml(err.message)}</div>`; }
        }
        searchEl.oninput = paintList;
        refreshList();
        if (listen && !current) startDictation();
      }
    }, false);
  }
  launcher({ icon: ICON.notes, title: 'Notes', sub: 'New note · Fleeting Notes', color: tc('#d9ec8f'), open: () => showNotes() });

  // Project chat: pick a project and talk to Jarvis about it alone. Each conversation is saved as
  // a markdown file in copilot/projects/<Project>/jarvis-chats/ and remembered when reopened.
  let lastChatProject = null;
  function showProjectChat(projectName = lastChatProject || (projects[0] && projects[0].name), chatPath = null) {
    lastChatProject = projectName;
    const project = projects.find(p => p.name === projectName);
    openView({
      kicker: 'Project chat', title: projectName, accent: project ? project.color : tc('#bad367'),
      render: async (bar, content, tools) => {
        let current = chatPath, busy = false, listening = false, rec = null;   // current: this chat's file
        const pick = document.createElement('select'); pick.className = 'project-pick'; pick.setAttribute('aria-label', 'Project');
        projects.forEach(p => { const o = document.createElement('option'); o.value = o.textContent = p.name; pick.appendChild(o); });
        pick.value = projectName;
        pick.onchange = () => showProjectChat(pick.value);
        bar.appendChild(pick);
        linkButton(bar, '＋ New chat', () => showProjectChat(projectName));
        if (project) linkButton(bar, '✦ Light up project', () => { closeWork(); showProject(project); });
        linkButton(bar, 'Chats folder ↗', () => openOnDesktop(`copilot/projects/${projectName}/jarvis-chats`),
                   'Open this project’s saved chats on your desktop');

        content.innerHTML = `<div class="chat-grid"><div class="chat-list"><div class="about"></div><div class="list"></div></div>
          <div class="convo"><div class="msgs"></div><div class="compose">
            <textarea rows="1" placeholder="Ask about ${escapeHtml(projectName)}…"></textarea>
            <button class="icon-btn mic" type="button" title="Talk (click again to send)">${ICON.mic}</button>
            <button class="icon-btn send" type="button" title="Send (Enter)" aria-label="Send" style="background:var(--brand);color:#10170a;border-color:var(--brand)">${ICON.send}</button>
          </div></div></div>`;
        const listEl = content.querySelector('.chat-list .list'), aboutEl = content.querySelector('.about');
        const msgsEl = content.querySelector('.msgs'), input = content.querySelector('textarea');
        const micBtn = content.querySelector('.mic'), sendBtn = content.querySelector('.send');

        const addMsg = (who, text, extra = {}) => {
          const m = document.createElement('div');
          m.className = `msg ${who}` + (extra.cls ? ' ' + extra.cls : '');
          if (extra.when) { const w = document.createElement('span'); w.className = 'when'; w.textContent = extra.when; m.appendChild(w); }
          m.appendChild(document.createTextNode(text));
          if (extra.sources && extra.sources.length) {
            const s = document.createElement('div'); s.className = 'srcs';
            extra.sources.forEach(src => {
              const n = nodes[src.id] && nodes[src.id].label === src.label ? nodes[src.id] : nodeByLabel.get(src.label.toLowerCase());
              const b = document.createElement('button'); b.type = 'button'; b.textContent = src.label;
              b.title = 'Open this note';
              b.onclick = () => n ? openDoc(nodePath(n), true) : setStatus('error', 'That note has moved since', 3000);
              s.appendChild(b);
            });
            m.appendChild(s);
          }
          msgsEl.appendChild(m); msgsEl.scrollTop = msgsEl.scrollHeight;
          return m;
        };
        const greet = () => addMsg('jarvis', `Ask me anything about ${projectName}. I'll stick to its ${project ? project.nodes.length : ''} notes, and this conversation is saved in the project folder.`);

        async function loadList() {
          try {
            const d = await api(`/api/project-chats?project=${encodeURIComponent(projectName)}`);
            aboutEl.textContent = (d.description ? d.description + ' · ' : '') + `${d.notes} notes · ${d.chats.length} saved chat${d.chats.length === 1 ? '' : 's'}`;
            listEl.innerHTML = d.chats.length ? '' : '<div class="empty">No chats yet. Ask your first question.</div>';
            d.chats.forEach(c => listEl.appendChild(rowEl(c.path === current ? 'current' : '',
              `<div class="main"><div class="t">${escapeHtml(c.title)}</div><div class="m">${escapeHtml(c.updated || c.created)} · ${c.turns} ` +
              `question${c.turns === 1 ? '' : 's'}</div></div>`, () => showProjectChat(projectName, c.path))));
          } catch (err) { failInto(listEl, err); }
        }
        async function loadChat() {
          if (!current) { greet(); return; }
          try {
            const d = await api(`/api/project-chat?project=${encodeURIComponent(projectName)}&path=${encodeURIComponent(current)}`);
            d.turns.forEach(t => { addMsg('you', t.q, { when: t.time }); addMsg('jarvis', t.a, { sources: t.sources }); });
            if (!d.turns.length) greet();
          } catch (err) { addMsg('jarvis', err.message, { cls: 'error' }); }
        }

        async function send() {
          const q = input.value.trim();
          if (!q || busy) return;
          busy = true; input.value = '';
          sendBtn.innerHTML = STOP_ICON; sendBtn.title = 'Stop'; sendBtn.classList.add('stopper');
          stopSpeaking();
          addMsg('you', q);
          const wait = addMsg('jarvis', 'Consulting the project notes…', { cls: 'thinking' });
          setStatus('thinking', 'thinking…');
          try {
            const res = await fetch('/chat', { method: 'POST', credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ question: q, project: projectName, chat: current }) });
            const data = await res.json().catch(() => ({ error: `Server error ${res.status}` }));
            if (!res.ok || data.error) throw new Error(data.error || `Server error ${res.status}`);
            wait.remove();
            addMsg('jarvis', data.answer, { sources: data.sources });
            const isNew = !current;
            current = data.path;
            if (data.context) { jarvisContext = data.context; renderContext(); }
            if (data.job) trackJob(data.job);
            setStatus('');
            speak(data.speech || data.answer);
            if (data.action) handleAction(data.action);
            loadList();   // new chat appears, question counts update
          } catch (err) {
            wait.remove(); addMsg('jarvis', err.message, { cls: 'error' }); setStatus('');
          } finally {
            busy = false; input.focus();
            sendBtn.innerHTML = ICON.send; sendBtn.title = 'Send (Enter)'; sendBtn.classList.remove('stopper');
          }
        }
        sendBtn.onclick = () => busy ? api('/api/stop-answer', {}).catch(() => {}) : send();
        input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
        input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(160, input.scrollHeight) + 'px'; };

        // Talk: keeps listening through pauses; click again to send.
        micBtn.onclick = () => {
          if (!Recognition) { setStatus('error', 'voice input needs Chrome or Edge', 4000); return; }
          if (listening) { listening = false; try { rec.stop(); } catch (_) {} return; }
          if (wantOn) micEl.onclick();
          stopSpeaking();
          rec = rec || new Recognition();
          Object.assign(rec, { lang: navigator.language || 'en-GB', interimResults: true, continuous: true });
          let base = input.value;
          rec.onresult = e => { let t = ''; for (const r of e.results) t += r[0].transcript; input.value = (base ? base + ' ' : '') + t.trim(); };
          rec.onerror = e => { if (FATAL_REC_ERRORS.has(e.error)) { listening = false; setStatus('error', REC_ERRORS[e.error] || e.error, 4000); } };
          rec.onend = () => {
            if (listening) { base = input.value; setTimeout(() => { if (listening) try { rec.start(); } catch (_) {} }, 150); return; }
            micBtn.classList.remove('on'); setStatus('');
            if (input.value.trim()) send();
          };
          listening = true; micBtn.classList.add('on'); setStatus('listening', 'listening… click the mic to send');
          try { rec.start(); } catch (_) {}
        };
        workEl.current.stop = () => { if (listening) { listening = false; input.value = ''; try { rec.stop(); } catch (_) {} } };

        loadList(); loadChat();
        setTimeout(() => input.focus(), 50);
      }
    }, false);
  }

  // Team chat: talk to one agent directly. Each message runs that agent in the vault and later
  // messages continue the same session; replies arrive in the background, so the view polls.
  const team = (GRAPH.agents || []).slice().sort((a, b) => (a.name === 'Larry' ? -1 : b.name === 'Larry' ? 1 : a.name.localeCompare(b.name)));
  let lastTeamAgent = 'Larry';
  let viewingChat = null;   // the team chat on screen, if any

  // One approval request: the exact command, the agent's reason, and your answer.
  function approvalCard(req, onDone) {
    const el = document.createElement('div'); el.className = 'approval';
    if (req.kind === 'question') {
      const n = (req.questions || []).length;
      el.innerHTML = `<div class="ap-head">❓ ${escapeHtml(req.asker)} has ${n === 1 ? 'a question' : n + ' questions'} for you</div>` +
        '<div class="ap-why"></div><div class="ap-actions"><button type="button" class="ap-yes">Answer</button></div>';
      el.querySelector('.ap-why').textContent = (req.questions || []).map(q => q.question).join('  ·  ');
      el.querySelector('.ap-yes').onclick = () => askQuestions(req, onDone);
      return el;
    }
    // What will happen, in plain English (a step list); the agent's reason; the exact command tucked away.
    const bold = t => escapeHtml(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    const steps = req.plain ? `<ul class="ap-steps">${req.plain.map(st => `<li>${bold(st)}</li>`).join('')}</ul>`
                            : '<div class="ap-why">Working out what this does…</div>';
    el.innerHTML = `<div class="ap-head">⚠ ${escapeHtml(req.asker)} would like to:</div>${steps}` +
      (req.why ? `<div class="ap-why">${escapeHtml(req.asker)}'s reason: <span></span></div>` : '') +
      '<details class="ap-cmd"><summary>Show the exact command</summary><pre></pre></details>' +
      '<div class="ap-actions"><button type="button" class="ap-yes">Approve</button><button type="button" class="ap-no">Deny</button></div>';
    el.querySelector('pre').textContent = req.what;
    if (req.why) el.querySelector('.ap-why span').textContent = req.why;
    const answer = async decision => {
      el.querySelectorAll('button').forEach(b => { b.disabled = true; });
      try { onDone(await api('/api/approval/decide', { ticket: req.ticket, decision })); }
      catch (err) { setStatus('error', err.message, 4000); el.querySelectorAll('button').forEach(b => { b.disabled = false; }); }
    };
    el.querySelector('.ap-yes').onclick = () => answer('approve');
    el.querySelector('.ap-no').onclick = () => answer('deny');
    return el;
  }

  // An agent's questions, one at a time: pick an option (or several, where allowed), or type
  // your own; Back steps back; the answers go to the agent together at the end.
  const qModal = document.getElementById('qmodal'), qBox = qModal.querySelector('.qbox');
  let qOpenFor = null;
  function askQuestions(req, onDone = () => {}) {
    const qs = req.questions || [];
    if (!qs.length) return;
    qOpenFor = req.ticket;
    const picks = qs.map(() => new Set()), others = qs.map(() => '');
    let at = 0;
    const close = () => { qModal.hidden = true; qOpenFor = null; };
    const finish = async decision => {
      qBox.querySelectorAll('button').forEach(b => { b.disabled = true; });
      const answers = {};
      qs.forEach((q, i) => {
        const chosen = [...picks[i]];
        if (others[i].trim()) chosen.push(others[i].trim());
        answers[q.question] = chosen.join(', ');
      });
      try { const chat = await api('/api/approval/decide', decision === 'answer' ? { ticket: req.ticket, decision, answers } : { ticket: req.ticket, decision }); close(); onDone(chat); }
      catch (err) { setStatus('error', err.message, 5000); close(); }
    };
    function draw() {
      const q = qs[at], multi = !!q.multiSelect;
      qBox.innerHTML = `<div class="q-top"><span>${escapeHtml(req.asker)} asks</span><span>${at + 1} of ${qs.length}</span></div>` +
        (q.header ? `<div class="q-chip"></div>` : '') + '<h3></h3><div class="q-opts"></div>' +
        `<input class="q-other" type="text" placeholder="Something else? Type it here">` +
        `<div class="q-foot"><button type="button" class="q-skip">Skip</button>` +
        (at ? '<button type="button" class="q-back">Back</button>' : '') +
        `<button type="button" class="q-next">${at === qs.length - 1 ? 'Send answers' : 'Next'}</button></div>`;
      if (q.header) qBox.querySelector('.q-chip').textContent = q.header;
      qBox.querySelector('h3').textContent = q.question + (multi ? ' (choose any)' : '');
      const opts = qBox.querySelector('.q-opts'), other = qBox.querySelector('.q-other'), next = qBox.querySelector('.q-next');
      const ready = () => { next.disabled = !(picks[at].size || other.value.trim()); };
      (q.options || []).forEach(o => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'q-opt' + (picks[at].has(o.label) ? ' on' : '');
        b.innerHTML = '<b></b>' + (o.description ? '<span></span>' : '');
        b.querySelector('b').textContent = o.label;
        if (o.description) b.querySelector('span').textContent = o.description;
        b.onclick = () => {
          if (multi) picks[at].has(o.label) ? picks[at].delete(o.label) : picks[at].add(o.label);
          else { picks[at].clear(); picks[at].add(o.label); others[at] = ''; }
          draw();
        };
        opts.appendChild(b);
      });
      other.value = others[at];
      other.oninput = () => { others[at] = other.value; if (!multi && other.value.trim()) { picks[at].clear(); opts.querySelectorAll('.on').forEach(x => x.classList.remove('on')); } ready(); };
      other.onkeydown = e => { if (e.key === 'Enter' && !next.disabled) next.click(); };
      next.onclick = () => { if (at < qs.length - 1) { at++; draw(); } else finish('answer'); };
      const back = qBox.querySelector('.q-back'); if (back) back.onclick = () => { at--; draw(); };
      qBox.querySelector('.q-skip').onclick = () => finish('deny');
      ready();
    }
    qModal.hidden = false;
    draw();
  }

  // Jobs and team chats run in the background, so a request can arrive at any time. When one
  // does, open that agent's chat with the details (once per request) and say so.
  const announced = new Set();
  let pendingByChat = new Map();
  async function watchApprovals() {
    try {
      const { pending } = await api('/api/approvals');
      const before = [...pendingByChat.keys()].join();
      pendingByChat = new Map(pending.map(r => [r.chat, r]));
      const trayChanged = before !== [...pendingByChat.keys()].join();
      const fresh = pending.find(r => !announced.has(r.ticket));
      pending.forEach(r => announced.add(r.ticket));
      if (fresh) {
        if (viewingChat !== fresh.chat) showTeamChat(fresh.agent, fresh.chat);
        else workEl.classList.remove('min');   // minimised: bring it back up to show the request
        // With Jarvis open in more than one tab, only the first to see a request says it out loud.
        let first = true;
        try {
          const key = 'jarvis-said-' + fresh.ticket;
          first = !localStorage.getItem(key);
          localStorage.setItem(key, '1');
        } catch (_) {}
        if (fresh.kind === 'question') {
          if (first) speak(`${fresh.asker} has a question for you.`);
          if (!qOpenFor) askQuestions(fresh);
        } else if (first) speak(`${fresh.asker} needs your approval.`);
      }
      if (qOpenFor && !pending.some(r => r.ticket === qOpenFor)) { qModal.hidden = true; qOpenFor = null; }   // answered elsewhere, or the run ended
      // Redraw Larry's tray only when a request comes or goes: redrawing every check replays the
      // cards' fade-in, so they flicker.
      if (trayChanged && typeof renderJobs === 'function') renderJobs();
      if (trayChanged && crewOpen) { assignBots(); renderCrewList(); }
    } catch (_) { /* the server may be restarting */ }
    setTimeout(watchApprovals, 3000);
  }
  setTimeout(watchApprovals, 3000);
  function showTeamChat(agentName = lastTeamAgent, chatId = null, draft = '') {
    const member = team.find(a => a.name.toLowerCase() === String(agentName).toLowerCase()) || team[0];
    if (!member) { setStatus('error', 'No team in this vault yet', 4000); return; }
    lastTeamAgent = member.name;
    const colour = (agents.find(a => a.name === member.name) || {}).color || tc('#ffb347');
    openView({
      kicker: `Team chat · ${member.role}`, title: member.name, accent: colour,
      render: async (bar, content) => {
        let current = chatId, busy = false, poll = null, listening = false, rec = null, seen = 0;
        const pick = document.createElement('select'); pick.className = 'project-pick'; pick.setAttribute('aria-label', 'Team member');
        team.forEach(a => { const o = document.createElement('option'); o.value = a.name; o.textContent = `${a.name} · ${a.role}`; pick.appendChild(o); });
        pick.value = member.name;
        pick.onchange = () => showTeamChat(pick.value);
        bar.appendChild(pick);
        linkButton(bar, '＋ New chat', () => showTeamChat(member.name));

        content.innerHTML = `<div class="chat-grid"><div class="chat-list"><div class="about"></div><div class="list"></div></div>
          <div class="convo"><div class="msgs"></div><div class="compose">
            <textarea rows="1" placeholder="Message ${escapeHtml(member.name)}…"></textarea>
            <button class="icon-btn mic" type="button" title="Talk (click again to send)">${ICON.mic}</button>
            <button class="icon-btn send" type="button" title="Send (Enter)" aria-label="Send" style="background:var(--brand);color:#10170a;border-color:var(--brand)">${ICON.send}</button>
          </div></div></div>`;
        const listEl = content.querySelector('.chat-list .list'), aboutEl = content.querySelector('.about');
        const msgsEl = content.querySelector('.msgs'), input = content.querySelector('textarea');
        const micBtn = content.querySelector('.mic'), sendBtn = content.querySelector('.send');
        if (draft) { input.value = draft; setTimeout(() => { input.focus(); input.setSelectionRange(draft.length, draft.length); }, 50); }
        aboutEl.textContent = (member.description || member.role) + ' Each message runs ' + member.name +
          ' in your vault, so replies can take a minute or more when there is work to do.';

        const addMsg = m => {
          const el = document.createElement('div');
          if (m.who === 'you') { el.className = 'msg you' + (m.approval ? (m.approval === 'approve' ? ' approved' : ' denied') : ''); el.textContent = m.text; }
          else {
            el.className = 'msg agent doc' + (m.error ? ' error' : '');
            el.innerHTML = `<span class="who">${escapeHtml(member.name)}</span>` + renderMarkdown(m.text);
            wireNoteLinks(el);
          }
          if (m.time) { const w = document.createElement('span'); w.className = 'when'; w.textContent = m.time; el.prepend(w); }
          msgsEl.appendChild(el);
        };
        let workingEl = null, approvalsEl = null, approvalsKey = '';
        function paint(chat) {
          (chat.messages || []).slice(seen).forEach(addMsg);
          seen = (chat.messages || []).length;
          if (workingEl) { workingEl.remove(); workingEl = null; }
          // Redraw the approval cards only when they change, so an open "exact command" stays open.
          const cardsKey = JSON.stringify((chat.pending || []).map(r => [r.ticket, r.plain]));
          if (approvalsEl && cardsKey === approvalsKey) msgsEl.appendChild(approvalsEl);
          if (approvalsEl && cardsKey !== approvalsKey) { approvalsEl.remove(); approvalsEl = null; }
          approvalsKey = cardsKey;
          viewingChat = current;
          if (!approvalsEl && (chat.pending || []).length) {
            approvalsEl = document.createElement('div');
            approvalsEl.style.cssText = 'display:flex;flex-direction:column;gap:10px';
            chat.pending.forEach(req => approvalsEl.appendChild(approvalCard(req, paint)));
            msgsEl.appendChild(approvalsEl);
          }
          if (chat.status === 'running') {
            workingEl = document.createElement('div'); workingEl.className = 'msg agent working';
            workingEl.textContent = (chat.activity || `${member.name} is working`) + '…';
            msgsEl.appendChild(workingEl);
          }
          msgsEl.scrollTop = msgsEl.scrollHeight;
        }
        function greet() {
          const g = document.createElement('div'); g.className = 'msg agent doc';
          g.innerHTML = `<span class="who">${escapeHtml(member.name)}</span><p>${escapeHtml(member.name)} here. What do you need?</p>`;
          msgsEl.appendChild(g);
        }

        async function loadList() {
          try {
            const d = await api(`/api/agent-chats?agent=${encodeURIComponent(member.name)}`);
            listEl.innerHTML = d.chats.length ? '' : '<div class="empty">No chats yet.</div>';
            d.chats.forEach(c => listEl.appendChild(rowEl(c.id === current ? 'current' : '',
              `<div class="main"><div class="t">${escapeHtml(c.title)}</div><div class="m">${escapeHtml(c.updated)} · ${c.turns} ` +
              `message${c.turns === 1 ? '' : 's'}</div></div>`, () => showTeamChat(member.name, c.id))));
          } catch (err) { failInto(listEl, err); }
        }
        async function refresh() {
          if (!current) return;
          try {
            const chat = await api(`/api/agent-chat?id=${encodeURIComponent(current)}`);
            const wasRunning = busy;
            paint(chat);
            setBusy(chat.status === 'running');
            if (busy) { clearTimeout(poll); poll = setTimeout(refresh, 2000); }
            else if (wasRunning) {
              loadList();
              const last = chat.messages[chat.messages.length - 1];
              if (last && last.who === 'agent' && !chat.job) speak(`${member.name} has replied.`);   // a job's own tray says it
              loadHires();
            }
          } catch (err) { clearTimeout(poll); poll = setTimeout(refresh, 5000); }
        }
        // While the agent works, the send button is Stop: it ends the agent's run at once.
        function setBusy(on) {
          busy = on;
          sendBtn.innerHTML = on ? STOP_ICON : ICON.send;
          sendBtn.title = on ? `Stop ${member.name} now` : 'Send (Enter)';
          sendBtn.classList.toggle('stopper', on);
        }
        async function stopAgent() {
          if (!current) return;
          sendBtn.disabled = true;
          try { paint(await api('/api/agent-chat/stop', { chat: current })); }
          catch (err) { setStatus('error', err.message, 4000); }
          finally { sendBtn.disabled = false; clearTimeout(poll); poll = setTimeout(refresh, 800); }
        }

        async function send() {
          const text = input.value.trim();
          if (!text || busy) return;
          setBusy(true); input.value = ''; input.style.height = 'auto';
          stopSpeaking();
          try {
            const chat = await api('/api/agent-chat', { agent: member.name, message: text, chat: current });
            if (!current) { msgsEl.innerHTML = ''; seen = 0; }
            current = chat.id;
            paint(chat);
            loadList();
            clearTimeout(poll); poll = setTimeout(refresh, 1500);
          } catch (err) {
            setBusy(false); input.value = text;
            setStatus('error', err.message, 5000);
          }
        }
        sendBtn.onclick = () => busy ? stopAgent() : send();
        input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
        input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(160, input.scrollHeight) + 'px'; };

        // Talk: keeps listening through pauses; click again to send.
        micBtn.onclick = () => {
          if (!Recognition) { setStatus('error', 'voice input needs Chrome or Edge', 4000); return; }
          if (listening) { listening = false; try { rec.stop(); } catch (_) {} return; }
          if (wantOn) micEl.onclick();
          stopSpeaking();
          rec = rec || new Recognition();
          Object.assign(rec, { lang: navigator.language || 'en-GB', interimResults: true, continuous: true });
          let base = input.value;
          rec.onresult = e => { if (!listening) return; let t = ''; for (const r of e.results) t += r[0].transcript; input.value = (base ? base + ' ' : '') + t.trim(); };
          rec.onerror = e => { if (FATAL_REC_ERRORS.has(e.error)) { listening = false; setStatus('error', REC_ERRORS[e.error] || e.error, 4000); } };
          rec.onend = () => {
            if (listening) { base = input.value; setTimeout(() => { if (listening) try { rec.start(); } catch (_) {} }, 150); return; }
            micBtn.classList.remove('on'); setStatus('');
            if (input.value.trim()) send();
          };
          listening = true; micBtn.classList.add('on'); setStatus('listening', 'listening… click the mic to send');
          try { rec.start(); } catch (_) {}
        };
        workEl.current.stop = () => {
          clearTimeout(poll); viewingChat = null;
          if (listening) { listening = false; input.value = ''; try { rec.stop(); } catch (_) {} }
        };

        loadList();
        if (current) refresh(); else greet();
        setTimeout(() => input.focus(), 50);
      }
    }, false);
  }


  const actionsSub = launcher({ icon: ICON.actions, title: 'Actions', sub: 'Tick off what’s done', color: tc('#a3e37a'), open: showActions });
  function updateActionsCard() { if (openActionCount != null) actionsSub.textContent = `${openActionCount} open`; }
  api('/api/actions').then(d => { openActionCount = d.actions.filter(a => !a.done).length; updateActionsCard(); }).catch(() => {});
  launcher({ icon: ICON.meetings, title: 'Meetings', sub: 'History and transcripts', color: tc('#ff9f43'), open: showMeetings });
  launcher({ icon: ICON.crm, title: 'CRM', sub: 'Organisations and contacts', color: tc('#f2c14e'), open: () => showCrm('organizations') });

  // Team Inbox and Deliverables: live folder listings. Notes fly to their dot; documents open in
  // their usual app; folders open in place.
  const FILE_ICONS = { md: '✦', pdf: '📕', docx: '📝', doc: '📝', xlsx: '📊', xls: '📊', csv: '📊', pptx: '📽',
                       png: '🖼', jpg: '🖼', jpeg: '🖼', gif: '🖼', svg: '🖼', html: '🌐' };
  const fmtSize = b => b < 1024 ? `${b} B` : b < 1048576 ? `${Math.round(b / 1024)} KB` : `${(b / 1048576).toFixed(1)} MB`;
  const fmtDate = s => new Date(s * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });

  // One row per entry: folders open in place, notes open as documents, anything else opens in
  // its usual desktop app. `root` is the folder's vault path; `load` opens a subfolder and
  // `refresh` redraws the listing. Right-click a row for Open, Show in folder and Delete.
  function folderEntries(b, data, { key, root, color, load, refresh }) {
    data.entries.forEach(e => {
      const ext = e.name.includes('.') ? e.name.split('.').pop().toLowerCase() : '';
      const note = ext === 'md' && nodeByPath.get(`${root}/${e.path.replace(/\.md$/i, '')}`.toLowerCase());
      const open = () => e.dir ? load(e.path) : ext === 'md' ? openDoc(`${root}/${e.path}`) : openInDesktop(key, e.path);
      const row = itemButton(b, {
        name: e.name, icon: e.dir ? '📁' : FILE_ICONS[ext] || '📄', color,
        sub: e.dir ? `Folder · ${fmtDate(e.modified)}` : `${fmtDate(e.modified)} · ${fmtSize(e.size)}${note ? ' · in the galaxy' : ''}`,
        title: (e.dir ? 'Open this folder' : ext === 'md' ? 'Read this note' : 'Open on your desktop') + ' · right-click for more',
        onClick: open
      });
      row.oncontextmenu = ev => {
        ev.preventDefault();
        contextMenu(ev.clientX, ev.clientY, [
          { label: e.dir ? 'Open folder' : ext === 'md' ? 'Read note' : 'Open', run: open },
          ...(e.dir || ext === 'md' ? [{ label: 'Open on desktop', run: () => openInDesktop(key, e.path) }] : []),
          { label: 'Show in File Explorer', run: () => api('/api/reveal', { name: key, path: e.path }).catch(err => setStatus('error', err.message, 4000)) },
          null,
          { label: e.dir ? 'Delete folder…' : 'Delete…', danger: true, run: () => trashEntry(key, root, e, refresh) },
        ]);
      };
    });
  }

  // Delete from a card: after a confirm, it moves to the vault's .trash folder (as Obsidian does),
  // so it leaves the vault, the cards and the galaxy but can still be brought back.
  async function trashEntry(key, root, e, refresh) {
    const what = e.dir ? `the folder "${e.name}" and everything in it` : `"${e.name}"`;
    if (!confirm(`Delete ${what}?\n\nIt moves to the vault's .trash folder, so you can still get it back from File Explorer.`)) return;
    try {
      const r = await api('/api/trash', { name: key, path: e.path });
      setStatus('thinking', `deleted ${e.name} (moved to ${r.trashed.split('/').slice(0, -1).join('/') || '.trash'})`, 5000);
      if (refresh) refresh();
    } catch (err) { setStatus('error', err.message, 5000); }
  }

  // A small menu at the pointer; Esc, a click elsewhere or scrolling closes it.
  const ctxEl = document.getElementById('ctxmenu');
  function contextMenu(x, y, items) {
    ctxEl.innerHTML = '';
    items.forEach(it => {
      if (!it) { const d = document.createElement('div'); d.className = 'sep'; ctxEl.appendChild(d); return; }
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'menuitem');
      b.textContent = it.label; if (it.danger) b.className = 'danger';
      b.onclick = () => { closeContextMenu(); it.run(); };
      ctxEl.appendChild(b);
    });
    ctxEl.hidden = false;
    const w = ctxEl.offsetWidth, h = ctxEl.offsetHeight;
    ctxEl.style.left = Math.min(x, innerWidth - w - 8) + 'px';
    ctxEl.style.top = Math.min(y, innerHeight - h - 8) + 'px';
    ctxEl.querySelector('button').focus();

  async function openInDesktop(key, path) {
